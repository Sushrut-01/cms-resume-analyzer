<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  K RECRUIT — LOGIN GATEWAY  (served at route /)             ║
  ║  This file is the active login page for K Recruit.          ║
  ║  After login with "Premium" UI selected, users are          ║
  ║  redirected to /static/preview.html (the main application). ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K Recruit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" integrity="sha384-aGlMNK3U/x0wl4lEH5jD1PGhJlX9hApuPmIiA5gtiYCOQ1J8ejIdC0btaU/TMoBD" crossorigin="anonymous"></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Inter', sans-serif; background: #F5F8FF; }
  input, select, textarea { font-family: 'Segoe UI', 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  input, select, textarea { outline: none !important; }
  input:focus, select:focus, textarea:focus { border-color: #1558CB !important; box-shadow: 0 0 0 3px rgba(21,88,203,0.12) !important; }
  input:valid, input:invalid { box-shadow: none !important; outline: none !important; }
  input:-webkit-autofill { box-shadow: 0 0 0 50px #fff inset !important; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ── AI Panel ──────────────────────────────────── */
  .ai-panel-wrap {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 200;
    display: flex; pointer-events: none;
  }
  .ai-panel-wrap.open { pointer-events: all; }
  .ai-resize-handle {
    width: 5px; cursor: col-resize; background: transparent;
    flex-shrink: 0; transition: background 0.15s;
  }
  .ai-resize-handle:hover, .ai-resize-handle.dragging {
    background: rgba(21,88,203,0.22);
  }
  .ai-panel-box {
    height: 100%; background: #fff; border-left: 1px solid #DDE4EE;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: -4px 0 24px rgba(21,88,203,0.1);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
  }
  .ai-panel-wrap.open .ai-panel-box { transform: translateX(0); }
  .ai-panel-head {
    height: 64px; background: linear-gradient(135deg,#1C3D6B 0%,#1558CB 100%);
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .ai-tabs {
    display: flex; flex-shrink: 0; background: #F5F8FF;
    border-bottom: 1px solid #DDE4EE;
  }
  .ai-tab {
    flex: 1; padding: 9px 0; text-align: center; font-size: 11px;
    font-weight: 600; color: #8A95A3; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.15s;
    position: relative;
  }
  .ai-tab.active { color: #1558CB; border-bottom-color: #1558CB; background: #fff; }
  .ai-tab .tab-live {
    width: 5px; height: 5px; border-radius: 50%; background: #00B4CC;
    position: absolute; top: 7px; right: calc(50% - 24px); display: none;
  }
  .ai-tab:first-child .tab-live { display: block; }
  .ai-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }

  /* context mode */
  .ctx-mode { padding: 12px; display: flex; flex-direction: column; gap: 9px; }
  .ctx-greet {
    background: linear-gradient(135deg,#EEF4FF,#F0FDFA);
    border: 1px solid #C7D9F8; border-radius: 10px; padding: 12px 14px;
  }
  .ctx-section { font-size: 10px; font-weight: 700; color: #8A95A3; text-transform: uppercase; letter-spacing: 0.1em; padding: 2px 0 0; }
  .insight-card {
    border-radius: 9px; border: 1px solid; padding: 10px 12px;
    cursor: pointer; transition: all 0.15s;
  }
  .insight-card:hover { transform: translateX(-2px); box-shadow: 3px 0 12px rgba(21,88,203,0.09); }
  .ic-action { font-size: 11px; font-weight: 600; margin-top: 6px; display: inline-flex; align-items: center; gap: 3px; }

  /* chat mode */
  .chat-mode { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
  .cmsg { display: flex; gap: 7px; align-items: flex-start; }
  .cmsg.user { flex-direction: row-reverse; }
  .cmsg-av { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-top: 2px; background: linear-gradient(135deg,#1558CB,#1042A8); }
  .cmsg-uav { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #1A2E4A; margin-top: 2px; background: #DDE4EE; }
  .cmsg-b { max-width: 82%; padding: 8px 11px; border-radius: 10px; font-size: 12.5px; line-height: 1.55; color: #1A2E4A; background: #F5F8FF; border: 1px solid #DDE4EE; white-space: pre-wrap; word-break: break-word; }
  .cmsg.user .cmsg-b { background: linear-gradient(135deg,#1558CB,#1042A8); color: #fff; border: none; }
  .chat-chips { padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
  .chat-chip { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1.5px solid #C7D9F8; color: #1558CB; background: #EEF4FF; cursor: pointer; transition: all 0.14s; }
  .chat-chip:hover { background: #1558CB; color: #fff; border-color: #1558CB; }
  .chat-input-row { padding: 8px 12px; border-top: 1px solid #DDE4EE; display: flex; gap: 7px; flex-shrink: 0; }
  .chat-inp { flex: 1; padding: 8px 11px; border: 1.5px solid #DDE4EE; border-radius: 8px; font-size: 13px; font-family: inherit; color: #1A2E4A; outline: none; resize: none; }
  .chat-inp:focus { border-color: #1558CB; }
  .chat-send { width: 34px; height: 34px; border-radius: 7px; background: linear-gradient(135deg,#1558CB,#1042A8); border: none; cursor: pointer; color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 8px rgba(21,88,203,0.28); }
  .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* actions mode */
  .act-mode { padding: 12px; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
  .act-grp { font-size: 10px; font-weight: 700; color: #8A95A3; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 2px 2px; }
  .act-btn-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px;
    background: #fff; border: 1.5px solid #DDE4EE; border-radius: 9px;
    cursor: pointer; transition: all 0.15s; text-align: left; width: 100%;
  }
  .act-btn-item:hover { border-color: #1558CB; background: #EEF4FF; transform: translateX(2px); }
  .act-arrow { font-size: 13px; color: #1558CB; margin-left: auto; opacity: 0; transform: translateX(-4px); transition: all 0.14s; }
  .act-btn-item:hover .act-arrow { opacity: 1; transform: translateX(0); }
  .act-badge { margin-left: auto; background: #EEF4FF; color: #1558CB; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }

  /* AI trigger button */
  .ai-trigger-btn {
    display: flex; align-items: center; gap: 8px; padding: 7px 15px;
    border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600;
    border: 1.5px solid #C7D9F8; background: #fff; color: #1558CB;
    transition: all 0.18s; box-shadow: 0 1px 4px rgba(21,88,203,0.1);
  }
  .ai-trigger-btn:hover { background: #EEF4FF; border-color: #1558CB; }
  .ai-trigger-btn.active { background: linear-gradient(135deg,#1558CB,#1042A8); color: #fff; border-color: #1558CB; box-shadow: 0 3px 12px rgba(21,88,203,0.3); }
  .ai-pulse { width: 8px; height: 8px; border-radius: 50%; background: #00B4CC; position: relative; flex-shrink: 0; }
  @keyframes pulseRing { 0%{transform:scale(1);opacity:0.55} 100%{transform:scale(2.4);opacity:0} }
  .ai-pulse::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid #00B4CC; opacity: 0.55; animation: pulseRing 1.9s ease-out infinite; }
  .ai-trigger-btn.active .ai-pulse { background: rgba(255,255,255,0.9); }
  .ai-trigger-btn.active .ai-pulse::after { border-color: rgba(255,255,255,0.7); }

  /* typing dots */
  .typing-dots { display: flex; gap: 3px; align-items: center; padding: 2px 0; }
  .typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: #8A95A3; animation: tdot 1.1s infinite ease-in-out; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes tdot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }

  /* Spotlight ────────────────────────────────────── */
  .spotlight-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(10,20,40,0.48); backdrop-filter: blur(3px);
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 15vh; opacity: 0; pointer-events: none; transition: opacity 0.18s;
  }
  .spotlight-overlay.open { opacity: 1; pointer-events: all; }
  .spotlight-box {
    width: 560px; background: #fff; border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.22), 0 0 0 1px rgba(21,88,203,0.12);
    overflow: hidden; transform: scale(0.95) translateY(-10px);
    transition: transform 0.18s ease;
  }
  .spotlight-overlay.open .spotlight-box { transform: scale(1) translateY(0); }
  .sl-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #EEF2F9; }
  .sl-input { flex: 1; font-size: 15px; font-family: inherit; color: #1A2E4A; border: none; outline: none; background: transparent; }
  .sl-results { padding: 6px; max-height: 340px; overflow-y: auto; }
  .sl-group { font-size: 10px; font-weight: 700; color: #8A95A3; text-transform: uppercase; letter-spacing: 0.09em; padding: 6px 10px 3px; }
  .sl-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.12s; }
  .sl-item:hover, .sl-item.sl-focused { background: #EEF4FF; }
  .sl-icon { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; background: #F5F8FF; border: 1px solid #DDE4EE; }
  .sl-title { font-size: 13px; font-weight: 600; color: #1A2E4A; }
  .sl-sub { font-size: 11px; color: #8A95A3; margin-top: 1px; }
  .sl-right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .sl-score { font-size: 12px; font-weight: 700; }
  .sl-kbd { display: flex; gap: 3px; }
  .kbd { background: #F5F8FF; border: 1px solid #DDE4EE; border-radius: 4px; padding: 1px 6px; font-size: 10px; color: #8A95A3; font-weight: 600; }
  .sl-footer { padding: 7px 14px; background: #F5F8FF; border-top: 1px solid #EEF2F9; display: flex; gap: 14px; align-items: center; }
  .sl-hint { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #8A95A3; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = "http://127.0.0.1:8000";

const C = {
  bg: "#F5F8FF", card: "#ffffff", sidebar: "#1C3D6B",
  accent: "#1558CB", accentSoft: "#EEF4FF",
  teal: "#0d9488", tealSoft: "#f0fdfa",
  gold: "#d97706", goldSoft: "#fffbeb",
  text: "#1A2E4A", muted: "#8A95A3", border: "#DDE4EE",
};
const font = { head: "'Segoe UI','Inter',sans-serif", body: "'Segoe UI','Inter',sans-serif", mono: "'Courier New', monospace" };

const api = {
  getCandidates: async () => {
    try { const r = await fetch(`${API}/candidates/`); const d = await r.json(); return d.data || []; } catch { return []; }
  },
  getCandidate: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}`); const d = await r.json(); return d.data || {}; } catch { return {}; }
  },
  uploadResume: async (file, clientRequirementId, recruiterName = "") => {
    const form = new FormData();
    form.append("file", file);
    form.append("client_requirement_id", clientRequirementId);
    form.append("recruiter_name", recruiterName);
    try {
      const r = await fetch(`${API}/candidates/upload`, { method: "POST", body: form });
      const data = await r.json();
      if (!r.ok) return { success: false, error: data?.detail || "Upload failed" };
      return data;
    } catch (e) { return { success: false, error: e.message }; }
  },
  getJDs: async () => {
    try { const r = await fetch(`${API}/client-requirements`); return await r.json(); }
    catch { return []; }
  },
  createJD: async (payload) => {
    try {
      const r = await fetch(`${API}/client-requirements`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      return await r.json();
    } catch (e) { return { error: e.message }; }
  },
  updateJD: async (id, payload) => {
    try {
      const r = await fetch(`${API}/client-requirements/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      return await r.json();
    } catch (e) { return { error: e.message }; }
  },
  deleteJD: async (id) => {
    try { const r = await fetch(`${API}/client-requirements/${id}`, { method: "DELETE" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  getRecruiters: async () => {
    try { const r = await fetch(`${API}/recruiters/`); const d = await r.json(); return d.data || []; }
    catch { return []; }
  },
  createRecruiter: async (name) => {
    try {
      const r = await fetch(`${API}/recruiters/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
      return await r.json();
    } catch (e) { return { success: false, error: e.message }; }
  },
  deleteRecruiter: async (id) => {
    try { const r = await fetch(`${API}/recruiters/${id}`, { method: "DELETE" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  analyze: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/analyze`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  approve: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/approve`, { method: "PUT" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  ollamaStatus: async () => {
    try { const r = await fetch(`${API}/candidates/system/ollama-status`); return await r.json(); }
    catch { return { online: false }; }
  },
  updateResume: async (id, text) => {
    const form = new FormData(); form.append("improved_text", text);
    try { const r = await fetch(`${API}/candidates/${id}/update`, { method: "PUT", body: form }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  generateJDAligned: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/generate-jd-aligned-resume`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  saveManualResume: async (id, text) => {
    const form = new FormData(); form.append("manual_text", text);
    try { const r = await fetch(`${API}/candidates/${id}/manual-resume`, { method: "PUT", body: form }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  downloadResume: (id) => { window.open(`${API}/candidates/${id}/download-resume`, '_blank'); },
  getJDAligned: async () => {
    try { const r = await fetch(`${API}/candidates/list/jd-aligned`); const d = await r.json(); return d.data || []; } catch { return []; }
  },
  getSettings: async () => {
    try { const r = await fetch(`${API}/settings/`); return await r.json(); } catch { return { success: false }; }
  },
  saveSettings: async (payload) => {
    try { const r = await fetch(`${API}/settings/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  testConnection: async () => {
    try { const r = await fetch(`${API}/settings/test`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, message: e.message }; }
  },
  login: async (username, password) => {
    try {
      const r = await fetch(`${API}/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }) });
      return await r.json();
    } catch (e) { return { success: false, detail: e.message }; }
  },
  verifyToken: async (token) => {
    try {
      const r = await fetch(`${API}/auth/verify`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
      if (!r.ok) return { valid: false };
      return await r.json();
    } catch { return { valid: false }; }
  },
  changeCredentials: async (username, password) => {
    try {
      const r = await fetch(`${API}/settings/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login_username: username, login_password: password }) });
      return await r.json();
    } catch (e) { return { success: false, error: e.message }; }
  },
};

const Badge = ({ label, color = C.teal, bg = C.tealSoft }) => (
  <span style={{ fontSize: 11, fontWeight: 700, color, background: bg, padding: "2px 10px", borderRadius: 20, whiteSpace: "nowrap" }}>{label}</span>
);

const Avatar = ({ initials, size = 36 }) => (
  <div style={{ width: size, height: size, borderRadius: "50%", background: "linear-gradient(135deg, #1558CB, #1042A8)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: size * 0.33, fontFamily: font.head, fontWeight: 700, flexShrink: 0 }}>{initials}</div>
);

const Btn = ({ children, onClick, variant = "primary", small, full, disabled }) => {
  const styles = {
    primary: { background: "linear-gradient(135deg,#1558CB,#1042A8)", color: "#fff", border: "none", boxShadow: "0 2px 8px rgba(21,88,203,0.22)" },
    outline: { background: "transparent", color: C.accent, border: `1.5px solid ${C.accent}` },
    ghost: { background: "transparent", color: C.muted, border: `1px solid ${C.border}` },
    success: { background: "linear-gradient(135deg,#0d9488,#0f766e)", color: "#fff", border: "none", boxShadow: "0 2px 6px rgba(13,148,136,0.2)" },
    warn: { background: C.gold, color: "#fff", border: "none" },
  };
  const s = styles[variant] || styles.primary;
  return (
    <button onClick={onClick} disabled={disabled} style={{ ...s, padding: small ? "6px 14px" : "9px 20px", borderRadius: 7, cursor: disabled ? "not-allowed" : "pointer", fontSize: small ? 12 : 13, fontFamily: font.body, fontWeight: 600, width: full ? "100%" : "auto", opacity: disabled ? 0.5 : 1, transition: "opacity 0.15s" }}>{children}</button>
  );
};

const StatCard = ({ label, value, sub, color = C.accent }) => (
  <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "18px 22px", flex: 1, minWidth: 130, boxShadow: "0 1px 4px rgba(21,88,203,0.07)", borderTop: `3px solid ${color}` }}>
    <div style={{ fontSize: 30, fontFamily: font.head, fontWeight: 800, color, letterSpacing: "-0.02em" }}>{value}</div>
    <div style={{ fontSize: 13, color: C.text, fontWeight: 600, marginTop: 4 }}>{label}</div>
    {sub && <div style={{ fontSize: 11, color: C.muted, marginTop: 3 }}>{sub}</div>}
  </div>
);

const Pagination = ({ total, perPage, page, setPage }) => {
  const totalPages = Math.ceil(total / perPage);
  if (totalPages <= 1) return null;
  const start = page * perPage + 1, end = Math.min((page + 1) * perPage, total);
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 20px", borderTop: `1px solid ${C.border}` }}>
      <button onClick={() => setPage(p => Math.max(0, p - 1))} disabled={page === 0} style={{ padding: "5px 14px", borderRadius: 6, border: `1px solid ${C.border}`, background: page === 0 ? C.bg : C.card, color: page === 0 ? C.muted : C.text, cursor: page === 0 ? "default" : "pointer", fontSize: 12 }}>← Prev</button>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{ fontSize: 11, color: C.muted }}>Showing {start}–{end} of {total}</span>
        <div style={{ display: "flex", gap: 4 }}>
          {Array.from({ length: totalPages }, (_, p) => (
            <button key={p} onClick={() => setPage(p)} style={{ width: 28, height: 28, borderRadius: 6, border: `1px solid ${p === page ? C.teal : C.border}`, background: p === page ? C.tealSoft : C.bg, color: p === page ? C.teal : C.muted, cursor: "pointer", fontSize: 12, fontWeight: p === page ? 700 : 400 }}>{p + 1}</button>
          ))}
        </div>
      </div>
      <button onClick={() => setPage(p => Math.min(totalPages - 1, p + 1))} disabled={page >= totalPages - 1} style={{ padding: "5px 14px", borderRadius: 6, border: `1px solid ${C.border}`, background: page >= totalPages - 1 ? C.bg : C.card, color: page >= totalPages - 1 ? C.muted : C.text, cursor: page >= totalPages - 1 ? "default" : "pointer", fontSize: 12 }}>Next →</button>

// ── Entra ID / MSAL config ────────────────────────────────────────────────────
// ENTRA_CLIENT_ID and ENTRA_TENANT_ID are injected by the backend at /auth/entra-config
// If not configured, the "Sign in with Microsoft" button is hidden.
let _msalInstance = null;
async function _getMsal() {
  if (_msalInstance) return _msalInstance;
  try {
    const r = await fetch(`${API}/auth/entra-config`);
    const cfg = await r.json();
    if (!cfg.client_id || !cfg.tenant_id) return null;
    _msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId:   cfg.client_id,
        authority:  `https://login.microsoftonline.com/${cfg.tenant_id}`,
        redirectUri: window.location.origin,
      },
      cache: { cacheLocation: "sessionStorage" },
    });
    await _msalInstance.initialize();
    return _msalInstance;
  } catch { return null; }
}

async function handleMicrosoftLogin(uiPref, onLogin, setError, setMsLoading) {
  setMsLoading(true); setError("");
  try {
    const msal = await _getMsal();
    if (!msal) { setError("Microsoft login is not configured. Contact admin."); setMsLoading(false); return; }
    const result = await msal.loginPopup({ scopes: ["openid","profile","email"] });
    const idToken = result.idToken;
    const r = await fetch(`${API}/auth/microsoft`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id_token: idToken }),
    });
    const res = await r.json();
    if (res.success && res.token) {
      localStorage.setItem("cms_token",       res.token);
      localStorage.setItem("cms_username",    res.username || "");
      localStorage.setItem("cms_role",        res.role || "recruiter");
      if (res.user_id)     localStorage.setItem("cms_user_id",     String(res.user_id));
      if (res.permissions) localStorage.setItem("cms_permissions", JSON.stringify(res.permissions));
      localStorage.setItem("cms_ui_pref", uiPref);
      if (uiPref === "premium") {
        window.location.href = "/static/preview.html";
      } else {
        onLogin(res.token, res.username || "");
      }
    } else {
      setError(res.detail || res.error || "Microsoft login failed. Your account may not be set up in K Recruit.");
    }
  } catch (e) {
    if (e.errorCode !== "user_cancelled") {
      setError("Microsoft sign-in error. Please try again or use email/password.");
    }
  }
  setMsLoading(false);
}

  const [insightsLoading, setInsightsLoading] = React.useState(false);
  const handleRef = React.useRef(null);
  const chatEndRef = React.useRef(null);
  const dragging = React.useRef(false);

  // Resize drag
  React.useEffect(() => {
    const handle = handleRef.current;
    if (!handle) return;
    const onDown = (e) => { dragging.current = true; handle.classList.add("dragging"); document.body.style.cursor = "col-resize"; document.body.style.userSelect = "none"; e.preventDefault(); };
    const onMove = (e) => { if (!dragging.current) return; const w = Math.min(Math.max(window.innerWidth - e.clientX, 260), 660); onWidthChange(w); };
    const onUp   = () => { if (!dragging.current) return; dragging.current = false; handle.classList.remove("dragging"); document.body.style.cursor = ""; document.body.style.userSelect = ""; };
    handle.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => { handle.removeEventListener("mousedown", onDown); window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };

// ── Spotlight ────────────────────────────────────────────────────────
function Spotlight({ open, onClose, setPage, setSelectedId, candidates }) {
  const [query, setQuery] = React.useState("");
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (open) { setQuery(""); setTimeout(() => inputRef.current && inputRef.current.focus(), 30); }
  }, [open]);

  React.useEffect(() => {
    const h = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);

  const navPages = [
    { id: "dashboard",   icon: "⬛", label: "Dashboard",       sub: "Overview of all activity" },
    { id: "jdmanager",   icon: "📋", label: "JD Manager",       sub: "Manage job descriptions" },
    { id: "upload",      icon: "⬆", label: "Upload Resume",    sub: "Add new candidate" },
    { id: "listing",     icon: "☰", label: "Candidate List",   sub: "Browse all candidates" },
    { id: "pipeline",    icon: "⚙", label: "Pipeline Status",  sub: "View pipeline health" },
    { id: "settings",    icon: "◎", label: "Settings",         sub: "AI & account configuration" },
  ];

  const q = query.toLowerCase();
  const filteredNav   = q ? navPages.filter(p => p.label.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q)) : navPages;
  const filteredCands = q && candidates ? candidates.filter(c => c.name && c.name.toLowerCase().includes(q)).slice(0, 5) : [];
  const scoreColor    = (s) => s >= 80 ? "#0d9488" : s >= 60 ? "#d97706" : "#ef4444";

  return (
    <div className={`spotlight-overlay${open ? " open" : ""}`} onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="spotlight-box">
        <div className="sl-head">
          <span style={{ fontSize: 16, color: "#8A95A3" }}>🔍</span>
          <input ref={inputRef} className="sl-input" placeholder="Search pages, candidates…" value={query}
            onChange={e => setQuery(e.target.value)} onKeyDown={e => e.key === "Escape" && onClose()} />
          <div className="sl-kbd"><span className="kbd">Esc</span></div>
        </div>
        <div className="sl-results">
          {filteredNav.length > 0 && <>
            <div className="sl-group">Navigate</div>
            {filteredNav.map(p => (
              <div key={p.id} className="sl-item" onClick={() => { setPage(p.id); onClose(); }}>
                <div className="sl-icon">{p.icon}</div>
                <div><div className="sl-title">{p.label}</div><div className="sl-sub">{p.sub}</div></div>
                <div className="sl-right"><div className="sl-kbd"><span className="kbd">↵</span></div></div>
              </div>
            ))}
          </>}
          {filteredCands.length > 0 && <>
            <div className="sl-group">Candidates</div>
            {filteredCands.map(c => (
              <div key={c.id} className="sl-item" onClick={() => { setSelectedId(c.id); setPage("review"); onClose(); }}>
                <div className="sl-icon" style={{ background: "#EEF4FF", border: "1px solid #C7D9F8" }}>👤</div>
                <div><div className="sl-title">{c.name}</div><div className="sl-sub">{c.role || "No role"} · {c.status}</div></div>
                <div className="sl-right">
                  {c.score != null && <span className="sl-score" style={{ color: scoreColor(c.score) }}>{c.score}%</span>}
                  <div className="sl-kbd"><span className="kbd">↵</span></div>
                </div>
              </div>
            ))}
          </>}
          {q && filteredNav.length === 0 && filteredCands.length === 0 && (
            <div style={{ padding: "20px", textAlign: "center", color: "#8A95A3", fontSize: 13 }}>No results for "{query}"</div>
          )}
        </div>
        <div className="sl-footer">
          <div className="sl-hint"><span className="kbd">↵</span> Open</div>
          <div className="sl-hint"><span className="kbd">Esc</span> Close</div>
          <div style={{ marginLeft: "auto" }}>
            <span className="sl-hint"><span className="kbd">Ctrl</span><span className="kbd">K</span> toggle</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function PageUpload({ setPage, setSelectedId, startAI, stopAI }) {
  const [file, setFile] = useState(null);
  const [jds, setJds] = useState([]);
  const [recruiters, setRecruiters] = useState([]);
  const [selectedJD, setSelectedJD] = useState("");
  const [recruiterName, setRecruiterName] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [checked, setChecked] = useState({ image: false, email: false, mobile: false, summary: false });

  useEffect(() => { api.getJDs().then(setJds); api.getRecruiters().then(setRecruiters); }, []);

  const selectedJDObj = jds.find(j => j.id === Number(selectedJD));

  const handleUpload = async () => {
    if (!file) { alert("Please select a PDF resume."); return; }
    if (!selectedJD) { alert("Please select a Job Description. Go to JD Manager to create one first."); return; }
    setLoading(true);
    const res = await api.uploadResume(file, Number(selectedJD), recruiterName.trim());
    setLoading(false);
    if (!res.success) { alert("Upload failed: " + (res.error || "Unknown error")); return; }
    const ext = res.extracted || {};
    setChecked({ image: false, email: !!ext.email, mobile: !!ext.mobile, summary: !!ext.summary });
    if (setSelectedId) setSelectedId(res.candidate_id);
    setResult(res);
  };

  return (
    <div>
      <Topbar title="Upload Resume" sub="Upload candidate PDF and select a Job Description" setPage={setPage} />
      <div style={{ padding: 28, maxWidth: 860 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 24 }}>

            <label style={{ display: "block", border: `2px dashed ${file ? C.teal : C.border}`, borderRadius: 10, padding: "32px 20px", textAlign: "center", background: file ? C.tealSoft : C.bg, cursor: "pointer" }}>
              <div style={{ fontSize: 36, marginBottom: 10 }}>📄</div>
              <div style={{ fontSize: 13, color: C.muted }}>Click to upload PDF</div>
              {file && <div style={{ marginTop: 10, color: C.teal, fontSize: 12, fontWeight: 600 }}>✓ {file.name}</div>}
              <input type="file" accept=".pdf" style={{ display: "none" }} onChange={e => setFile(e.target.files[0])} />

          </div>
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 24 }}>

          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>

            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <Btn onClick={handleUpload} disabled={loading}>{loading ? "Uploading..." : "⬆ Upload Resume"}</Btn>
          <Btn variant="ghost" onClick={() => setPage("dashboard")}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}

// ── Resume section parser (client-side) ──────────────────────────────────────
function parseSections(text) {
  if (!text) return [];
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];

  // ━━━ structured format
  if ((text.match(/━/g) || []).length > 10) {
    const nameMap = {
      "PROFESSIONAL SUMMARY": "Summary",
      "TECHNICAL SKILLS": "Skills",
      "WORK EXPERIENCE": "Work Experience",
      "PROJECT SUMMARY": "Projects",
      "EDUCATION": "Education",
      "CERTIFICATIONS": "Certifications",
    };
    const parts = text.split(/━{5,}/).map(p => p.trim()).filter(Boolean);
    const found = {};
    for (let i = 0; i < parts.length; i++) {
      const label = nameMap[parts[i].toUpperCase()];
      if (label && i + 1 < parts.length) found[label] = parts[i + 1];
    }
    return ORDER.filter(k => found[k]).map(k => ({ label: k, content: found[k] }));
  }

  // Plain keyword fallback
  const kwMap = {
    "summary": "Summary", "professional summary": "Summary",
    "objective": "Summary", "profile": "Summary", "about me": "Summary",
    "skills": "Skills", "technical skills": "Skills",
    "key skills": "Skills", "core competencies": "Skills", "expertise": "Skills",
    "experience": "Work Experience", "work experience": "Work Experience",
    "professional experience": "Work Experience", "employment": "Work Experience",
    "project": "Projects", "project summary": "Projects", "projects": "Projects",
    "education": "Education", "academic": "Education", "qualification": "Education",
    "certif": "Certifications", "certification": "Certifications",
    "achievement": "Certifications",
  };
  const lines = text.split("\n");
  let current = null;
  const buf = {};
  for (const line of lines) {
    const s = line.trim();
    const lo = s.toLowerCase();
    let matched = null;
    for (const [kw, lbl] of Object.entries(kwMap)) {
      if (lo.startsWith(kw) && s.length < 65) { matched = lbl; break; }
    }
    if (matched) { current = matched; buf[current] = buf[current] || []; }
    else if (current && s) buf[current].push(s);
  }
  return ORDER.filter(k => buf[k]?.length).map(k => ({ label: k, content: buf[k].join("\n") }));
}

function sectionBadge(before, after) {
  if (!after && !before) return null;
  if (!after || after.trim() === (before || "").trim()) return { label: "unchanged", color: C.muted, bg: "#f0f0ee" };
  const bWords = new Set((before || "").toLowerCase().split(/\s+/).filter(Boolean));
  const aWords = new Set(after.toLowerCase().split(/\s+/).filter(Boolean));
  const common = [...bWords].filter(w => aWords.has(w)).length;
  const sim = bWords.size ? common / Math.max(bWords.size, aWords.size) : 0;
  if (aWords.size > bWords.size * 1.25) return { label: "expanded", color: "#7c6af7", bg: "#eeecff" };
  if (sim < 0.65) return { label: "improved", color: C.teal, bg: C.tealSoft };
  return { label: "updated", color: C.gold, bg: C.goldSoft };
}

function SectionDiff({ beforeText, afterText }) {
  const beforeSecs = parseSections(beforeText);
  const afterSecs  = parseSections(afterText);

  const allLabels = [...new Set([...beforeSecs.map(s => s.label), ...afterSecs.map(s => s.label)])];
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];
  const labels = [...ORDER.filter(l => allLabels.includes(l)), ...allLabels.filter(l => !ORDER.includes(l))];

  const bMap = Object.fromEntries(beforeSecs.map(s => [s.label, s.content]));
  const aMap = Object.fromEntries(afterSecs.map(s => [s.label, s.content]));

  const noAfter = !afterText || afterText.trim().length < 10;

  const colStyle = (tint) => ({
    flex: 1, minWidth: 0, background: tint, border: `1px solid ${C.border}`,
    borderRadius: 10, overflow: "hidden",
  });
  const hdrStyle = (color) => ({
    padding: "12px 18px", borderBottom: `1px solid ${C.border}`,
    fontSize: 11, fontWeight: 700, letterSpacing: "0.1em",
    textTransform: "uppercase", color, background: "rgba(0,0,0,0.03)",
  });

  return (
    <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
      {/* BEFORE column */}
      <div style={colStyle("#ffffff")}>
        <div style={hdrStyle(C.muted)}>Before (Original)</div>
        {labels.map((label, i) => {
          const content = bMap[label] || "";
          return (
            <div key={label} style={{ borderBottom: i < labels.length - 1 ? `1px solid ${C.border}` : "none" }}>
              <div style={{ padding: "10px 18px 4px", fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>
                {label}
              </div>
              <div style={{ padding: "0 18px 14px", fontSize: 12, color: content ? C.text : C.muted, lineHeight: 1.7, whiteSpace: "pre-wrap", fontFamily: font.body }}>
                {content || <em style={{ opacity: 0.4 }}>—</em>}
              </div>
            </div>
          );
        })}
      </div>

      {/* AFTER column */}
      <div style={colStyle("#f5fffe")}>
        <div style={hdrStyle(C.teal)}>After (AI Improved)</div>
        {noAfter ? (
          <div style={{ padding: 40, textAlign: "center", color: C.muted }}>
            <div style={{ fontSize: 28, marginBottom: 10 }}>🤖</div>
            <div style={{ fontSize: 13 }}>Click <strong>▶ Run AI</strong> to generate improvements</div>
          </div>
        ) : labels.map((label, i) => {
          const before  = bMap[label] || "";
          const after   = aMap[label] || "";
          const badge   = sectionBadge(before, after);
          return (
            <div key={label} style={{ borderBottom: i < labels.length - 1 ? `1px solid ${C.border}` : "none" }}>
              <div style={{ padding: "10px 18px 4px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>{label}</span>
                {badge && (
                  <span style={{ fontSize: 10, fontWeight: 700, color: badge.color, background: badge.bg, padding: "2px 10px", borderRadius: 20 }}>
                    {badge.label}
                  </span>
                )}
              </div>
              <div style={{ padding: "0 18px 14px", fontSize: 12, color: after ? C.text : C.muted, lineHeight: 1.7, whiteSpace: "pre-wrap", fontFamily: font.body, background: badge && badge.label !== "unchanged" ? `${badge.bg}55` : "transparent", borderRadius: 6, margin: "0 8px 6px" }}>
                {after || before || <em style={{ opacity: 0.4 }}>—</em>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

                                {ctx && <div style={{ fontSize: 10, color: "#92400e", marginTop: 3, marginLeft: 4, fontStyle: "italic", lineHeight: 1.4 }}>"{ctx}"</div>}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                      {legacyGaps.length > 0 && (
                        <div style={{ background: C.accentSoft, border: `1px solid ${C.accent}44`, borderRadius: 10, padding: 12 }}>
                          <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 6 }}>⚠ Gaps</div>
                          {legacyGaps.map((g, i) => <div key={i} style={{ fontSize: 11, color: C.text, marginBottom: 3 }}>• {g}</div>)}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}

            {botOpen && (
              <div style={{ background: "#0d1b2e", borderRadius: 10, padding: 20, marginBottom: 16, border: "1px solid rgba(21,88,203,0.3)" }}>
                <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700, color: "#fff", marginBottom: 12 }}>🤖 Bot Agent — Action Plan</div>
                {(candidate.recommendations || []).length === 0 && <div style={{ color: "rgba(255,255,255,0.5)", fontSize: 12 }}>Run AI Analysis first to see the action plan.</div>}
                {(candidate.recommendations || []).map((rec, i) => (
                  <div key={i} style={{ background: rec.priority === "MUST HAVE" ? "rgba(220,38,38,0.12)" : "rgba(255,255,255,0.05)", border: rec.priority === "MUST HAVE" ? "1px solid rgba(220,38,38,0.3)" : "none", borderRadius: 8, padding: "12px 14px", marginBottom: 10 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                      {rec.priority === "MUST HAVE" && <span style={{ background: "#dc2626", color: "#fff", borderRadius: 4, padding: "1px 7px", fontSize: 10, fontWeight: 700 }}>MUST HAVE</span>}
                      <span style={{ fontSize: 12, color: C.accent, fontWeight: 700 }}>{rec.section}</span>
                    </div>
                    <div style={{ fontSize: 11, color: "#f87171", marginBottom: 4 }}>⚠ {rec.issue}</div>
                    <div style={{ fontSize: 11, color: "#4ade80" }}>✓ {rec.fix}</div>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 4, marginBottom: 0 }}>
              {[{ id: "diff", label: "Before / After" }, { id: "edit", label: "Edit Mode" }].map(t => (
                <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: "7px 18px", borderRadius: "6px 6px 0 0", cursor: "pointer", border: `1px solid ${C.border}`, borderBottom: tab === t.id ? `1px solid ${C.card}` : `1px solid ${C.border}`, background: tab === t.id ? C.card : C.bg, color: tab === t.id ? C.text : C.muted, fontSize: 12, fontWeight: 600 }}>{t.label}</button>
              ))}
            </div>

            {tab === "diff" && (
              <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: "0 10px 10px 10px", padding: 16 }}>
                <SectionDiff
                  beforeText={candidate.original_resume_text || ""}
                  afterText={candidate.improved_resume_text || ""}
                />
              </div>
            )}

            {tab === "edit" && (
              <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: "0 10px 10px 10px", padding: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: C.text, marginBottom: 10 }}>Edit Resume — Make changes and save</div>
                <textarea value={editText} onChange={e => setEditText(e.target.value)} style={{ width: "100%", height: 580, padding: "10px 12px", border: `1px solid ${C.accent}44`, borderRadius: 8, fontSize: 11, fontFamily: font.mono, background: C.bg, resize: "vertical", lineHeight: 1.6 }} />
                <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                  <Btn onClick={handleSave} variant="success" disabled={saving}>{saving ? "Saving..." : "💾 Save Changes"}</Btn>
                </div>
              </div>
            )}
          </>
        )}

        {!candidate && candidates.length === 0 && (
          <div style={{ textAlign: "center", padding: 60, color: C.muted }}>
            No candidates yet. <span style={{ color: C.accent, cursor: "pointer" }} onClick={() => setPage("upload")}>Upload a resume</span> to get started!
          </div>
        )}
      </div>
    </div>
  );
}

function ResumePreview({ text }) {
  const sections = parseSections(text || "");

  // Extract header lines (name, role, contact) before first real section
  const headerLines = [];
  for (const line of (text || "").split("\n").slice(0, 12)) {
    const s = line.trim();
    if (!s || s.match(/━{3,}/)) continue;
    const up = s.toUpperCase();
    if (["PROFESSIONAL SUMMARY","TECHNICAL SKILLS","WORK EXPERIENCE","PROJECT SUMMARY","EDUCATION","CERTIFICATIONS"].includes(up)) break;
    headerLines.push(s);
  }

  if (!text || (!sections.length && !headerLines.length)) {
    return <div style={{ padding: 24, color: C.muted, fontSize: 12, textAlign: "center" }}>No content to preview.</div>;
  }

  const sectionIcons = { Summary: "📝", Skills: "⚡", "Work Experience": "💼", Projects: "🚀", Education: "🎓", Certifications: "🏆" };

  return (
    <div style={{ padding: "16px 20px", overflowY: "auto", maxHeight: 700 }}>
      {headerLines.length > 0 && (
        <div style={{ textAlign: "center", marginBottom: 18, paddingBottom: 14, borderBottom: `2px solid ${C.teal}44` }}>
          {headerLines[0] && <div style={{ fontSize: 17, fontWeight: 700, color: C.sidebar, fontFamily: font.head, marginBottom: 3 }}>{headerLines[0]}</div>}
          {headerLines[1] && !headerLines[1].includes("@") && !headerLines[1].match(/\d{8,}/) && (
            <div style={{ fontSize: 12, color: C.accent, fontWeight: 600, marginBottom: 4 }}>{headerLines[1]}</div>
          )}
          {headerLines.slice(1).filter(l => l.includes("@") || l.includes("📧") || l.includes("📱") || l.includes("📍") || l.includes("linkedin")).map((l, i) => (
            <div key={i} style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{l}</div>
          ))}
        </div>
      )}
      {sections.map((sec) => (
        <div key={sec.label} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6, paddingBottom: 5, borderBottom: `1px solid ${C.border}` }}>
            <span style={{ fontSize: 13 }}>{sectionIcons[sec.label] || "📌"}</span>
            <span style={{ fontSize: 10, fontWeight: 700, color: C.teal, letterSpacing: "0.12em", textTransform: "uppercase" }}>{sec.label}</span>
          </div>
          <div style={{ fontSize: 12, color: C.text, lineHeight: 1.8, whiteSpace: "pre-wrap", fontFamily: font.body }}>
            {sec.content.split("\n").map((line, i) => {
              const s = line.trim();
              if (!s) return null;
              const isBullet = /^[-•◦◆▪*]/.test(s);
              const isDraft  = s.startsWith("[DRAFT");
              return (
                <div key={i} style={{ display: "flex", gap: 8, marginBottom: isBullet ? 3 : 5, color: isDraft ? C.gold : C.text }}>
                  {isBullet && <span style={{ color: C.teal, flexShrink: 0, marginTop: 1 }}>•</span>}
                  <span style={{ fontWeight: isDraft ? 600 : 400, fontStyle: isDraft ? "italic" : "normal" }}>
                    {isBullet ? s.replace(/^[-•◦◆▪*]\s*/, "") : s}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function PageJDAlign({ setPage, selectedId, startAI, stopAI, alignState, setAlignState }) {
  const [candidates, setCandidates] = useState([]);
  const [candidate, setCandidate] = useState(null);
  const [draftText, setDraftText] = useState("");
  const [generating, setGenerating] = useState(false);
  const [saving, setSaving] = useState(false);
  const [generated, setGenerated] = useState(false);
  const [genStats, setGenStats] = useState(null);
  const [draftView, setDraftView] = useState("edit");
  const [roleCompat, setRoleCompat] = useState(null);
  const [overrideCompat, setOverrideCompat] = useState(false);

  useEffect(() => { api.getCandidates().then(setCandidates); }, []);

  // Restore persisted alignment state when returning to this page
  useEffect(() => {
    if (alignState && alignState.draftText) {
      setDraftText(alignState.draftText);
      setGenStats(alignState.genStats || null);
      setGenerated(true);
    }
  }, []);

  useEffect(() => {
    if (selectedId) loadCandidate(selectedId);
    else if (alignState?.candidateId) loadCandidate(alignState.candidateId);
    else if (candidates.length > 0) loadCandidate(candidates[0].id);
  }, [selectedId, candidates]);

  const loadCandidate = async (id) => {
    const c = await api.getCandidate(id);
    setCandidate(c);
    setOverrideCompat(false);
    // Fetch role compatibility (uses cached DB value or detects live)
    try {
      const rc = await fetch(`/candidates/${id}/role-compatibility`).then(r => r.json());
      setRoleCompat(rc);
    } catch (_) {
      setRoleCompat(null);
    }
    // If we have a persisted draft for this candidate, use it; otherwise use saved
    if (alignState?.candidateId === id && alignState?.draftText) {
      setDraftText(alignState.draftText);
      setGenStats(alignState.genStats || null);
      setGenerated(true);
    } else {
      setDraftText(c.manual_resume_text || "");
      setGenerated(!!c.manual_resume_text);
      const hist = c.align_history || [];
      if (hist.length > 0) {
        const last = hist[hist.length - 1];
        setGenStats({ skills: last.added_skills || 0, projects: last.added_projects || 0, scoreBefore: last.score_before || 0, scoreAfter: last.score_after || 0, semBefore: last.sem_score_before ?? null, semAfter: last.sem_score_after ?? null, rephrased: last.rephrased_count || 0 });
      } else {
        setGenStats(null);
      }
    }
  };

  const handleGenerate = async () => {
    if (!candidate) return;
    setGenerating(true);
    startAI && startAI("Generating JD-Aligned Resume for " + (candidate.name || "candidate") + "...");
    const res = await api.generateJDAligned(candidate.id);
    setGenerating(false);
    stopAI && stopAI();
    if (res.success) {
      const stats = { skills: res.added_skills || 0, projects: res.added_projects || 0, scoreBefore: res.score_before || 0, scoreAfter: res.score_after || 0, semBefore: res.sem_score_before ?? null, semAfter: res.sem_score_after ?? null, rephrased: res.rephrased_count || 0 };
      setDraftText(res.draft_resume);
      setGenerated(true);
      setGenStats(stats);
      // Persist to App-level so navigating away and back doesn't lose the result
      setAlignState && setAlignState({ draftText: res.draft_resume, genStats: stats, candidateId: candidate.id });
      const updated = await api.getCandidate(candidate.id);
      setCandidate(updated);
    } else alert("Generation failed: " + (res.error || "Error"));
  };

  const handleSave = async () => {
    if (!candidate || !draftText) return;
    setSaving(true);
    const res = await api.saveManualResume(candidate.id, draftText);
    setSaving(false);
    if (res.success) alert("✅ JD-Aligned resume saved! Click ⬇ Download to get Word doc.");
    else alert("Save failed!");
  };

  return (
    <div>
      <Topbar title="JD Alignment & Resume Editor" sub="Generate and edit JD-aligned resume draft" setPage={setPage} />
      <div style={{ padding: "24px 32px" }}>

        <div style={{ background: "#fef3cd", border: "1px solid #e9c46a", borderRadius: 10, padding: "12px 20px", marginBottom: 20, display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 20 }}>⚠️</span>
          <div style={{ fontSize: 13, color: "#7a5c00" }}>
            <strong>JD-Aligned Resume Draft</strong> — AI-generated draft for editing. Review all content carefully before saving and downloading. Label: <strong>"JD-Aligned Resume – User Edited"</strong>
          </div>
        </div>

        <div style={{ marginBottom: 16 }}>
          <select onChange={e => loadCandidate(Number(e.target.value))} value={candidate?.id || ""} style={{ padding: "9px 12px", border: `1.5px solid ${C.border}`, borderRadius: 7, fontSize: 13, background: "#fff", color: C.text }}>
            {candidates.map(c => <option key={c.id} value={c.id}>{c.name || "Unknown"} — {c.company_name || "N/A"}</option>)}
          </select>
        </div>

        {roleCompat && roleCompat.verdict && (() => {
          const isIncompat = roleCompat.verdict === "incompatible";
          const isAdj = roleCompat.verdict === "adjacent";
          const bg = isIncompat ? "#fef2f2" : isAdj ? "#fffbea" : "#f0fdf4";
          const border = isIncompat ? "#ef4444" : isAdj ? "#f59e0b" : "#22c55e";
          const icon = isIncompat ? "❌" : isAdj ? "⚠️" : "✅";
          const textColor = isIncompat ? "#991b1b" : isAdj ? "#92400e" : "#166534";
          return (
            <div style={{ background: bg, border: `1px solid ${border}`, borderRadius: 10, padding: "14px 20px", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                <span style={{ fontSize: 22, flexShrink: 0, marginTop: 1 }}>{icon}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: textColor, marginBottom: 4 }}>
                    {isIncompat ? "Role Mismatch Detected" : isAdj ? "Partial Role Match" : "Role Match Confirmed"}
                  </div>
                  <div style={{ fontSize: 13, color: textColor, marginBottom: 6 }}>
                    {roleCompat.message}
                  </div>
                  <div style={{ display: "flex", gap: 16, fontSize: 12, color: textColor }}>
                    <span>Candidate: <strong>{roleCompat.candidate_function || "—"}</strong></span>
                    <span>JD Requires: <strong>{roleCompat.jd_function || "—"}</strong></span>
                  </div>
                  {isIncompat && !overrideCompat && (
                    <div style={{ marginTop: 10 }}>
                      <span style={{ fontSize: 12, color: textColor, marginRight: 12 }}>Generation blocked. Recruiter override required.</span>
                      <button onClick={() => setOverrideCompat(true)} style={{ fontSize: 12, padding: "4px 14px", background: "#ef4444", color: "#fff", border: "none", borderRadius: 6, cursor: "pointer", fontWeight: 600 }}>
                        Override & Generate Anyway
                      </button>
                    </div>
                  )}
                  {isIncompat && overrideCompat && (
                    <div style={{ marginTop: 8, fontSize: 12, color: "#b91c1c", fontWeight: 600 }}>
                      ⚠ Override active — generating despite role mismatch.
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        })()}

        {candidate && (
          <>
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px 20px", marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <Avatar initials={(candidate.name || "??").slice(0, 2).toUpperCase()} size={44} />
                <div>
                  <div style={{ fontSize: 16, fontFamily: font.head, fontWeight: 700 }}>{candidate.name || "Unknown"}</div>
                  {candidate.role && <div style={{ fontSize: 12, color: C.teal, fontWeight: 600, marginBottom: 2 }}>{candidate.role}</div>}
                  <div style={{ fontSize: 12, color: C.muted }}>
                    {candidate.score > 0 ? `Tech Score: ${candidate.score}%` : "Not yet analyzed"} · {candidate.company_name || ""} · {candidate.status}
                    {candidate.recruiter_name && <span style={{ marginLeft: 8 }}>· 👤 {candidate.recruiter_name}</span>}
                    {candidate.align_history?.length > 0 && <span style={{ marginLeft: 8, color: C.teal }}>· {candidate.align_history.length} alignment run{candidate.align_history.length > 1 ? "s" : ""}</span>}
                  </div>
                  {candidate.match_level && <Badge label={`${candidate.match_level} Match`} color={candidate.match_level === "High" ? C.teal : C.gold} bg={candidate.match_level === "High" ? C.tealSoft : C.goldSoft} />}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <Btn onClick={handleGenerate} variant="primary" disabled={generating || (roleCompat?.verdict === "incompatible" && !overrideCompat)}>{generating ? "⏳ Generating..." : "🧠 Generate JD Draft"}</Btn>
                <Btn onClick={handleSave} variant="success" disabled={saving || !draftText}>{saving ? "Saving..." : "💾 Save Draft"}</Btn>
                <Btn onClick={() => api.downloadResume(candidate.id)} variant="outline" disabled={!generated}>⬇ Download .docx</Btn>
              </div>
            </div>

            {genStats && (
              <div style={{ background: C.tealSoft, border: `1px solid ${C.teal}`, borderRadius: 10, padding: "12px 20px", marginBottom: 16 }}>
                <div style={{ display: "flex", gap: 24, alignItems: "center", flexWrap: "wrap", marginBottom: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: C.teal }}>✅ JD Alignment Complete</span>
                  <span style={{ fontSize: 12, color: C.text }}>🔑 <strong>{genStats.skills}</strong> new keywords injected</span>
                  {genStats.rephrased > 0 && <span style={{ fontSize: 12, color: C.text }}>✏️ <strong>{genStats.rephrased}</strong> soft gaps rephrased</span>}
                  <span style={{ fontSize: 12, color: C.text }}>🚀 <strong>{genStats.projects}</strong> draft projects added</span>
                </div>
                {genStats.scoreBefore > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 11, color: C.muted, width: 120 }}>🔤 ATS Match:</span>
                      <span style={{ fontSize: 13, fontWeight: 700, color: C.accent }}>{genStats.scoreBefore}%</span>
                      <span style={{ fontSize: 12, color: C.muted }}>→</span>

                      <span style={{ color: C.muted, fontWeight: 700 }}>🧠 Semantic Before→After</span>
                      <span style={{ color: C.muted, fontWeight: 700 }}>New Keywords</span>
                      <span style={{ color: C.muted, fontWeight: 700 }}>Rephrased</span>
                      {[...(candidate.align_history || [])].reverse().map((h, i) => (

function CredentialsSection() {
  const [newUser, setNewUser] = useState("");
  const [newPass, setNewPass] = useState("");
  const [confirmPass, setConfirmPass] = useState("");
  const [showPwd, setShowPwd] = useState(false);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);

  const handleSave = async () => {
    if (!newUser.trim()) { setMsg({ ok: false, text: "Username cannot be empty." }); return; }
    if (newPass.length < 4) { setMsg({ ok: false, text: "Password must be at least 4 characters." }); return; }
    if (newPass !== confirmPass) { setMsg({ ok: false, text: "Passwords do not match." }); return; }
    setSaving(true); setMsg(null);
    const res = await api.changeCredentials(newUser.trim(), newPass);
    setSaving(false);
    if (res.success) {
      setMsg({ ok: true, text: "Credentials updated. You will be logged out — please sign in again." });
      setNewUser(""); setNewPass(""); setConfirmPass("");
      setTimeout(() => {
        localStorage.removeItem("cms_token");
        localStorage.removeItem("cms_username");
        window.location.reload();
      }, 2000);
    } else {
      setMsg({ ok: false, text: res.error || "Failed to save credentials." });
    }
  };

  return (
    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 4px rgba(21,88,203,0.06)", marginBottom: 20 }}>
      <div style={{ padding: "14px 20px", borderBottom: `1px solid ${C.border}`, fontSize: 15, fontFamily: font.head, fontWeight: 700 }}>🔐 Login Credentials</div>
      <div style={{ padding: 20 }}>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 16 }}>Change the username and password used to log in to this portal. After saving you will be signed out and need to log in again.</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginBottom: 16 }}>
          <div>
            <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>New Username</label>
            <input type="text" value={newUser} onChange={e => setNewUser(e.target.value)} placeholder="Enter new username"
              style={{ display: "block", width: "100%", marginTop: 4, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.body }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>New Password</label>
            <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
              <input type={showPwd ? "text" : "password"} value={newPass} onChange={e => setNewPass(e.target.value)} placeholder="New password"
                style={{ flex: 1, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.body }} />
              <button onClick={() => setShowPwd(!showPwd)} style={{ padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, cursor: "pointer", background: C.bg, fontSize: 13 }}>{showPwd ? "🙈" : "👁"}</button>
            </div>
          </div>
          <div>
            <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Confirm Password</label>
            <input type={showPwd ? "text" : "password"} value={confirmPass} onChange={e => setConfirmPass(e.target.value)} placeholder="Repeat password"
              style={{ display: "block", width: "100%", marginTop: 4, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.body }} />
          </div>
        </div>
        {msg && (
          <div style={{ background: msg.ok ? C.tealSoft : "#fde8ea", border: `1px solid ${msg.ok ? C.teal : C.accent}`, borderRadius: 7, padding: "9px 14px", fontSize: 13, color: msg.ok ? C.teal : C.accent, marginBottom: 12 }}>{msg.text}</div>
        )}
        <Btn onClick={handleSave} disabled={saving}>{saving ? "Saving…" : "Update Credentials"}</Btn>
      </div>
    </div>
  );
}

                <b>Analysis Only</b> = gap detection works for any domain; skill injection into resume not yet available.<br/>
                This table updates automatically when the dev team adds a new domain to the codebase.

              <div style={{ display: "grid", gridTemplateColumns: "1fr auto auto", gap: "0", fontSize: 12 }}>

                Fully supported: <b style={{ color: C.teal }}>{coverage.fully_supported}</b> &nbsp;|&nbsp;
