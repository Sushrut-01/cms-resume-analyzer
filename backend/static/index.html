  const [jdPage, setJdPage] = useState(0);
  const JD_PER_PAGE = 5;

  const load = () => api.getJDs().then(setJds);
  const loadRecruiters = () => api.getRecruiters().then(setRecruiters);
  useEffect(() => { load(); loadRecruiters(); }, []);

  const handleCreate = async () => {
    if (!clientName.trim() || !jobTitle.trim() || !jdText.trim()) {
      alert("Please fill in all fields.");
      return;
    }
    setSaving(true);
    const res = await api.createJD({ client_name: clientName, job_title: jobTitle, jd_text: jdText });
    setSaving(false);
    if (res.id) {
      setClientName(""); setJobTitle(""); setJdText("");
      load();
    } else {
      alert("Failed to create JD: " + (res.detail || res.error || "Unknown error"));
    }
  };

  const startEdit = (jd) => {
    setEditingId(jd.id);
    setEditFields({ client_name: jd.client_name, job_title: jd.job_title, jd_text: jd.jd_text });
  };

  const handleUpdate = async (id) => {
    if (!editFields.client_name.trim() || !editFields.job_title.trim() || !editFields.jd_text.trim()) {
      alert("All fields are required."); return;
    }
    setUpdatingId(id);
    const res = await api.updateJD(id, { client_name: editFields.client_name, job_title: editFields.job_title, jd_text: editFields.jd_text });
    setUpdatingId(null);
    if (res.id) { setEditingId(null); load(); }
    else alert("Update failed: " + (res.detail || res.error || "Unknown error"));
  };

  const handleAddRecruiter = async () => {
    if (!newRecruiter.trim()) { alert("Enter a recruiter name."); return; }
    setSavingR(true);
    const res = await api.createRecruiter(newRecruiter.trim());
    setSavingR(false);
    if (res.success) { setNewRecruiter(""); loadRecruiters(); }
    else alert("Failed: " + (res.detail || res.error || "Unknown error"));
  };

  const handleDeleteRecruiter = async (id, name) => {
    if (!confirm(`Remove recruiter "${name}"?`)) return;
    await api.deleteRecruiter(id);
    loadRecruiters();
  };

  const handleDelete = async (id, name) => {
    if (!confirm(`Deactivate JD: "${name}"?`)) return;
    await api.deleteJD(id);
    load();
  };

  return (
    <div>
      <Topbar title="JD Manager" sub="Create and manage Job Descriptions" setPage={setPage} />
      <div style={{ padding: 28, maxWidth: 900 }}>

        {/* Create new JD */}
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 24, marginBottom: 24 }}>
          <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700, marginBottom: 16 }}>➕ Create New Job Description</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>
            <div>
              <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Company / Client Name</label>
              <input value={clientName} onChange={e => setClientName(e.target.value)} placeholder="e.g. Infosys, TCS" style={{ display: "block", width: "100%", marginTop: 4, padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg }} />
            </div>
            <div>
              <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Job Title / Role</label>
              <input value={jobTitle} onChange={e => setJobTitle(e.target.value)} placeholder="e.g. AI Prompt Engineer" style={{ display: "block", width: "100%", marginTop: 4, padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg }} />
            </div>
          </div>
          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Job Description / Requirements</label>
            <textarea value={jdText} onChange={e => setJdText(e.target.value)} placeholder="Paste the full job description or key requirements here..." rows={6} style={{ display: "block", width: "100%", marginTop: 4, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 12, background: C.bg, resize: "vertical", fontFamily: font.mono }} />
          </div>
          <Btn onClick={handleCreate} disabled={saving}>{saving ? "Saving..." : "💾 Save JD"}</Btn>
        </div>

        {/* Existing JDs */}
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
          <div style={{ padding: "14px 20px", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700 }}>Saved Job Descriptions ({jds.length})</span>
            {jds.length > JD_PER_PAGE && (
              <span style={{ fontSize: 12, color: C.muted }}>
                Showing {jdPage * JD_PER_PAGE + 1}–{Math.min((jdPage + 1) * JD_PER_PAGE, jds.length)} of {jds.length}
              </span>
            )}
          </div>
          {jds.length === 0 && (
            <div style={{ padding: 32, textAlign: "center", color: C.muted, fontSize: 13 }}>No JDs yet. Create one above to get started.</div>
          )}
          {jds.slice(jdPage * JD_PER_PAGE, (jdPage + 1) * JD_PER_PAGE).map((jd, i, arr) => (
            <div key={jd.id} style={{ padding: "14px 20px", borderBottom: i < arr.length - 1 ? `1px solid ${C.border}` : "none" }}>
              {editingId === jd.id ? (
                /* ── Inline edit form ── */
                <div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                    <div>
                      <label style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Company / Client Name</label>
                      <input value={editFields.client_name} onChange={e => setEditFields(f => ({ ...f, client_name: e.target.value }))} style={{ display: "block", width: "100%", marginTop: 3, padding: "7px 10px", border: `1px solid ${C.teal}`, borderRadius: 6, fontSize: 13, background: C.bg }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Job Title / Role</label>
                      <input value={editFields.job_title} onChange={e => setEditFields(f => ({ ...f, job_title: e.target.value }))} style={{ display: "block", width: "100%", marginTop: 3, padding: "7px 10px", border: `1px solid ${C.teal}`, borderRadius: 6, fontSize: 13, background: C.bg }} />
                    </div>
                  </div>
                  <div style={{ marginBottom: 10 }}>
                    <label style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Job Description / Requirements</label>
                    <textarea value={editFields.jd_text} onChange={e => setEditFields(f => ({ ...f, jd_text: e.target.value }))} rows={8} style={{ display: "block", width: "100%", marginTop: 3, padding: "8px 10px", border: `1px solid ${C.teal}`, borderRadius: 6, fontSize: 12, background: C.bg, resize: "vertical", fontFamily: font.mono }} />
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <Btn onClick={() => handleUpdate(jd.id)} disabled={updatingId === jd.id}>{updatingId === jd.id ? "Saving..." : "💾 Save Changes"}</Btn>
                    <Btn variant="ghost" onClick={() => setEditingId(null)}>Cancel</Btn>
                  </div>
                </div>
              ) : (
                /* ── Read / expanded view ── */
                <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
                      <span style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{jd.client_name}</span>
                      <Badge label={jd.job_title} color={C.teal} bg={C.tealSoft} />
                      <span style={{ fontSize: 11, color: C.muted }}>ID: {jd.id}</span>
                    </div>
                    <div style={{ fontSize: 11, color: C.muted, fontFamily: font.mono, whiteSpace: "pre-wrap", maxHeight: expandedId === jd.id ? "none" : 56, overflow: "hidden" }}>
                      {expandedId === jd.id ? jd.jd_text : jd.jd_text.slice(0, 200) + (jd.jd_text.length > 200 ? "..." : "")}
                    </div>
                    {jd.jd_text.length > 200 && (
                      <span onClick={() => setExpandedId(expandedId === jd.id ? null : jd.id)} style={{ fontSize: 11, color: C.accent, cursor: "pointer", fontWeight: 600 }}>
                        {expandedId === jd.id ? "▲ Show less" : "▼ Show full description"}
                      </span>
                    )}
                  </div>
                  <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                    <button title="Edit" onClick={() => startEdit(jd)} style={{ padding: "5px 10px", border: `1px solid ${C.border}`, borderRadius: 6, background: C.bg, cursor: "pointer", fontSize: 14 }}>✏</button>
                    <button title="Remove" onClick={() => handleDelete(jd.id, jd.client_name)} style={{ padding: "5px 10px", border: `1px solid ${C.border}`, borderRadius: 6, background: C.bg, cursor: "pointer", fontSize: 14 }}>🗑</button>
                  </div>
                </div>
              )}
            </div>
          ))}
          {/* Pagination controls */}
          {jds.length > JD_PER_PAGE && (
            <div style={{ padding: "12px 20px", borderTop: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <button onClick={() => setJdPage(p => Math.max(0, p - 1))} disabled={jdPage === 0} style={{ padding: "5px 14px", borderRadius: 6, border: `1px solid ${C.border}`, background: jdPage === 0 ? C.bg : C.card, color: jdPage === 0 ? C.muted : C.text, cursor: jdPage === 0 ? "default" : "pointer", fontSize: 12 }}>← Prev</button>
              <div style={{ display: "flex", gap: 6 }}>
                {Array.from({ length: Math.ceil(jds.length / JD_PER_PAGE) }, (_, p) => (
                  <button key={p} onClick={() => setJdPage(p)} style={{ width: 30, height: 30, borderRadius: 6, border: `1px solid ${p === jdPage ? C.teal : C.border}`, background: p === jdPage ? C.tealSoft : C.bg, color: p === jdPage ? C.teal : C.muted, cursor: "pointer", fontSize: 12, fontWeight: p === jdPage ? 700 : 400 }}>{p + 1}</button>
                ))}
              </div>
              <button onClick={() => setJdPage(p => Math.min(Math.ceil(jds.length / JD_PER_PAGE) - 1, p + 1))} disabled={jdPage >= Math.ceil(jds.length / JD_PER_PAGE) - 1} style={{ padding: "5px 14px", borderRadius: 6, border: `1px solid ${C.border}`, background: jdPage >= Math.ceil(jds.length / JD_PER_PAGE) - 1 ? C.bg : C.card, color: jdPage >= Math.ceil(jds.length / JD_PER_PAGE) - 1 ? C.muted : C.text, cursor: jdPage >= Math.ceil(jds.length / JD_PER_PAGE) - 1 ? "default" : "pointer", fontSize: 12 }}>Next →</button>
            </div>
          )}
        </div>

        {/* Manage Recruiters */}
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 24, marginTop: 24 }}>
          <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700, marginBottom: 16 }}>👤 Manage Recruiters</div>
          <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
            <input value={newRecruiter} onChange={e => setNewRecruiter(e.target.value)} onKeyDown={e => e.key === "Enter" && handleAddRecruiter()} placeholder="Recruiter name (e.g. Priya Sharma)" style={{ flex: 1, padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg }} />
            <Btn onClick={handleAddRecruiter} disabled={savingR}>{savingR ? "Adding..." : "+ Add"}</Btn>
          </div>
          {recruiters.length === 0 ? (
            <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "12px 0" }}>No recruiters added yet.</div>
          ) : (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {recruiters.map(r => (
                <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 6, background: C.tealSoft, border: `1px solid ${C.teal}`, borderRadius: 20, padding: "4px 12px" }}>
                  <span style={{ fontSize: 12, color: C.teal, fontWeight: 600 }}>👤 {r.name}</span>
                  <span onClick={() => handleDeleteRecruiter(r.id, r.name)} style={{ fontSize: 11, color: C.accent, cursor: "pointer", fontWeight: 700 }}>✕</span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{ marginTop: 16 }}>
          <Btn onClick={() => setPage("upload")} variant="outline">→ Go to Upload Resume</Btn>
        </div>
      </div>
    </div>
  );
}

function PageJDAlignedList({ setPage, setSelectedId }) {
  const [candidates, setCandidates] = useState([]);
  const [filter, setFilter] = useState("All");
  const [expanded, setExpanded] = useState(null);
  const [approving, setApproving] = useState(null);
  const [alignPage, setAlignPage] = useState(0);
  const ALIGN_PER_PAGE = 8;

  const load = () => api.getJDAligned().then(setCandidates);
  useEffect(() => { load(); }, []);

  const filtered = filter === "All" ? candidates
    : filter === "Approved" ? candidates.filter(c => c.status === "Approved")
    : candidates.filter(c => c.status !== "Approved");
  const paginated = filtered.slice(alignPage * ALIGN_PER_PAGE, (alignPage + 1) * ALIGN_PER_PAGE);

  const handleApprove = async (id) => {
    setApproving(id);
    const res = await api.approve(id);
    setApproving(null);
    if (res.success) { load(); alert("✅ Candidate approved!"); }
    else alert("Failed: " + (res.error || "Error"));
  };

  const versionColor = (v) => v === "AI_SIMULATED" ? C.teal : v === "JD_ALIGNED" ? "#7c6af7" : C.gold;
  const versionBg = (v) => v === "AI_SIMULATED" ? C.tealSoft : v === "JD_ALIGNED" ? "#eeecff" : C.goldSoft;
  const versionLabel = (v) => v === "AI_SIMULATED" ? "User Edited" : v === "JD_ALIGNED" ? "AI Draft" : v || "Original";

  return (
    <div>
      <Topbar title="JD-Aligned Resumes" sub="Candidates with JD-aligned resume drafts" setPage={setPage} />
      <div style={{ padding: 28 }}>

        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 20 }}>
          <StatCard label="Total Aligned" value={candidates.length} color={C.teal} />
          <StatCard label="Approved" value={candidates.filter(c => c.status === "Approved").length} color="#4ade80" />
          <StatCard label="Pending Approval" value={candidates.filter(c => c.status !== "Approved").length} color={C.gold} />
          <StatCard label="User Edited" value={candidates.filter(c => c.resume_version_type === "AI_SIMULATED").length} color={C.accent} />
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          {["All", "Approved", "Pending"].map(s => (
            <button key={s} onClick={() => { setFilter(s); setAlignPage(0); }} style={{ padding: "6px 18px", borderRadius: 20, cursor: "pointer", border: filter === s ? `1px solid ${C.teal}` : `1px solid ${C.border}`, background: filter === s ? C.tealSoft : "transparent", color: filter === s ? C.teal : C.muted, fontSize: 12, fontWeight: 600 }}>{s}</button>
          ))}
        </div>

        {filtered.length === 0 && (
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 48, textAlign: "center", color: C.muted }}>
            <div style={{ fontSize: 32, marginBottom: 12 }}>📊</div>
            <div style={{ fontSize: 14, marginBottom: 6 }}>No JD-aligned resumes yet</div>
            <div style={{ fontSize: 12 }}>Go to <span style={{ color: C.accent, cursor: "pointer", fontWeight: 700 }} onClick={() => setPage("jdalign")}>JD Alignment</span> to generate aligned drafts.</div>
          </div>
        )}
        {filtered.length > 0 && <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, marginTop: 4 }}><Pagination total={filtered.length} perPage={ALIGN_PER_PAGE} page={alignPage} setPage={setAlignPage} /></div>}

        {paginated.map((c) => (
          <div key={c.id} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 14, overflow: "hidden" }}>
            {/* Summary row */}
            <div style={{ display: "flex", alignItems: "center", gap: 16, padding: "14px 20px", cursor: "pointer" }} onClick={() => setExpanded(expanded === c.id ? null : c.id)}>
              <Avatar initials={(c.name || "??").slice(0, 2).toUpperCase()} size={40} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{c.name || "Unknown"}</span>
                  <Badge label={versionLabel(c.resume_version_type)} color={versionColor(c.resume_version_type)} bg={versionBg(c.resume_version_type)} />
                  <Badge label={c.status} color={c.status === "Approved" ? "#4ade80" : C.gold} bg={c.status === "Approved" ? "#f0fff4" : C.goldSoft} />
                  {c.score > 0 && <Badge label={`${c.score}% match`} color={c.score >= 75 ? C.teal : C.accent} bg={c.score >= 75 ? C.tealSoft : C.accentSoft} />}
                </div>
                <div style={{ fontSize: 11, color: C.muted, marginTop: 3 }}>
                  {c.email && <span>✉ {c.email}  </span>}
                  {c.mobile && <span>✆ {c.mobile}  </span>}
                  {c.location && <span>📍 {c.location}  </span>}
                </div>
                <div style={{ fontSize: 11, color: C.muted }}>
                  {c.client_requirement ? `${c.client_requirement.client_name} — ${c.client_requirement.job_title}` : c.company_name || ""}
                  {c.created_at && <span>  ·  {c.created_at.slice(0, 10)}</span>}
                </div>
              </div>
              <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                {c.status !== "Approved" && (
                  <Btn onClick={(e) => { e.stopPropagation(); handleApprove(c.id); }} variant="success" small disabled={approving === c.id}>{approving === c.id ? "..." : "✓ Approve"}</Btn>
                )}
                <Btn onClick={(e) => { e.stopPropagation(); api.downloadResume(c.id); }} variant="outline" small>⬇ .docx</Btn>
                <Btn onClick={(e) => { e.stopPropagation(); setSelectedId(c.id); setPage("jdalign"); }} variant="ghost" small>✏ Edit</Btn>
                <span style={{ fontSize: 18, color: C.muted, paddingLeft: 4 }}>{expanded === c.id ? "▲" : "▼"}</span>
              </div>
            </div>

            {/* Expanded detail */}
            {expanded === c.id && (
              <div style={{ borderTop: `1px solid ${C.border}`, padding: "16px 20px", background: C.bg }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 14 }}>
                  {c.strengths?.length > 0 && (
                    <div style={{ background: C.tealSoft, border: `1px solid ${C.teal}44`, borderRadius: 8, padding: 14 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.teal, marginBottom: 8 }}>✅ Strengths</div>
                      {c.strengths.map((s, i) => <div key={i} style={{ fontSize: 11, color: C.text, marginBottom: 3 }}>• {s}</div>)}
                    </div>
                  )}
                  {c.gaps?.length > 0 && (
                    <div style={{ background: C.accentSoft, border: `1px solid ${C.accent}44`, borderRadius: 8, padding: 14 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 8 }}>⚠ Gaps vs JD</div>
                      {c.gaps.map((g, i) => <div key={i} style={{ fontSize: 11, color: C.text, marginBottom: 3 }}>• {g}</div>)}
                    </div>
                  )}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                  <div>
                    <div style={{ fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.08em", marginBottom: 6 }}>ALIGNED RESUME (Saved Draft)</div>
                    <textarea readOnly value={c.manual_resume_text || c.improved_resume_text || "No draft saved yet"} style={{ width: "100%", height: 320, padding: "10px 12px", border: `1px solid ${C.teal}44`, borderRadius: 8, fontSize: 10, fontFamily: font.mono, background: "#f0fffe", resize: "vertical", lineHeight: 1.6 }} />
                  </div>
                  {c.client_requirement?.jd_text && (
                    <div>
                      <div style={{ fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.08em", marginBottom: 6 }}>JD — {c.client_requirement.client_name} · {c.client_requirement.job_title}</div>
                      <textarea readOnly value={c.client_requirement.jd_text} style={{ width: "100%", height: 320, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 10, fontFamily: font.mono, background: C.bg, resize: "vertical", lineHeight: 1.6 }} />
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [ollamaOnline, setOllamaOnline] = useState(false);
  const [ollamaProvider, setOllamaProvider] = useState("ollama");
  const [aiRunning, setAiRunning] = useState(false);
  const [aiTask, setAiTask] = useState("");
  const [alignState, setAlignState] = useState(null);

  // Auth state
  const [authReady, setAuthReady] = useState(false);
  const [token, setToken] = useState(null);
  const [loggedUser, setLoggedUser] = useState("");

  useEffect(() => {
    const storedToken = localStorage.getItem("cms_token");
    const storedUser  = localStorage.getItem("cms_username") || "";
    if (storedToken) {
      api.verifyToken(storedToken).then(res => {
        if (res.valid) {
          setToken(storedToken);
          setLoggedUser(res.username || storedUser);
        } else {
          localStorage.removeItem("cms_token");
          localStorage.removeItem("cms_username");
        }
        setAuthReady(true);
      });
    } else {
      setAuthReady(true);
    }
  }, []);

  const handleLogin = (tok, uname) => {
    setToken(tok);
    setLoggedUser(uname);
  };

  const handleLogout = () => {
    localStorage.removeItem("cms_token");
    localStorage.removeItem("cms_username");
    setToken(null);
    setLoggedUser("");
    setPage("dashboard");
  };

  const refreshStatus = () => api.ollamaStatus().then(s => {
    setOllamaOnline(s.online);
    setOllamaProvider(s.provider || "ollama");
  });

  useEffect(() => {
    if (!token) return;
    refreshStatus();
    const interval = setInterval(refreshStatus, 30000);
    return () => clearInterval(interval);
  }, [token]);

  const startAI  = (task) => { setAiRunning(true);  setAiTask(task); };
  const stopAI   = ()     => { setAiRunning(false); setAiTask("");   };

  if (!authReady) return (
    <div style={{ minHeight: "100vh", background: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: C.muted, fontSize: 14 }}>Loading…</div>
    </div>
  );

  if (!token) return <PageLogin onLogin={handleLogin} />;

  const pages = {
    dashboard: <PageDashboard setPage={setPage} />,
    jdmanager: <PageJDManager setPage={setPage} />,
    upload: <PageUpload setPage={setPage} setSelectedId={setSelectedId} startAI={startAI} stopAI={stopAI} />,
    listing: <PageListing setPage={setPage} setSelectedId={setSelectedId} startAI={startAI} stopAI={stopAI} />,
    review: <PageReview setPage={setPage} selectedId={selectedId} startAI={startAI} stopAI={stopAI} />,
    jdalign: <PageJDAlign setPage={setPage} selectedId={selectedId} startAI={startAI} stopAI={stopAI} alignState={alignState} setAlignState={setAlignState} />,
    jdalignlist: <PageJDAlignedList setPage={setPage} setSelectedId={setSelectedId} />,
    pipeline: <PagePipeline setPage={setPage} ollamaOnline={ollamaOnline} ollamaProvider={ollamaProvider} />,
    settings: <PageSettings setPage={setPage} onSave={refreshStatus} />,
  };

  return (
    <div style={{ display: "flex", background: C.bg, minHeight: "100vh" }}>
      <Sidebar active={page} setPage={setPage} ollamaOnline={ollamaOnline} ollamaProvider={ollamaProvider} username={loggedUser} onLogout={handleLogout} />
      <div style={{ marginLeft: 220, flex: 1, minHeight: "100vh", overflow: "auto", paddingBottom: aiRunning ? 52 : 0 }}>
        {pages[page]}
      </div>
      {aiRunning && (
        <div style={{ position: "fixed", bottom: 0, left: 220, right: 0, zIndex: 9999, background: "#0f2027", color: "#fff", padding: "10px 24px", display: "flex", alignItems: "center", gap: 14, borderTop: "2px solid #e63946", fontSize: 13 }}>
          <span style={{ fontSize: 18, animation: "spin 1.2s linear infinite", display: "inline-block" }}>⏳</span>
          <span><strong>AI is working:</strong> {aiTask}</span>
          <span style={{ color: "rgba(255,255,255,0.45)", fontSize: 11 }}>— Navigate freely, results will be here when you return</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
