<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K Recruit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Inter', sans-serif; background: #FFFFFF; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = "http://127.0.0.1:8000";

const C = {
  bg: "#FFFFFF", card: "#ffffff", sidebar: "#1C3D6B",
  accent: "#1558CB", accentSoft: "#EEF4FF",
  teal: "#0d9488", tealSoft: "#f0fdfa",
  gold: "#d97706", goldSoft: "#fffbeb",
  text: "#1A2E4A", muted: "#8A95A3", border: "#DDE4EE",
};
const font = { head: "'Segoe UI','Inter',sans-serif", body: "'Segoe UI','Inter',sans-serif", mono: "'Courier New', monospace" };

const api = {
  getCandidates: async () => {
    try { const r = await fetch(`${API}/candidates/`); const d = await r.json(); return d.data || []; } catch { return []; }
  },
  getCandidate: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}`); const d = await r.json(); return d.data || {}; } catch { return {}; }
  },
  uploadResume: async (file, clientRequirementId, recruiterName = "") => {
    const form = new FormData();
    form.append("file", file);
    form.append("client_requirement_id", clientRequirementId);
    form.append("recruiter_name", recruiterName);
    try {
      const r = await fetch(`${API}/candidates/upload`, { method: "POST", body: form });
      const data = await r.json();
      if (!r.ok) return { success: false, error: data?.detail || "Upload failed" };
      return data;
    } catch (e) { return { success: false, error: e.message }; }
  },
  getJDs: async () => {
    try { const r = await fetch(`${API}/client-requirements`); return await r.json(); }
    catch { return []; }
  },
  createJD: async (payload) => {
    try {
      const r = await fetch(`${API}/client-requirements`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      return await r.json();
    } catch (e) { return { error: e.message }; }
  },
  updateJD: async (id, payload) => {
    try {
      const r = await fetch(`${API}/client-requirements/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      return await r.json();
    } catch (e) { return { error: e.message }; }
  },
  deleteJD: async (id) => {
    try { const r = await fetch(`${API}/client-requirements/${id}`, { method: "DELETE" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  getRecruiters: async () => {
    try { const r = await fetch(`${API}/recruiters/`); const d = await r.json(); return d.data || []; }
    catch { return []; }
  },
  createRecruiter: async (name) => {
    try {
      const r = await fetch(`${API}/recruiters/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
      return await r.json();
    } catch (e) { return { success: false, error: e.message }; }
  },
  deleteRecruiter: async (id) => {
    try { const r = await fetch(`${API}/recruiters/${id}`, { method: "DELETE" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  analyze: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/analyze`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  approve: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/approve`, { method: "PUT" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  ollamaStatus: async () => {
    try { const r = await fetch(`${API}/candidates/system/ollama-status`); return await r.json(); }
    catch { return { online: false }; }
  },
  updateResume: async (id, text) => {
    const form = new FormData(); form.append("improved_text", text);
    try { const r = await fetch(`${API}/candidates/${id}/update`, { method: "PUT", body: form }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  generateJDAligned: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/generate-jd-aligned-resume`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  saveManualResume: async (id, text) => {
    const form = new FormData(); form.append("manual_text", text);
    try { const r = await fetch(`${API}/candidates/${id}/manual-resume`, { method: "PUT", body: form }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  downloadResume: (id) => { window.open(`${API}/candidates/${id}/download-resume`, '_blank'); },
  getJDAligned: async () => {
    try { const r = await fetch(`${API}/candidates/list/jd-aligned`); const d = await r.json(); return d.data || []; } catch { return []; }
  },
  getSettings: async () => {
    try { const r = await fetch(`${API}/settings/`); return await r.json(); } catch { return { success: false }; }
  },
  saveSettings: async (payload) => {
    try { const r = await fetch(`${API}/settings/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  testConnection: async () => {
    try { const r = await fetch(`${API}/settings/test`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, message: e.message }; }
  },
  login: async (username, password) => {
    try {
      const r = await fetch(`${API}/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }) });
      return await r.json();
    } catch (e) { return { success: false, detail: e.message }; }
  },
  verifyToken: async (token) => {
    try {
      const r = await fetch(`${API}/auth/verify`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
      if (!r.ok) return { valid: false };
      return await r.json();
    } catch { return { valid: false }; }
  },
  changeCredentials: async (username, password) => {
    try {
      const r = await fetch(`${API}/settings/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login_username: username, login_password: password }) });
      return await r.json();
    } catch (e) { return { success: false, error: e.message }; }
  },
};

const Badge = ({ label, color = C.teal, bg = C.tealSoft }) => (
  <span style={{ fontSize: 11, fontWeight: 700, color, background: bg, padding: "2px 10px", borderRadius: 20, whiteSpace: "nowrap" }}>{label}</span>
);

const Avatar = ({ initials, size = 36 }) => (
  <div style={{ width: size, height: size, borderRadius: "50%", background: "linear-gradient(135deg, #e63946, #c1121f)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: size * 0.33, fontFamily: font.head, fontWeight: 700, flexShrink: 0 }}>{initials}</div>
);

const Btn = ({ children, onClick, variant = "primary", small, full, disabled }) => {
  const styles = {
    primary: { background: C.accent, color: "#fff", border: "none" },
    outline: { background: "transparent", color: C.accent, border: `1px solid ${C.accent}` },
    ghost: { background: "transparent", color: C.muted, border: `1px solid ${C.border}` },
    success: { background: C.teal, color: "#fff", border: "none" },
    warn: { background: C.gold, color: C.text, border: "none" },
  };
  const s = styles[variant] || styles.primary;
  return (
    <button onClick={onClick} disabled={disabled} style={{ ...s, padding: small ? "6px 12px" : "9px 18px", borderRadius: 6, cursor: disabled ? "not-allowed" : "pointer", fontSize: small ? 11 : 13, fontFamily: font.body, fontWeight: 600, width: full ? "100%" : "auto", opacity: disabled ? 0.5 : 1 }}>{children}</button>
  );
};

const StatCard = ({ label, value, sub, color = C.accent }) => (
  <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "18px 22px", flex: 1, minWidth: 130 }}>
    <div style={{ fontSize: 28, fontFamily: font.head, fontWeight: 700, color }}>{value}</div>
    <div style={{ fontSize: 13, color: C.text, fontWeight: 600, marginTop: 2 }}>{label}</div>
    {sub && <div style={{ fontSize: 11, color: C.muted, marginTop: 3 }}>{sub}</div>}
  </div>
);

const Pagination = ({ total, perPage, page, setPage }) => {
  const totalPages = Math.ceil(total / perPage);
  if (totalPages <= 1) return null;
  const start = page * perPage + 1, end = Math.min((page + 1) * perPage, total);
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 20px", borderTop: `1px solid ${C.border}` }}>
      <button onClick={() => setPage(p => Math.max(0, p - 1))} disabled={page === 0} style={{ padding: "5px 14px", borderRadius: 6, border: `1px solid ${C.border}`, background: page === 0 ? C.bg : C.card, color: page === 0 ? C.muted : C.text, cursor: page === 0 ? "default" : "pointer", fontSize: 12 }}>← Prev</button>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{ fontSize: 11, color: C.muted }}>Showing {start}–{end} of {total}</span>
        <div style={{ display: "flex", gap: 4 }}>
          {Array.from({ length: totalPages }, (_, p) => (
            <button key={p} onClick={() => setPage(p)} style={{ width: 28, height: 28, borderRadius: 6, border: `1px solid ${p === page ? C.teal : C.border}`, background: p === page ? C.tealSoft : C.bg, color: p === page ? C.teal : C.muted, cursor: "pointer", fontSize: 12, fontWeight: p === page ? 700 : 400 }}>{p + 1}</button>
          ))}
        </div>
      </div>
      <button onClick={() => setPage(p => Math.min(totalPages - 1, p + 1))} disabled={page >= totalPages - 1} style={{ padding: "5px 14px", borderRadius: 6, border: `1px solid ${C.border}`, background: page >= totalPages - 1 ? C.bg : C.card, color: page >= totalPages - 1 ? C.muted : C.text, cursor: page >= totalPages - 1 ? "default" : "pointer", fontSize: 12 }}>Next →</button>
    </div>
  );
};

function PageLogin({ onLogin }) {
  const [username, setUsername] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [showPwd, setShowPwd] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");
  const [uiPref, setUiPref] = React.useState(localStorage.getItem("cms_ui_pref") || "classic");

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!username.trim() || !password) { setError("Please enter both username and password."); return; }
    setLoading(true); setError("");
    const res = await api.login(username.trim(), password);
    setLoading(false);
    if (res.success && res.token) {
      localStorage.setItem("cms_token", res.token);
      localStorage.setItem("cms_username", res.username || username.trim());
      localStorage.setItem("cms_ui_pref", uiPref);
      if (uiPref === "premium") {
        window.location.href = "/static/preview.html";
      } else {
        onLogin(res.token, res.username || username.trim());
      }
    } else {
      setError(res.detail || res.error || "Invalid username or password.");
      setPassword("");
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ width: 420 }}>
        {/* Logo block */}
        <div style={{ textAlign: "center", marginBottom: 32 }}>
          <img src="/logo.png" alt="Kforce" style={{ height: 44, marginBottom: 10 }} />
          <div style={{ fontSize: 12, color: C.muted, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 600 }}>K Recruit</div>
        </div>

        {/* Card */}
        <div style={{ background: "#fff", borderRadius: 14, padding: "36px 40px", boxShadow: "0 4px 24px rgba(21,88,203,0.12)", border: "1px solid #DDE4EE" }}>
          <div style={{ fontSize: 18, fontFamily: font.head, fontWeight: 700, color: C.text, marginBottom: 6 }}>Sign in to your account</div>
          <div style={{ fontSize: 12, color: C.muted, marginBottom: 28 }}>Enter your credentials to access the portal</div>

          <form onSubmit={handleSubmit}>
            <div style={{ marginBottom: 18 }}>
              <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 6 }}>Username</label>
              <input
                type="text" value={username} onChange={e => setUsername(e.target.value)} autoFocus
                placeholder="Enter username"
                style={{ display: "block", width: "100%", padding: "11px 14px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 14, fontFamily: font.body, outline: "none" }}
              />
            </div>
            <div style={{ marginBottom: 24 }}>
              <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 6 }}>Password</label>
              <div style={{ display: "flex", gap: 8 }}>
                <input
                  type={showPwd ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)}
                  placeholder="Enter password"
                  style={{ flex: 1, padding: "11px 14px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 14, fontFamily: font.body, outline: "none" }}
                />
                <button type="button" onClick={() => setShowPwd(!showPwd)} style={{ padding: "11px 14px", border: `1px solid ${C.border}`, borderRadius: 8, cursor: "pointer", background: C.bg, fontSize: 14 }}>{showPwd ? "🙈" : "👁"}</button>
              </div>
            </div>

            {/* UI selector */}
            <div style={{ marginBottom: 20 }}>
              <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em", display: "block", marginBottom: 8 }}>Interface</label>
              <div style={{ background: C.bg, borderRadius: 8, padding: 4, display: "flex", gap: 4 }}>
                {[["classic","Classic UI"],["premium","✨ New Premium UI"]].map(([opt, label]) => (
                  <button key={opt} type="button"
                    onClick={() => { setUiPref(opt); localStorage.setItem("cms_ui_pref", opt); }}
                    style={{ flex: 1, padding: "8px 10px", borderRadius: 6, border: "none", cursor: "pointer",
                      background: uiPref === opt ? (opt === "premium" ? C.accent : "#fff") : "transparent",
                      color: uiPref === opt ? (opt === "premium" ? "#fff" : C.text) : C.muted,
                      fontSize: 12, fontWeight: uiPref === opt ? 700 : 400,
                      boxShadow: uiPref === opt ? "0 1px 4px rgba(0,0,0,0.12)" : "none",
                      transition: "all 0.15s" }}>
                    {label}
                  </button>
                ))}
              </div>
            </div>

            {error && (
              <div style={{ background: "#fde8ea", border: `1px solid ${C.accent}`, borderRadius: 8, padding: "10px 14px", marginBottom: 18, fontSize: 13, color: C.accent }}>{error}</div>
            )}

            <button type="submit" disabled={loading} style={{ width: "100%", padding: "13px", background: loading ? C.muted : C.accent, color: "#fff", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 700, fontFamily: font.body, cursor: loading ? "not-allowed" : "pointer" }}>
              {loading ? "Signing in…" : "Sign In →"}
            </button>
          </form>
        </div>

        <div style={{ textAlign: "center", marginTop: 20 }}>
          <span style={{ fontSize: 11, color: C.muted }}>© Kforce Inc. · K Recruit</span>
        </div>
      </div>
    </div>
  );
}

const navItems = [
  { id: "dashboard", icon: "⬛", label: "Dashboard" },
  { id: "jdmanager", icon: "📋", label: "JD Manager" },
  { id: "upload", icon: "⬆", label: "Upload Resume" },
  { id: "listing", icon: "☰", label: "Candidate List" },
  { id: "review", icon: "⊞", label: "Review Resume" },
  { id: "jdalign", icon: "🎯", label: "JD Alignment" },
  { id: "jdalignlist", icon: "📊", label: "Aligned Resumes" },
  { id: "pipeline", icon: "⚙", label: "Pipeline Status" },
  { id: "settings", icon: "◎", label: "Settings" },
];

function Sidebar({ active, setPage, ollamaOnline, ollamaProvider, username, onLogout }) {
  return (
    <div style={{ width: 220, background: C.sidebar, display: "flex", flexDirection: "column", height: "100vh", position: "fixed", left: 0, top: 0, zIndex: 100 }}>
      <div style={{ padding: "20px 20px 16px", borderBottom: "1px solid rgba(255,255,255,0.12)" }}>
        <img src="/logo.png" alt="Kforce" style={{ height: 28, filter: "brightness(0) invert(1)", display: "block", marginBottom: 6 }} />
        <div style={{ fontSize: 9, color: "rgba(255,255,255,0.45)", letterSpacing: "0.2em", textTransform: "uppercase", fontWeight: 600 }}>K Recruit</div>
      </div>
      <nav style={{ flex: 1, padding: "12px 0" }}>
        {navItems.map(item => (
          <div key={item.id} onClick={() => setPage(item.id)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 20px", cursor: "pointer", background: active === item.id ? C.accent : "transparent", borderLeft: active === item.id ? `3px solid #5BADFF` : "3px solid transparent", borderRadius: active === item.id ? "0 8px 8px 0" : 0, margin: "1px 8px 1px 0" }}>
            <span style={{ fontSize: 14, opacity: active === item.id ? 1 : 0.7 }}>{item.icon}</span>
            <span style={{ fontSize: 13, color: "#fff", fontWeight: active === item.id ? 700 : 400, opacity: active === item.id ? 1 : 0.75 }}>{item.label}</span>
          </div>
        ))}
      </nav>
      <div style={{ padding: "12px 20px", borderTop: "1px solid rgba(255,255,255,0.07)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: ollamaOnline ? "#4ade80" : "#ef4444" }} />
          <span style={{ fontSize: 11, color: "rgba(255,255,255,0.5)" }}>
            {(() => {
              const label = ollamaProvider === "gemini" ? "Gemini ✦" : ollamaProvider === "azure" ? "Azure OpenAI ☁" : ollamaProvider === "groq" ? "Groq ⚡" : ollamaProvider === "nvidia" ? "NVIDIA NIM 🟢" : "Ollama";
              return ollamaOnline ? `${label} Online` : `${label} Offline`;
            })()}
          </span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
          <Avatar initials={(username || "HR").slice(0, 2).toUpperCase()} size={32} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 12, color: "#fff", fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{username || "HR Admin"}</div>
            <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)" }}>Logged in</div>
          </div>
        </div>
        <button onClick={onLogout} style={{ width: "100%", padding: "7px 12px", background: "rgba(230,57,70,0.15)", border: "1px solid rgba(230,57,70,0.3)", borderRadius: 7, color: C.accent, fontSize: 12, fontWeight: 600, cursor: "pointer", textAlign: "left" }}>⎋ Sign Out</button>
      </div>
    </div>
  );
}

function Topbar({ title, sub, setPage }) {
  return (
    <div style={{ height: 60, background: C.card, borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", padding: "0 28px", position: "sticky", top: 0, zIndex: 50 }}>
      <div>
        <div style={{ fontSize: 16, fontFamily: font.head, fontWeight: 700, color: C.text }}>{title}</div>
        {sub && <div style={{ fontSize: 11, color: C.muted, marginTop: 1 }}>{sub}</div>}
      </div>
    </div>
  );
}

function PageDashboard({ setPage }) {
  const [candidates, setCandidates] = useState([]);
  const [coverage, setCoverage] = useState(null);
  useEffect(() => {
    api.getCandidates().then(setCandidates);
    fetch("/settings/domain-coverage").then(r => r.json()).then(r => { if (r.success) setCoverage(r.data); });
  }, []);
  const total = candidates.length;
  const pending = candidates.filter(c => c.status === "Pending Review" || c.status === "Uploaded").length;
  const analyzed = candidates.filter(c => c.status === "Bot Analyzed").length;
  const approved = candidates.filter(c => c.status === "Approved").length;
  return (
    <div>
      <Topbar title="Dashboard" sub="Overview of all candidate activity" setPage={setPage} />
      <div style={{ padding: 28 }}>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 28 }}>
          <StatCard label="Total Candidates" value={total} color={C.accent} />
          <StatCard label="Pending Review" value={pending} color={C.gold} />
          <StatCard label="Bot Analyzed" value={analyzed} color={C.teal} />
          <StatCard label="Approved" value={approved} color="#2a9d8f" />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20 }}>
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
            <div style={{ padding: "16px 20px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700 }}>Recent Candidates</div>
              <Btn onClick={() => setPage("listing")} variant="ghost" small>View All →</Btn>
            </div>
            {candidates.length === 0 && <div style={{ padding: 28, textAlign: "center", color: C.muted, fontSize: 13 }}>No candidates yet. Upload a resume to get started!</div>}
            {candidates.slice(0, 5).map((c, i) => (
              <div key={c.id} onClick={() => setPage("review")} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 20px", borderBottom: i < 4 ? `1px solid ${C.border}` : "none", cursor: "pointer" }}>
                <Avatar initials={(c.name || "??").slice(0, 2).toUpperCase()} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.name || "Unknown"}</div>
                  <div style={{ fontSize: 11, color: C.muted }}>{c.company_name || "N/A"}</div>
                </div>
                <Badge label={c.status} color={c.status === "Approved" ? C.teal : c.status === "Bot Analyzed" ? "#7c6af7" : C.gold} bg={c.status === "Approved" ? C.tealSoft : c.status === "Bot Analyzed" ? "#eeecff" : C.goldSoft} />
                <div style={{ fontSize: 13, fontWeight: 700, color: c.score >= 80 ? C.teal : c.score >= 70 ? C.gold : C.accent, minWidth: 36, textAlign: "right" }}>{c.score || 0}%</div>
              </div>
            ))}
          </div>

// ── Resume section parser (client-side) ──────────────────────────────────────
function parseSections(text) {
  if (!text) return [];
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];

  // ━━━ structured format
  if ((text.match(/━/g) || []).length > 10) {
    const nameMap = {
      "PROFESSIONAL SUMMARY": "Summary",
      "TECHNICAL SKILLS": "Skills",
      "WORK EXPERIENCE": "Work Experience",
      "PROJECT SUMMARY": "Projects",
      "EDUCATION": "Education",
      "CERTIFICATIONS": "Certifications",
    };
    const parts = text.split(/━{5,}/).map(p => p.trim()).filter(Boolean);
    const found = {};
    for (let i = 0; i < parts.length; i++) {
      const label = nameMap[parts[i].toUpperCase()];
      if (label && i + 1 < parts.length) found[label] = parts[i + 1];
    }
    return ORDER.filter(k => found[k]).map(k => ({ label: k, content: found[k] }));
  }

  // Plain keyword fallback
  const kwMap = {
    "summary": "Summary", "professional summary": "Summary",
    "objective": "Summary", "profile": "Summary", "about me": "Summary",
    "skills": "Skills", "technical skills": "Skills",
    "key skills": "Skills", "core competencies": "Skills", "expertise": "Skills",
    "experience": "Work Experience", "work experience": "Work Experience",
    "professional experience": "Work Experience", "employment": "Work Experience",
    "project": "Projects", "project summary": "Projects", "projects": "Projects",
    "education": "Education", "academic": "Education", "qualification": "Education",
    "certif": "Certifications", "certification": "Certifications",
    "achievement": "Certifications",
  };
  const lines = text.split("\n");
  let current = null;
  const buf = {};
  for (const line of lines) {
    const s = line.trim();
    const lo = s.toLowerCase();
    let matched = null;
    for (const [kw, lbl] of Object.entries(kwMap)) {
      if (lo.startsWith(kw) && s.length < 65) { matched = lbl; break; }
    }
    if (matched) { current = matched; buf[current] = buf[current] || []; }
    else if (current && s) buf[current].push(s);
  }
  return ORDER.filter(k => buf[k]?.length).map(k => ({ label: k, content: buf[k].join("\n") }));
}

function sectionBadge(before, after) {
  if (!after && !before) return null;
  if (!after || after.trim() === (before || "").trim()) return { label: "unchanged", color: C.muted, bg: "#f0f0ee" };
  const bWords = new Set((before || "").toLowerCase().split(/\s+/).filter(Boolean));
  const aWords = new Set(after.toLowerCase().split(/\s+/).filter(Boolean));
  const common = [...bWords].filter(w => aWords.has(w)).length;
  const sim = bWords.size ? common / Math.max(bWords.size, aWords.size) : 0;
  if (aWords.size > bWords.size * 1.25) return { label: "expanded", color: "#7c6af7", bg: "#eeecff" };
  if (sim < 0.65) return { label: "improved", color: C.teal, bg: C.tealSoft };
  return { label: "updated", color: C.gold, bg: C.goldSoft };
}

function SectionDiff({ beforeText, afterText }) {
  const beforeSecs = parseSections(beforeText);
  const afterSecs  = parseSections(afterText);

  const allLabels = [...new Set([...beforeSecs.map(s => s.label), ...afterSecs.map(s => s.label)])];
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];
  const labels = [...ORDER.filter(l => allLabels.includes(l)), ...allLabels.filter(l => !ORDER.includes(l))];

  const bMap = Object.fromEntries(beforeSecs.map(s => [s.label, s.content]));
  const aMap = Object.fromEntries(afterSecs.map(s => [s.label, s.content]));

  const noAfter = !afterText || afterText.trim().length < 10;

  const colStyle = (tint) => ({
    flex: 1, minWidth: 0, background: tint, border: `1px solid ${C.border}`,
    borderRadius: 10, overflow: "hidden",
  });
  const hdrStyle = (color) => ({
    padding: "12px 18px", borderBottom: `1px solid ${C.border}`,
    fontSize: 11, fontWeight: 700, letterSpacing: "0.1em",
    textTransform: "uppercase", color, background: "rgba(0,0,0,0.03)",
  });

  return (
    <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
      {/* BEFORE column */}
      <div style={colStyle("#ffffff")}>
        <div style={hdrStyle(C.muted)}>Before (Original)</div>
        {labels.map((label, i) => {
          const content = bMap[label] || "";
          return (
            <div key={label} style={{ borderBottom: i < labels.length - 1 ? `1px solid ${C.border}` : "none" }}>
              <div style={{ padding: "10px 18px 4px", fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>
                {label}
              </div>
              <div style={{ padding: "0 18px 14px", fontSize: 12, color: content ? C.text : C.muted, lineHeight: 1.7, whiteSpace: "pre-wrap", fontFamily: font.body }}>
                {content || <em style={{ opacity: 0.4 }}>—</em>}
              </div>
            </div>
          );
        })}
      </div>

      {/* AFTER column */}
      <div style={colStyle("#f5fffe")}>
        <div style={hdrStyle(C.teal)}>After (AI Improved)</div>
        {noAfter ? (
          <div style={{ padding: 40, textAlign: "center", color: C.muted }}>
            <div style={{ fontSize: 28, marginBottom: 10 }}>🤖</div>
            <div style={{ fontSize: 13 }}>Click <strong>▶ Run AI</strong> to generate improvements</div>
          </div>
        ) : labels.map((label, i) => {
          const before  = bMap[label] || "";
          const after   = aMap[label] || "";
          const badge   = sectionBadge(before, after);
          return (
            <div key={label} style={{ borderBottom: i < labels.length - 1 ? `1px solid ${C.border}` : "none" }}>
              <div style={{ padding: "10px 18px 4px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>{label}</span>
                {badge && (
                  <span style={{ fontSize: 10, fontWeight: 700, color: badge.color, background: badge.bg, padding: "2px 10px", borderRadius: 20 }}>
                    {badge.label}
                  </span>
                )}
              </div>
              <div style={{ padding: "0 18px 14px", fontSize: 12, color: after ? C.text : C.muted, lineHeight: 1.7, whiteSpace: "pre-wrap", fontFamily: font.body, background: badge && badge.label !== "unchanged" ? `${badge.bg}55` : "transparent", borderRadius: 6, margin: "0 8px 6px" }}>
                {after || before || <em style={{ opacity: 0.4 }}>—</em>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PageReview({ setPage, selectedId, startAI, stopAI }) {

  const [tab, setTab] = useState("diff");
  const [editText, setEditText] = useState("");

    api.getCandidates().then(setCandidates);
    fetch("/settings/admin-contact").then(r => r.json()).then(r => { if (r.success) setAdminContact(r.email || ""); });
  }, []);
  useEffect(() => {
    if (selectedId) loadCandidate(selectedId);
    else if (candidates.length > 0) loadCandidate(candidates[0].id);
  }, [selectedId, candidates]);

  const loadCandidate = async (id) => { const c = await api.getCandidate(id); setCandidate(c); setEditText(c.improved_resume_text || c.original_resume_text || ""); };
  const runAnalysis = async () => {
    if (!candidate) return;
    setAnalyzing(true);
    startAI && startAI("Analyzing resume for " + (candidate.name || "candidate") + "...");
    const res = await api.analyze(candidate.id);
    setAnalyzing(false);
    stopAI && stopAI();
    if (res.success) { loadCandidate(candidate.id); alert("✅ Analysis complete!"); }
    else alert("Failed: " + (res.detail || res.error));
  };
  const handleApprove = async () => { if (!candidate) return; const res = await api.approve(candidate.id); if (res.success) { loadCandidate(candidate.id); alert("✅ Approved!"); } };
  const handleSave = async () => { if (!candidate) return; setSaving(true); const res = await api.updateResume(candidate.id, editText); setSaving(false); if (res.success) alert("✅ Saved!"); else alert("Save failed!"); };

  return (
    <div>
      <Topbar title="Review Resume" sub={candidate ? `${candidate.name || "Unknown"} · ${candidate.company_name || ""}` : "Select a candidate"} setPage={setPage} />
      <div style={{ padding: "20px 28px" }}>
        <div style={{ marginBottom: 16 }}>

            {candidates.map(c => <option key={c.id} value={c.id}>{c.name || "Unknown"} — {c.company_name || "N/A"}</option>)}
          </select>
        </div>

        {candidate && (
          <>
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px 20px", marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <Avatar initials={(candidate.name || "??").slice(0, 2).toUpperCase()} size={44} />
                <div>
                  <div style={{ fontSize: 16, fontFamily: font.head, fontWeight: 700 }}>{candidate.name || "Unknown"}</div>
                  {candidate.role && <div style={{ fontSize: 12, color: C.teal, fontWeight: 600, marginBottom: 2 }}>{candidate.role}</div>}
                  <div style={{ fontSize: 12, color: C.muted, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                    <span title="ATS keyword match — what a scanner sees">
                      🔤 ATS: <b style={{ color: candidate.score >= 75 ? C.teal : candidate.score >= 50 ? C.gold : C.accent }}>{candidate.score || 0}%</b>
                    </span>
                    {candidate.semantic_score != null && (
                      <span title="Semantic meaning match — what the recruiter sees">
                        🧠 Semantic: <b style={{ color: candidate.semantic_score >= 70 ? C.teal : candidate.semantic_score >= 45 ? C.gold : C.accent }}>{candidate.semantic_score}%</b>
                      </span>
                    )}
                    <span>· {candidate.match_level || "N/A"} Match · {candidate.status}</span>
                  </div>
                  {candidate.email && <div style={{ fontSize: 11, color: C.muted }}>✉ {candidate.email} {candidate.mobile ? `· ✆ ${candidate.mobile}` : ""} {candidate.recruiter_name ? `· 👤 ${candidate.recruiter_name}` : ""}</div>}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <Btn onClick={() => setBotOpen(!botOpen)} variant="outline" small>🤖 Bot Agent</Btn>
                <Btn onClick={runAnalysis} variant="outline" small disabled={analyzing}>{analyzing ? "⏳ Analyzing..." : "▶ Run AI"}</Btn>
              </div>
            </div>

            {/* Domain detection banner — shown after analysis */}
            {candidate.detected_domain && (
              <div style={{
                marginBottom: 12,
                padding: "10px 16px",
                borderRadius: 8,
                display: "flex",
                alignItems: "flex-start",
                gap: 10,
                background: candidate.injection_supported ? C.tealSoft : C.goldSoft,
                border: `1px solid ${candidate.injection_supported ? C.teal + "44" : C.gold}`,
              }}>
                <span style={{ fontSize: 16, lineHeight: 1 }}>{candidate.injection_supported ? "🟢" : "🟡"}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: candidate.injection_supported ? C.teal : "#92400e", marginBottom: 2 }}>
                    Detected Domain: {candidate.detected_domain}
                    &nbsp;·&nbsp;
                    {candidate.injection_supported ? "Full Support (Analysis + Injection)" : "Analysis Only"}
                  </div>
                  {!candidate.injection_supported && (
                    <div style={{ fontSize: 11, color: "#92400e" }}>
                      Gap detection and scoring work for all domains. Skill injection into resume is currently optimised for tech roles.
                      {adminContact
                        ? <> To request full support for this domain, contact: <b>{adminContact}</b></>
                        : <> Contact the system administrator to request injection support for <b>{candidate.detected_domain}</b> roles.</>}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Role Compatibility Badge */}
            {candidate.candidate_function && candidate.jd_function && (() => {
              const v = candidate.role_compatibility;
              const cfg = {
                compatible:   { bg: "#f0fdf4", border: "#22c55e", icon: "✅", label: "Role Match", color: "#166534" },
                adjacent:     { bg: "#fffbea", border: "#f59e0b", icon: "⚠️", label: "Partial Match", color: "#92400e" },
                incompatible: { bg: "#fef2f2", border: "#ef4444", icon: "❌", label: "Role Mismatch", color: "#991b1b" },
              }[v] || { bg: C.card, border: C.border, icon: "🔍", label: "Role Check", color: C.muted };
              return (
                <div style={{ marginBottom: 12, padding: "10px 16px", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 10, background: cfg.bg, border: `1px solid ${cfg.border}` }}>
                  <span style={{ fontSize: 16 }}>{cfg.icon}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: cfg.color, marginBottom: 2 }}>
                      {cfg.label} — Candidate: <b>{candidate.candidate_function}</b> &nbsp;·&nbsp; JD: <b>{candidate.jd_function}</b>
                    </div>
                    <div style={{ fontSize: 11, color: cfg.color }}>
                      {v === "compatible" && "Strong fit — candidate role aligns directly with this JD."}
                      {v === "adjacent"   && "Transferable skills exist but expect significant gaps. Alignment will highlight them."}
                      {v === "incompatible" && "⚠ These roles are fundamentally different. JD alignment may produce misleading results. Verify the JD selection with the candidate."}
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* Soft Gaps — skills you HAVE but phrased differently (semantic match) */}
            {(candidate.soft_gaps || []).length > 0 && (
              <div style={{ background: "#fff8ed", border: "1px solid #f59e0b55", borderRadius: 10, padding: 14, marginBottom: 12 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#92400e", marginBottom: 10 }}>
                  🔄 SOFT GAPS — You have related experience, just rephrase ({candidate.soft_gaps.length})
                  <span style={{ fontSize: 10, fontWeight: 400, marginLeft: 8, color: "#b45309" }}>
                    — detected by semantic analysis ({candidate.soft_gaps[0]?.similarity ? "neural" : "TF-IDF"} engine)

                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {candidate.soft_gaps.map((sg, i) => (
                    <div key={i} style={{ background: "#fffbeb", border: "1px solid #fcd34d", borderRadius: 8, padding: "10px 12px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                        <span style={{ background: "#f59e0b22", color: "#92400e", border: "1px solid #f59e0b55", borderRadius: 10, padding: "2px 9px", fontSize: 11, fontWeight: 700 }}>
                          {sg.keyword}
                        </span>
                        <span style={{ fontSize: 10, color: "#b45309" }}>
                          {Math.round((sg.similarity || 0) * 100)}% semantic match
                        </span>
                      </div>
                      <div style={{ fontSize: 11, color: "#78350f", lineHeight: 1.5 }}>
                        <b>Your resume says:</b> "{sg.resume_match}"
                      </div>
                      <div style={{ fontSize: 11, color: "#92400e", marginTop: 4, fontWeight: 600 }}>
                        ✏ {sg.suggestion}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {(candidate.gaps?.length > 0 || candidate.strengths?.length > 0) && (() => {
              // Parse enriched gap format: "keyword (Nx) | JD says: \"context sentence\""
              const parseGap = (raw) => {
                const parts = raw.split(" | JD says: ");
                const label = parts[0].trim();
                const ctx   = parts[1] ? parts[1].replace(/^"|"$/g, '').trim() : "";
                return { label, ctx };
              };
              const mustHaveRaw  = (candidate.gaps || []).filter(g => g.startsWith("[MUST HAVE]")).map(g => g.replace("[MUST HAVE] ", ""));
              const niceToHaveRaw= (candidate.gaps || []).filter(g => g.startsWith("[NICE TO HAVE]")).map(g => g.replace("[NICE TO HAVE] ", ""));
              const legacyGaps   = (candidate.gaps || []).filter(g => !g.startsWith("["));
              const mustHave    = mustHaveRaw.map(parseGap);
              const niceToHave  = niceToHaveRaw.map(parseGap);
              return (
                <div style={{ marginBottom: 16 }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                    {candidate.strengths?.length > 0 && (
                      <div style={{ background: C.tealSoft, border: `1px solid ${C.teal}44`, borderRadius: 10, padding: 14 }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: C.teal, marginBottom: 8 }}>✅ Skills Matched ({candidate.strengths.length})</div>
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                          {candidate.strengths.map((s, i) => (
                            <span key={i} style={{ background: C.teal + "22", color: C.teal, border: `1px solid ${C.teal}44`, borderRadius: 12, padding: "2px 8px", fontSize: 11 }}>{s.replace("Has: ", "")}</span>
                          ))}
                        </div>
                      </div>
                    )}
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {mustHave.length > 0 && (
                        <div style={{ background: "#fff1f1", border: "1px solid #ef444444", borderRadius: 10, padding: 12 }}>
                          <div style={{ fontSize: 11, fontWeight: 700, color: "#dc2626", marginBottom: 8 }}>🚨 MUST HAVE — Missing ({mustHave.length}) — CV may be rejected without these</div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                            {mustHave.map(({ label, ctx }, i) => (
                              <div key={i}>
                                <span style={{ background: "#dc262622", color: "#dc2626", border: "1px solid #dc262644", borderRadius: 12, padding: "2px 9px", fontSize: 11, fontWeight: 600 }}>{label}</span>
                                {ctx && <div style={{ fontSize: 10, color: "#b91c1c", marginTop: 3, marginLeft: 4, fontStyle: "italic", lineHeight: 1.4 }}>"{ctx}"</div>}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                      {niceToHave.length > 0 && (
                        <div style={{ background: C.goldSoft, border: `1px solid ${C.gold}44`, borderRadius: 10, padding: 12 }}>
                          <div style={{ fontSize: 11, fontWeight: 700, color: "#b45309", marginBottom: 8 }}>💡 NICE TO HAVE — Missing ({niceToHave.length}) — adds value if present</div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                            {niceToHave.map(({ label, ctx }, i) => (
                              <div key={i}>
                                <span style={{ background: C.gold + "33", color: "#92400e", border: `1px solid ${C.gold}`, borderRadius: 12, padding: "2px 9px", fontSize: 11 }}>{label}</span>
                                {ctx && <div style={{ fontSize: 10, color: "#92400e", marginTop: 3, marginLeft: 4, fontStyle: "italic", lineHeight: 1.4 }}>"{ctx}"</div>}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                      {legacyGaps.length > 0 && (
                        <div style={{ background: C.accentSoft, border: `1px solid ${C.accent}44`, borderRadius: 10, padding: 12 }}>
                          <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 6 }}>⚠ Gaps</div>
                          {legacyGaps.map((g, i) => <div key={i} style={{ fontSize: 11, color: C.text, marginBottom: 3 }}>• {g}</div>)}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}

            {botOpen && (
              <div style={{ background: "#1a1a2e", borderRadius: 10, padding: 20, marginBottom: 16 }}>
                <div style={{ fontSize: 13, fontFamily: font.head, fontWeight: 700, color: "#fff", marginBottom: 12 }}>🤖 Bot Agent — Action Plan</div>
                {(candidate.recommendations || []).length === 0 && <div style={{ color: "rgba(255,255,255,0.5)", fontSize: 12 }}>Run AI Analysis first to see the action plan.</div>}
                {(candidate.recommendations || []).map((rec, i) => (
                  <div key={i} style={{ background: rec.priority === "MUST HAVE" ? "rgba(220,38,38,0.12)" : "rgba(255,255,255,0.05)", border: rec.priority === "MUST HAVE" ? "1px solid rgba(220,38,38,0.3)" : "none", borderRadius: 8, padding: "12px 14px", marginBottom: 10 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                      {rec.priority === "MUST HAVE" && <span style={{ background: "#dc2626", color: "#fff", borderRadius: 4, padding: "1px 7px", fontSize: 10, fontWeight: 700 }}>MUST HAVE</span>}
                      <span style={{ fontSize: 12, color: C.accent, fontWeight: 700 }}>{rec.section}</span>
                    </div>
                    <div style={{ fontSize: 11, color: "#f87171", marginBottom: 4 }}>⚠ {rec.issue}</div>
                    <div style={{ fontSize: 11, color: "#4ade80" }}>✓ {rec.fix}</div>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 4, marginBottom: 0 }}>
              {[{ id: "diff", label: "Before / After" }, { id: "edit", label: "Edit Mode" }].map(t => (
                <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: "7px 18px", borderRadius: "6px 6px 0 0", cursor: "pointer", border: `1px solid ${C.border}`, borderBottom: tab === t.id ? `1px solid ${C.card}` : `1px solid ${C.border}`, background: tab === t.id ? C.card : C.bg, color: tab === t.id ? C.text : C.muted, fontSize: 12, fontWeight: 600 }}>{t.label}</button>
              ))}
            </div>

            {tab === "diff" && (
              <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: "0 10px 10px 10px", padding: 16 }}>
                <SectionDiff
                  beforeText={candidate.original_resume_text || ""}
                  afterText={candidate.improved_resume_text || ""}
                />
              </div>
            )}

            {tab === "edit" && (
              <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: "0 10px 10px 10px", padding: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: C.text, marginBottom: 10 }}>Edit Resume — Make changes and save</div>
                <textarea value={editText} onChange={e => setEditText(e.target.value)} style={{ width: "100%", height: 580, padding: "10px 12px", border: `1px solid ${C.accent}44`, borderRadius: 8, fontSize: 11, fontFamily: font.mono, background: C.bg, resize: "vertical", lineHeight: 1.6 }} />
                <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                  <Btn onClick={handleSave} variant="success" disabled={saving}>{saving ? "Saving..." : "💾 Save Changes"}</Btn>
                </div>
              </div>
            )}
          </>
        )}

        {!candidate && candidates.length === 0 && (
          <div style={{ textAlign: "center", padding: 60, color: C.muted }}>
            No candidates yet. <span style={{ color: C.accent, cursor: "pointer" }} onClick={() => setPage("upload")}>Upload a resume</span> to get started!
          </div>
        )}
      </div>
    </div>
  );
}

function ResumePreview({ text }) {
  const sections = parseSections(text || "");

  // Extract header lines (name, role, contact) before first real section
  const headerLines = [];
  for (const line of (text || "").split("\n").slice(0, 12)) {
    const s = line.trim();
    if (!s || s.match(/━{3,}/)) continue;
    const up = s.toUpperCase();
    if (["PROFESSIONAL SUMMARY","TECHNICAL SKILLS","WORK EXPERIENCE","PROJECT SUMMARY","EDUCATION","CERTIFICATIONS"].includes(up)) break;
    headerLines.push(s);
  }

  if (!text || (!sections.length && !headerLines.length)) {
    return <div style={{ padding: 24, color: C.muted, fontSize: 12, textAlign: "center" }}>No content to preview.</div>;
  }

  const sectionIcons = { Summary: "📝", Skills: "⚡", "Work Experience": "💼", Projects: "🚀", Education: "🎓", Certifications: "🏆" };

  return (
    <div style={{ padding: "16px 20px", overflowY: "auto", maxHeight: 700 }}>
      {headerLines.length > 0 && (
        <div style={{ textAlign: "center", marginBottom: 18, paddingBottom: 14, borderBottom: `2px solid ${C.teal}44` }}>
          {headerLines[0] && <div style={{ fontSize: 17, fontWeight: 700, color: C.sidebar, fontFamily: font.head, marginBottom: 3 }}>{headerLines[0]}</div>}
          {headerLines[1] && !headerLines[1].includes("@") && !headerLines[1].match(/\d{8,}/) && (
            <div style={{ fontSize: 12, color: C.accent, fontWeight: 600, marginBottom: 4 }}>{headerLines[1]}</div>
          )}
          {headerLines.slice(1).filter(l => l.includes("@") || l.includes("📧") || l.includes("📱") || l.includes("📍") || l.includes("linkedin")).map((l, i) => (
            <div key={i} style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{l}</div>
          ))}
        </div>
      )}
      {sections.map((sec) => (
        <div key={sec.label} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6, paddingBottom: 5, borderBottom: `1px solid ${C.border}` }}>
            <span style={{ fontSize: 13 }}>{sectionIcons[sec.label] || "📌"}</span>
            <span style={{ fontSize: 10, fontWeight: 700, color: C.teal, letterSpacing: "0.12em", textTransform: "uppercase" }}>{sec.label}</span>
          </div>
          <div style={{ fontSize: 12, color: C.text, lineHeight: 1.8, whiteSpace: "pre-wrap", fontFamily: font.body }}>
            {sec.content.split("\n").map((line, i) => {
              const s = line.trim();
              if (!s) return null;
              const isBullet = /^[-•◦◆▪*]/.test(s);
              const isDraft  = s.startsWith("[DRAFT");
              return (
                <div key={i} style={{ display: "flex", gap: 8, marginBottom: isBullet ? 3 : 5, color: isDraft ? C.gold : C.text }}>
                  {isBullet && <span style={{ color: C.teal, flexShrink: 0, marginTop: 1 }}>•</span>}
                  <span style={{ fontWeight: isDraft ? 600 : 400, fontStyle: isDraft ? "italic" : "normal" }}>
                    {isBullet ? s.replace(/^[-•◦◆▪*]\s*/, "") : s}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function PageJDAlign({ setPage, selectedId, startAI, stopAI, alignState, setAlignState }) {
  const [candidates, setCandidates] = useState([]);
  const [candidate, setCandidate] = useState(null);
  const [draftText, setDraftText] = useState("");
  const [generating, setGenerating] = useState(false);
  const [saving, setSaving] = useState(false);
  const [generated, setGenerated] = useState(false);
  const [genStats, setGenStats] = useState(null);
  const [draftView, setDraftView] = useState("edit");
  const [roleCompat, setRoleCompat] = useState(null);
  const [overrideCompat, setOverrideCompat] = useState(false);

  useEffect(() => { api.getCandidates().then(setCandidates); }, []);

  // Restore persisted alignment state when returning to this page
  useEffect(() => {
    if (alignState && alignState.draftText) {
      setDraftText(alignState.draftText);
      setGenStats(alignState.genStats || null);
      setGenerated(true);
    }
  }, []);

  useEffect(() => {
    if (selectedId) loadCandidate(selectedId);
    else if (alignState?.candidateId) loadCandidate(alignState.candidateId);
    else if (candidates.length > 0) loadCandidate(candidates[0].id);
  }, [selectedId, candidates]);

  const loadCandidate = async (id) => {
    const c = await api.getCandidate(id);
    setCandidate(c);
    setOverrideCompat(false);
    // Fetch role compatibility (uses cached DB value or detects live)
    try {
      const rc = await fetch(`/candidates/${id}/role-compatibility`).then(r => r.json());
      setRoleCompat(rc);
    } catch (_) {
      setRoleCompat(null);
    }
    // If we have a persisted draft for this candidate, use it; otherwise use saved
    if (alignState?.candidateId === id && alignState?.draftText) {
      setDraftText(alignState.draftText);
      setGenStats(alignState.genStats || null);
      setGenerated(true);
    } else {
      setDraftText(c.manual_resume_text || "");
      setGenerated(!!c.manual_resume_text);
      const hist = c.align_history || [];
      if (hist.length > 0) {
        const last = hist[hist.length - 1];
        setGenStats({ skills: last.added_skills || 0, projects: last.added_projects || 0, scoreBefore: last.score_before || 0, scoreAfter: last.score_after || 0, semBefore: last.sem_score_before ?? null, semAfter: last.sem_score_after ?? null, rephrased: last.rephrased_count || 0 });
      } else {
        setGenStats(null);
      }
    }
  };

  const handleGenerate = async () => {
    if (!candidate) return;
    setGenerating(true);
    startAI && startAI("Generating JD-Aligned Resume for " + (candidate.name || "candidate") + "...");
    const res = await api.generateJDAligned(candidate.id);
    setGenerating(false);
    stopAI && stopAI();
    if (res.success) {
      const stats = { skills: res.added_skills || 0, projects: res.added_projects || 0, scoreBefore: res.score_before || 0, scoreAfter: res.score_after || 0, semBefore: res.sem_score_before ?? null, semAfter: res.sem_score_after ?? null, rephrased: res.rephrased_count || 0 };
      setDraftText(res.draft_resume);
      setGenerated(true);
      setGenStats(stats);
      // Persist to App-level so navigating away and back doesn't lose the result
      setAlignState && setAlignState({ draftText: res.draft_resume, genStats: stats, candidateId: candidate.id });
      const updated = await api.getCandidate(candidate.id);
      setCandidate(updated);
    } else alert("Generation failed: " + (res.error || "Error"));
  };

  const handleSave = async () => {
    if (!candidate || !draftText) return;
    setSaving(true);
    const res = await api.saveManualResume(candidate.id, draftText);
    setSaving(false);
    if (res.success) alert("✅ JD-Aligned resume saved! Click ⬇ Download to get Word doc.");
    else alert("Save failed!");
  };

  return (
    <div>
      <Topbar title="JD Alignment & Resume Editor" sub="Generate and edit JD-aligned resume draft" setPage={setPage} />
      <div style={{ padding: "20px 28px" }}>

        <div style={{ background: "#fef3cd", border: "1px solid #e9c46a", borderRadius: 10, padding: "12px 20px", marginBottom: 20, display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 20 }}>⚠️</span>
          <div style={{ fontSize: 13, color: "#7a5c00" }}>
            <strong>JD-Aligned Resume Draft</strong> — AI-generated draft for editing. Review all content carefully before saving and downloading. Label: <strong>"JD-Aligned Resume – User Edited"</strong>
          </div>
        </div>

        <div style={{ marginBottom: 16 }}>
          <select onChange={e => loadCandidate(Number(e.target.value))} value={candidate?.id || ""} style={{ padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.card, color: C.text }}>
            {candidates.map(c => <option key={c.id} value={c.id}>{c.name || "Unknown"} — {c.company_name || "N/A"}</option>)}
          </select>
        </div>

        {roleCompat && roleCompat.verdict && (() => {
          const isIncompat = roleCompat.verdict === "incompatible";
          const isAdj = roleCompat.verdict === "adjacent";
          const bg = isIncompat ? "#fef2f2" : isAdj ? "#fffbea" : "#f0fdf4";
          const border = isIncompat ? "#ef4444" : isAdj ? "#f59e0b" : "#22c55e";
          const icon = isIncompat ? "❌" : isAdj ? "⚠️" : "✅";
          const textColor = isIncompat ? "#991b1b" : isAdj ? "#92400e" : "#166534";
          return (
            <div style={{ background: bg, border: `1px solid ${border}`, borderRadius: 10, padding: "14px 20px", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                <span style={{ fontSize: 22, flexShrink: 0, marginTop: 1 }}>{icon}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: textColor, marginBottom: 4 }}>
                    {isIncompat ? "Role Mismatch Detected" : isAdj ? "Partial Role Match" : "Role Match Confirmed"}
                  </div>
                  <div style={{ fontSize: 13, color: textColor, marginBottom: 6 }}>
                    {roleCompat.message}
                  </div>
                  <div style={{ display: "flex", gap: 16, fontSize: 12, color: textColor }}>
                    <span>Candidate: <strong>{roleCompat.candidate_function || "—"}</strong></span>

function CredentialsSection() {
  const [newUser, setNewUser] = useState("");
  const [newPass, setNewPass] = useState("");
  const [confirmPass, setConfirmPass] = useState("");
  const [showPwd, setShowPwd] = useState(false);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);

  const handleSave = async () => {
    if (!newUser.trim()) { setMsg({ ok: false, text: "Username cannot be empty." }); return; }
    if (newPass.length < 4) { setMsg({ ok: false, text: "Password must be at least 4 characters." }); return; }
    if (newPass !== confirmPass) { setMsg({ ok: false, text: "Passwords do not match." }); return; }
    setSaving(true); setMsg(null);
    const res = await api.changeCredentials(newUser.trim(), newPass);
    setSaving(false);
    if (res.success) {
      setMsg({ ok: true, text: "Credentials updated. You will be logged out — please sign in again." });
      setNewUser(""); setNewPass(""); setConfirmPass("");
      setTimeout(() => {
        localStorage.removeItem("cms_token");
        localStorage.removeItem("cms_username");
        window.location.reload();
      }, 2000);
    } else {
      setMsg({ ok: false, text: res.error || "Failed to save credentials." });
    }
  };

  return (
    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden", marginBottom: 20 }}>
      <div style={{ padding: "14px 20px", borderBottom: `1px solid ${C.border}`, fontSize: 14, fontFamily: font.head, fontWeight: 700 }}>🔐 Login Credentials</div>
      <div style={{ padding: 20 }}>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 16 }}>Change the username and password used to log in to this portal. After saving you will be signed out and need to log in again.</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginBottom: 16 }}>
          <div>
            <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>New Username</label>
            <input type="text" value={newUser} onChange={e => setNewUser(e.target.value)} placeholder="Enter new username"
              style={{ display: "block", width: "100%", marginTop: 4, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.body }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>New Password</label>
            <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
              <input type={showPwd ? "text" : "password"} value={newPass} onChange={e => setNewPass(e.target.value)} placeholder="New password"
                style={{ flex: 1, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.body }} />
              <button onClick={() => setShowPwd(!showPwd)} style={{ padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, cursor: "pointer", background: C.bg, fontSize: 13 }}>{showPwd ? "🙈" : "👁"}</button>
            </div>
          </div>
          <div>
            <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Confirm Password</label>
            <input type={showPwd ? "text" : "password"} value={confirmPass} onChange={e => setConfirmPass(e.target.value)} placeholder="Repeat password"
              style={{ display: "block", width: "100%", marginTop: 4, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.body }} />
          </div>
        </div>
        {msg && (
          <div style={{ background: msg.ok ? C.tealSoft : "#fde8ea", border: `1px solid ${msg.ok ? C.teal : C.accent}`, borderRadius: 7, padding: "9px 14px", fontSize: 13, color: msg.ok ? C.teal : C.accent, marginBottom: 12 }}>{msg.text}</div>
        )}
        <Btn onClick={handleSave} disabled={saving}>{saving ? "Saving…" : "Update Credentials"}</Btn>
      </div>
    </div>
  );
}

  const loadSemStatus = () => fetch("/settings/semantic-status")
    .then(r => r.json()).then(r => setSemStatus(r));

  useEffect(() => { loadSettings(); loadCoverage(); loadSemStatus(); }, []);

  // Auto-save provider selection immediately when card is clicked
  const switchProvider = async (id) => {
    setProvider(id);
    setTestResult(null);
    await api.saveSettings({ provider: id });
    if (onSave) onSave();
  };

  const handleSave = async () => {
    setSaving(true); setTestResult(null);
    const payload = {
      provider,
      ollama_url: ollamaUrl, ollama_model: ollamaModel,
      gemini_model: geminiModel,
      azure_endpoint: azureEndpoint, azure_deployment: azureDeployment, azure_api_version: azureApiVersion,
      groq_model: groqModel,
      nvidia_model: nvidiaModel,
      admin_contact_email: adminEmail.trim(),
    };
    if (geminiKey.trim())  payload.gemini_api_key  = geminiKey.trim();
    if (azureKey.trim())   payload.azure_api_key   = azureKey.trim();
    if (groqKey.trim())    payload.groq_api_key    = groqKey.trim();
    if (nvidiaKey.trim())  payload.nvidia_api_key  = nvidiaKey.trim();
    const res = await api.saveSettings(payload);
    setSaving(false);
    if (res.success) {
      setGeminiKey(""); setAzureKey(""); setGroqKey(""); setNvidiaKey("");
      await loadSettings();
      if (onSave) onSave();
    } else alert("Failed to save: " + (res.error || "Error"));
  };

  const handleTest = async () => {
    setTesting(true); setTestResult(null);
    const res = await api.testConnection();
    setTesting(false);
    setTestResult(res);
  };

  const inp = (val, set, ph, type="text") => (
    <input type={type} value={val} onChange={e => set(e.target.value)} placeholder={ph}
      style={{ display: "block", width: "100%", marginTop: 4, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.mono, background: C.bg }} />
  );

  const KeyField = ({ value, onChange, masked, show, setShow, placeholder }) => (
    <div>
      {masked && !value && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, fontSize: 12, color: C.teal }}>
          <span style={{ background: C.tealSoft, border: `1px solid ${C.teal}`, borderRadius: 20, padding: "2px 10px", fontWeight: 600 }}>🔑 Key saved: {masked}</span>
          <span style={{ color: C.muted }}>— leave blank to keep, or enter new key below</span>
        </div>
      )}
      <div style={{ display: "flex", gap: 8 }}>
        <input type={show ? "text" : "password"} value={value} onChange={e => onChange(e.target.value)}
          placeholder={masked ? "Enter new key to replace..." : (placeholder || "Paste key here...")}
          style={{ flex: 1, padding: "9px 12px", border: `1px solid ${value ? C.teal : C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.mono, background: C.bg }} />
        <button onClick={() => setShow(!show)} style={{ padding: "9px 14px", border: `1px solid ${C.border}`, borderRadius: 6, cursor: "pointer", background: C.bg, fontSize: 12 }}>{show ? "🙈" : "👁"}</button>
      </div>
    </div>
  );

  const ProviderCard = ({ id, icon, title, sub, active }) => (
    <div onClick={() => switchProvider(id)} style={{ flex: 1, border: `2px solid ${active ? C.teal : C.border}`, borderRadius: 10, padding: "16px 20px", cursor: "pointer", background: active ? C.tealSoft : C.card, transition: "all 0.2s" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
        <span style={{ fontSize: 24 }}>{icon}</span>
        <div>
          <div style={{ fontSize: 14, fontWeight: 700, color: active ? C.teal : C.text }}>{title}</div>

        </div>
        {active && <span style={{ marginLeft: "auto", fontSize: 18, color: C.teal }}>✓</span>}
      </div>
    </div>
  );
