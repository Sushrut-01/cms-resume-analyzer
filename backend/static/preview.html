                        {!hasCats && !hasStrengths && candidate.gaps?.length>0 && (
                          <div style={{ background:"#FFF1F2", border:"1px solid #B91C1C30", borderRadius:11, padding:11 }}>
                            <div style={{ fontSize:11, fontWeight:700, color:"#9B1C1C", marginBottom:5, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{STAT_ICONS.gap}</span>Gaps ({candidate.gaps.length})</div>
                            <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
                              {candidate.gaps.map((g,i)=><span key={i} style={{ background:"#FFE4E6", color:"#9B1C1C", border:"1px solid #9B1C1C33", borderRadius:12, padding:"2px 9px", fontSize:11 }}>{g}</span>)}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })()}

                </div>
              </SCard>
            )}

            <div style={{ display:"flex", gap:0, borderBottom:"2px solid #C7D9F8", marginBottom:0 }}>
              {[{id:"diff",icon:NAV_ICONS.listing,label:"Before / After"},{id:"edit",icon:STAT_ICONS.edit,label:"Edit Mode"},{id:"jddraft",icon:NAV_ICONS.jdmanager,label:"JD Draft"}].map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{ display:"flex", alignItems:"center", gap:6, padding:"9px 20px", cursor:"pointer", border:"none", borderBottom:tab===t.id?"2px solid #1558CB":"2px solid transparent", marginBottom:"-2px", background:tab===t.id?"#fff":"transparent", color:tab===t.id?"#1558CB":"#6B7280", fontSize:12, fontWeight:600, transition:"all 0.14s" }}><span style={{display:"flex",opacity:0.8}}>{t.icon}</span>{t.label}</button>
              ))}
            </div>
            <SCard style={{ borderRadius:"0 12px 12px 12px" }}>
              {tab === "diff" && (
                <div style={{ padding:16, display:"flex", gap:16 }}>
                  {[{title:"Before (Original)",map:bMap,bg:"#fff",hc:C.muted,dotBg:"#CBD5E1"},{title:"After (AI Improved)",map:aMap,bg:"#f5fffe",hc:C.teal,dotBg:C.teal}].map(col=>(
                    <div key={col.title} style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:10, overflow:"hidden" }}>
                      <div className="diff-col-head" style={{ background:col.hc===C.teal?"#f0fdfa":"#fafbfc" }}>
                        <div className="diff-col-dot" style={{ background:col.dotBg }} />
                        <span style={{ fontSize:11, fontWeight:700, color:col.hc, textTransform:"uppercase", letterSpacing:"0.1em" }}>{col.title}</span>
                      </div>
                      {labels.length === 0 && <div className="empty-state" style={{ padding:"36px 20px" }}><div className="empty-state-icon" style={{ display:"flex", justifyContent:"center", color:col.hc===C.teal?C.teal:C.muted }}>{col.hc===C.teal?STAT_ICONS.sparkle:NAV_ICONS.jdmanager}</div><div style={{ fontSize:12, color:C.muted, marginTop:12 }}>{col.hc===C.teal?"Click Run AI Analysis to generate improvements":"No resume content to preview"}</div></div>}
                      {labels.map((lbl,i)=>(
                        <div key={lbl} style={{ borderBottom:i<labels.length-1?`1px solid ${C.borderSoft}`:"none" }}>
                          <div style={{ padding:"10px 18px 4px", fontSize:11, color:C.muted, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase" }}>{lbl}</div>
                          <div style={{ padding:"0 18px 14px", fontSize:12, color:col.map[lbl]?C.text:C.muted, lineHeight:1.7, whiteSpace:"pre-wrap", fontFamily:font.body }}>{col.map[lbl]||<em style={{ opacity:0.4 }}>—</em>}</div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              )}
              {tab === "edit" && (
                <div style={{ padding:16 }}>
                  <div style={{ fontSize:11, color:C.muted, marginBottom:8 }}>Editing AI-improved resume text</div>
                  <textarea value={editText} onChange={e=>setEditText(e.target.value)} style={{ width:"100%", height:560, padding:"10px 12px", border:`1px solid ${C.primary}44`, borderRadius:8, fontSize:11, fontFamily:font.mono, background:C.bg, resize:"vertical", lineHeight:1.6 }} />
                  <div style={{ display:"flex", gap:10, marginTop:12 }}>
                    <Btn variant="success" onClick={handleSave} disabled={saving}>{saving?"Saving...":"Save Changes"}</Btn>
                  </div>
                </div>
              )}
              {tab === "jddraft" && (
                <div style={{ padding:16 }}>
                  {!manualText && (
                    <div style={{ background:C.amberSoft, border:`1px solid ${C.amber}`, borderRadius:10, padding:"16px 20px", marginBottom:16, display:"flex", alignItems:"center", gap:12 }}>
                      <span style={{ display:"flex", color:"#d97706" }}>{NAV_ICONS.jdmanager}</span>
                      <div>
                        <div style={{ fontSize:13, fontWeight:600, color:"#92400e" }}>No JD-aligned draft yet</div>
                        <div style={{ fontSize:12, color:"#b45309", marginTop:3 }}>Go to <span style={{ color:C.primary, cursor:"pointer", fontWeight:700 }} onClick={()=>setPage("jdalign")}>JD Alignment →</span> to generate one, then come back here to review and edit it.</div>
                      </div>
                    </div>
                  )}
                  {manualText && (
                    <>
                      <div style={{ background:C.tealSoft, border:`1px solid ${C.teal}44`, borderRadius:8, padding:"10px 14px", marginBottom:12, fontSize:12, color:"#065f46", display:"flex", alignItems:"center", gap:8 }}>
                        <span style={{display:"flex",flexShrink:0,color:C.teal}}>{STAT_ICONS.ok}</span>JD-aligned draft loaded — generated from the JD Alignment page. Edit below and save to update.
                      </div>
                      <textarea value={manualText} onChange={e=>setManualText(e.target.value)} style={{ width:"100%", height:560, padding:"10px 12px", border:`1px solid ${C.teal}44`, borderRadius:8, fontSize:11, fontFamily:font.mono, background:"#f7fffe", resize:"vertical", lineHeight:1.6 }} />
                      <div style={{ display:"flex", gap:10, marginTop:12 }}>
                        <Btn variant="success" onClick={handleSaveManual} disabled={savingManual}>{savingManual?"Saving...":<>{STAT_ICONS.save} Save JD Draft</>}</Btn>
                        <Btn variant="outline" onClick={()=>candidate&&api.downloadResume(candidate.id)}><>{STAT_ICONS.download} Download .docx</></Btn>
                        <Btn variant="ghost" onClick={()=>setPage("jdalign")}><>{STAT_ICONS.rephrase} Regenerate in JD Alignment</></Btn>
                      </div>
                    </>
                  )}
                </div>
              )}
            </SCard>
          </>
        )}
      </div>
    </div>
  );
}

/* ─── Resume Preview (structured) ───────────────────────── */
function ResumePreview({ text }) {
  const sections = parseSections(text || "");
  const headerLines = [];
  for (const line of (text || "").split("\n").slice(0, 12)) {
    const s = line.trim();
    if (!s || s.match(/━{3,}/)) continue;
    const up = s.toUpperCase();
    if (["PROFESSIONAL SUMMARY","TECHNICAL SKILLS","WORK EXPERIENCE","PROJECT SUMMARY","EDUCATION","CERTIFICATIONS"].includes(up)) break;
    headerLines.push(s);
  }
  if (!text || (!sections.length && !headerLines.length)) {
    return <div style={{ padding:24, color:C.muted, fontSize:12, textAlign:"center" }}>No content to preview.</div>;
  }
  const icons = {
    Summary: (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>),
    Skills:  (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>),
    "Work Experience": (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>),
    Projects: (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>),
    Education: (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>),
    Certifications: (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>),
  };
  const fallbackIcon = (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>);
  return (
    <div style={{ padding:"16px 20px", overflowY:"auto", maxHeight:700 }}>
      {headerLines.length>0 && (
        <div style={{ textAlign:"center", marginBottom:18, paddingBottom:14, borderBottom:`2px solid ${C.teal}44` }}>
          {headerLines[0] && <div style={{ fontSize:17, fontWeight:700, color:C.sidebar, marginBottom:3 }}>{headerLines[0]}</div>}
          {headerLines[1] && !headerLines[1].includes("@") && !headerLines[1].match(/\d{8,}/) && (
            <div style={{ fontSize:12, color:C.primary, fontWeight:600, marginBottom:4 }}>{headerLines[1]}</div>
          )}
          {headerLines.slice(1).filter(l=>l.includes("@")||l.includes("📧")||l.includes("📱")||l.includes("📍")||l.includes("linkedin")).map((l,i)=>(
            <div key={i} style={{ fontSize:11, color:C.muted, marginTop:2 }}>{l}</div>
          ))}
        </div>
      )}
      {sections.map(sec=>(
        <div key={sec.label} style={{ marginBottom:16 }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:6, paddingBottom:5, borderBottom:`1px solid ${C.border}` }}>
            <span style={{ display:"flex", color:C.teal }}>{icons[sec.label]||fallbackIcon}</span>
            <span style={{ fontSize:11, fontWeight:700, color:C.teal, letterSpacing:"0.10em", textTransform:"uppercase" }}>{sec.label}</span>
          </div>
          <div style={{ fontSize:12, color:C.text, lineHeight:1.8, whiteSpace:"pre-wrap", fontFamily:font.body }}>
            {sec.content.split("\n").map((line,i)=>{
              const s=line.trim(); if (!s) return null;
              const isBullet=/^[-•◦◆▪*]/.test(s);
              const isDraft=s.startsWith("[DRAFT");
              return (
                <div key={i} style={{ display:"flex", gap:8, marginBottom:isBullet?3:5, color:isDraft?C.amber:C.text }}>
                  {isBullet && <span style={{ color:C.teal, flexShrink:0, marginTop:1 }}>•</span>}
                  <span style={{ fontWeight:isDraft?600:400, fontStyle:isDraft?"italic":"normal" }}>{isBullet?s.replace(/^[-•◦◆▪*]\s*/,""):s}</span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ─── JD Alignment ───────────────────────────────────────── */
function PageJDAlign({ setPage, selectedId, alignState, setAlignState, startAI, stopAI }) {
  const [candidates, setCandidates] = useState([]); const [candidate, setCandidate] = useState(null);
  const [draftText, setDraftText] = useState(""); const [generating, setGenerating] = useState(false);
  const [saving, setSaving] = useState(false); const [genStats, setGenStats] = useState(null);
  const [draftView, setDraftView] = useState("edit");
  const [generated, setGenerated] = useState(false);
  const [roleCompat, setRoleCompat] = useState(null);
  const [overrideCompat, setOverrideCompat] = useState(false);

  useEffect(() => { api.getCandidates().then(list => { setCandidates(list); if (list.length>0) { const id=selectedId||alignState?.candidateId||list[0].id; loadCandidate(id, list); } }); }, []);

  const loadCandidate = async (id, list) => {
    const c = await api.getCandidate(id);
    if (!c) {
      // stale ID (candidate belongs to another recruiter) — fall back to first in list
      const fallbackId = list && list.length > 0 ? list[0].id : null;
      if (fallbackId && fallbackId !== id) { loadCandidate(fallbackId, list); } else { setCandidate(null); setDraftText(""); setGenStats(null); setGenerated(false); }
      return;
    }
    setCandidate(c); setOverrideCompat(false);
    try { const rc = await authFetch(`${API}/candidates/${id}/role-compatibility`).then(r=>r.json()); setRoleCompat(rc); } catch (ex) { setRoleCompat(null); }
    if (alignState?.candidateId===id && alignState?.draftText) {
      setDraftText(alignState.draftText); setGenStats(alignState.genStats||null); setGenerated(true);
    } else {
      setDraftText(c.manual_resume_text||""); setGenerated(!!c.manual_resume_text);
      const hist=c.align_history||[];
      if (hist.length>0) { const last=hist[hist.length-1]; setGenStats({skills:last.added_skills||0,projects:last.added_projects||0,scoreBefore:last.score_before||0,scoreAfter:last.score_after||0,semBefore:last.sem_score_before??null,semAfter:last.sem_score_after??null,rephrased:last.rephrased_count||0}); }
      else setGenStats(null);
    }
  };

  const handleGenerate = async () => {
    if (!candidate) return;
    setGenerating(true);
    startAI && startAI("Queuing JD alignment for " + (candidate.name||"candidate") + "...");
    const res = await api.generateJDAligned(candidate.id);
    if (res.success) {
      setCandidate(prev => ({...prev, status:"Processing"}));
      // Poll until Processing is done then load results
      const poll = setInterval(async () => {
        const updated = await api.getCandidate(candidate.id);
        if (updated && updated.status !== "Processing") {
          clearInterval(poll);
          setGenerating(false); stopAI && stopAI();
          setCandidate(updated);
          // Load align history to get draft
          const hist = updated.align_history ? JSON.parse(updated.align_history) : [];
          if (hist.length > 0) {
            const last = hist[hist.length-1];
            const stats = {skills:last.added_skills||0,projects:last.added_projects||0,scoreBefore:last.score_before||0,scoreAfter:last.score_after||0,semBefore:last.sem_score_before??null,semAfter:last.sem_score_after??null,rephrased:last.rephrased_count||0};
            setGenStats(stats); setGenerated(true);
          }
          // Reload full candidate to get draft text
          const full = await api.getCandidate(candidate.id);
          if (full) { setDraftText(full.manual_resume_text||full.improved_resume_text||""); }
        }
      }, 3000);
    } else {
      setGenerating(false); stopAI && stopAI();
      alert("Generation failed: "+(res.error||"Error"));
    }
  };

  const handleSave = async () => {
    if (!candidate||!draftText) return; setSaving(true);
    const res = await api.saveManualResume(candidate.id, draftText); setSaving(false);
    if (res.success) alert("✅ JD-Aligned resume saved! Click ⬇ Download to get Word doc."); else alert("Save failed!");
  };

  const isBlocked = roleCompat?.verdict==="incompatible" && !overrideCompat;

  return (
    <div className="fade-in">
      <Topbar title="JD Alignment" sub="Generate and edit JD-aligned resume draft" />
      <div className="page-content">

        <div style={{ background:"#fef9c3", border:"1px solid #eab308", borderRadius:10, padding:"12px 18px", marginBottom:16, display:"flex", alignItems:"center", gap:12 }}>
          <span style={{ color:"#d97706", display:"flex", flexShrink:0 }}>{STAT_ICONS.warn}</span>
          <div style={{ fontSize:13, color:"#7a5c00" }}><strong>JD-Aligned Resume Draft</strong> — AI-generated content for editing. Review all content carefully. Label: <strong>"JD-Aligned Resume – User Edited"</strong></div>
        </div>

        <div style={{ marginBottom:14 }}>
          <select onChange={e=>loadCandidate(Number(e.target.value))} value={candidate?.id||""} style={{ padding:"9px 14px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.card, color:C.text }}>
            {candidates.map(c=><option key={c.id} value={c.id}>{c.name||"Unknown"} — {c.company_name||"N/A"}</option>)}
          </select>
        </div>

        {/* Role compatibility banner */}
        {roleCompat && roleCompat.verdict && (()=>{
          const isIncompat=roleCompat.verdict==="incompatible"; const isAdj=roleCompat.verdict==="adjacent";
          const bg=isIncompat?"#FFF1F2":isAdj?"#FFFBEB":"#F0FDFB";
          const border=isIncompat?"#B91C1C":isAdj?"#d97706":"#0d9488";
          const icon=isIncompat?STAT_ICONS.xmark:isAdj?STAT_ICONS.warn:STAT_ICONS.ok;
          const tc=isIncompat?"#7F1D1D":isAdj?"#78350f":"#065F59";
          return (
            <div style={{ background:bg, border:`1px solid ${border}`, borderRadius:10, padding:"14px 20px", marginBottom:16 }}>
              <div style={{ display:"flex", alignItems:"flex-start", gap:12 }}>
                <span style={{ color:tc, display:"flex", flexShrink:0, marginTop:2 }}>{icon}</span>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:14, fontWeight:700, color:tc, marginBottom:4 }}>{isIncompat?"Role Mismatch Detected":isAdj?"Partial Role Match":"Role Match Confirmed"}</div>
                  <div style={{ fontSize:13, color:tc, marginBottom:6 }}>{roleCompat.message}</div>
                  <div style={{ display:"flex", gap:16, fontSize:12, color:tc }}>
                    <span>Candidate: <strong>{roleCompat.candidate_function||"—"}</strong></span>
                    <span>JD Requires: <strong>{roleCompat.jd_function||"—"}</strong></span>
                  </div>
                  {isIncompat && !overrideCompat && (
                    <div style={{ marginTop:10, display:"flex", alignItems:"center", gap:12 }}>
                      <span style={{ fontSize:12, color:tc }}>Generation blocked — recruiter override required.</span>
                      <button onClick={()=>setOverrideCompat(true)} style={{ fontSize:12, padding:"5px 14px", background:"#9B1C1C", color:"#fff", border:"none", borderRadius:6, cursor:"pointer", fontWeight:600 }}>Override & Generate Anyway</button>
                    </div>
                  )}
                  {isIncompat && overrideCompat && <div style={{ marginTop:8, fontSize:12, color:"#7F1D1D", fontWeight:600, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{STAT_ICONS.warn}</span>Override active — generating despite role mismatch.</div>}
                </div>
              </div>
            </div>
          );
        })()}

        {candidate && (
          <>
            {/* Candidate header */}
            <SCard style={{ marginBottom:16 }}>
              <div style={{ padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
                <div style={{ display:"flex", alignItems:"center", gap:14 }}>
                  <Avatar name={candidate.name||"?"} size={46} />
                  <div>
                    <div style={{ fontSize:16, fontWeight:700, color:C.primary }}>{candidate.name||"Unknown"}</div>
                    {candidate.role && <div style={{ fontSize:12, color:C.teal, fontWeight:600, marginTop:2 }}>{candidate.role}</div>}
                    <div style={{ fontSize:12, color:C.muted, display:"flex", gap:10, flexWrap:"wrap", marginTop:4 }}>
                      <span>{candidate.score>0?`ATS: ${candidate.score}%`:"Not analyzed"}</span>
                      {candidate.company_name && <span>· {candidate.company_name}</span>}
                      {candidate.recruiter_name && <span style={{display:"flex",alignItems:"center",gap:3}}>· <span style={{display:"flex",opacity:0.6}}>{BOT_ICONS.person}</span> {candidate.recruiter_name}</span>}
                      {candidate.align_history?.length>0 && <span style={{ color:C.teal }}>· {candidate.align_history.length} run{candidate.align_history.length>1?"s":""}</span>}
                    </div>
                    {candidate.match_level && <span style={{ marginTop:5, display:"inline-block", fontSize:11, fontWeight:600, color:candidate.match_level==="High"?C.teal:C.amber, background:candidate.match_level==="High"?C.tealSoft:C.amberSoft, padding:"2px 9px", borderRadius:20 }}>{candidate.match_level} Match</span>}
                  </div>
                </div>
                <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                  {can("action:generate_aligned") && <Btn onClick={handleGenerate} disabled={generating||isBlocked}>{generating?"Generating...":"Generate JD Draft"}</Btn>}
                  <Btn variant="success" onClick={handleSave} disabled={saving||!draftText}>{saving?"Saving...":"Save Draft"}</Btn>
                  {can("action:download_resume") && <Btn variant="outline" onClick={()=>api.downloadResume(candidate.id)} disabled={!generated}>Download .docx</Btn>}
                </div>
              </div>
            </SCard>

            {/* genStats panel */}
            {genStats && (
              <SCard style={{ marginBottom:16, border:`1px solid ${C.teal}55` }}>
                <div style={{ padding:"14px 20px" }}>
                  <div style={{ display:"flex", gap:20, alignItems:"center", flexWrap:"wrap", marginBottom:10 }}>
                    <span style={{ fontSize:13, fontWeight:700, color:C.primary, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{STAT_ICONS.ok}</span>JD Alignment Complete</span>
                    <span style={{ fontSize:12 }}><b>{genStats.skills}</b> keywords injected</span>
                    {genStats.rephrased>0 && <span style={{ fontSize:12 }}><b>{genStats.rephrased}</b> soft gaps rephrased</span>}
                    <span style={{ fontSize:12 }}><b>{genStats.projects}</b> projects added</span>
                  </div>
                  {genStats.scoreBefore>0 && (
                    <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:8 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <span style={{ fontSize:11, color:C.muted, width:130 }}>ATS Match:</span>
                        <span style={{ fontSize:13, fontWeight:700, color:C.textSub }}>{genStats.scoreBefore}%</span>
                        <span style={{ color:C.muted }}>→</span>
                        <span style={{ fontSize:13, fontWeight:700, color:C.primary }}>{genStats.scoreAfter}%</span>
                        <span style={{ fontSize:11, color:C.primary, fontWeight:600 }}>(+{genStats.scoreAfter-genStats.scoreBefore}%)</span>
                      </div>
                      {genStats.semBefore!=null && (
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                          <span style={{ fontSize:11, color:C.muted, width:130 }}>Semantic:</span>
                          <span style={{ fontSize:13, fontWeight:700, color:C.textSub }}>{genStats.semBefore}%</span>
                          <span style={{ color:C.muted }}>→</span>
                          <span style={{ fontSize:13, fontWeight:700, color:C.primary }}>{genStats.semAfter}%</span>
                          <span style={{ fontSize:11, color:C.primary, fontWeight:600 }}>(+{(genStats.semAfter-genStats.semBefore).toFixed(1)}%)</span>
                        </div>
                      )}
                    </div>
                  )}
                  <div style={{ fontSize:11, color:C.muted }}>Review the draft → edit content marked [DRAFT] → Save Draft</div>
                  {candidate?.align_history?.length>1 && (
                    <div style={{ marginTop:12, borderTop:`1px solid ${C.teal}44`, paddingTop:10 }}>
                      <div style={{ fontSize:11, fontWeight:700, color:C.teal, marginBottom:8, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{STAT_ICONS.chart}</span>All Alignment Runs — History</div>
                      <div style={{ display:"grid", gridTemplateColumns:"0.4fr 1fr 1fr 1fr 1fr 1fr", gap:"4px 12px", fontSize:11 }}>
                        {["Run","Date & Time","ATS Before→After","Semantic Before→After","Keywords","Rephrased"].map(h=>(
                          <span key={h} style={{ color:C.muted, fontWeight:700 }}>{h}</span>
                        ))}
                        {[...(candidate.align_history||[])].reverse().map((h,i)=>(
                          <React.Fragment key={i}>
                            <span style={{ color:C.text }}>#{h.run}</span>
                            <span style={{ color:C.text }}>{h.timestamp}</span>
                            <span style={{ color:C.primary, fontWeight:600 }}>{h.score_before}% → {h.score_after}%</span>
                            <span style={{ color:C.primary, fontWeight:600 }}>{h.sem_score_before!=null?`${h.sem_score_before}% → ${h.sem_score_after}%`:"—"}</span>
                            <span style={{ color:C.text }}>{h.added_skills} skills · {h.added_projects} proj</span>
                            <span style={{ color:C.text }}>{h.rephrased_count||0} bullets</span>
                          </React.Fragment>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </SCard>
            )}

            {/* Gaps context panel */}
            {candidate.gaps?.length>0 && (()=>{
              const mustHave   = (candidate.gaps||[]).filter(g=>g.startsWith("[MUST HAVE]")).map(g=>g.replace("[MUST HAVE] ",""));
              const niceToHave = (candidate.gaps||[]).filter(g=>g.startsWith("[NICE TO HAVE]")).map(g=>g.replace("[NICE TO HAVE] ",""));
              const legacy     = (candidate.gaps||[]).filter(g=>!g.startsWith("["));
              return (
                <SCard style={{ marginBottom:16 }}>
                  <SHead action={<span style={{ fontSize:11, color:C.muted, fontWeight:500 }}>{candidate.gaps.length} total · will be injected</span>}>Skill Gaps to Address</SHead>
                  <div style={{ padding:"12px 16px", display:"flex", flexDirection:"column", gap:8 }}>
                    {mustHave.length>0 && (
                      <div style={{ background:"#FFF1F2", border:"1px solid #B91C1C30", borderRadius:10, padding:12 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:"#9B1C1C", marginBottom:7, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{STAT_ICONS.xmark}</span>MUST HAVE — CV will likely be rejected without these <span style={{ background:"#FFE4E6", borderRadius:20, padding:"1px 7px", marginLeft:4 }}>{mustHave.length}</span></div>
                        <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>{mustHave.map((g,i)=><span key={i} style={{ background:"#FFE4E6", color:"#9B1C1C", border:"1px solid #9B1C1C44", borderRadius:12, padding:"2px 9px", fontSize:11, fontWeight:600 }}>{g}</span>)}</div>
                      </div>
                    )}
                    {niceToHave.length>0 && (
                      <div style={{ background:C.amberSoft, border:`1px solid ${C.amber}55`, borderRadius:10, padding:12 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:"#b45309", marginBottom:7, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{BOT_ICONS.bulb}</span>NICE TO HAVE — Strengthens profile <span style={{ background:"#fde68a", borderRadius:20, padding:"1px 7px", marginLeft:4 }}>{niceToHave.length}</span></div>
                        <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>{niceToHave.map((g,i)=><span key={i} style={{ background:"#fef3c7", color:"#b45309", border:`1px solid ${C.amber}`, borderRadius:12, padding:"2px 9px", fontSize:11 }}>{g}</span>)}</div>
                      </div>
                    )}
                    {legacy.length>0 && (
                      <div style={{ background:C.primarySoft, border:`1px solid ${C.primary}44`, borderRadius:10, padding:12 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:C.primary, marginBottom:7, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{BOT_ICONS.alert}</span>Gaps — will be injected into draft</div>
                        <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>{legacy.map((g,i)=><span key={i} style={{ background:"#fff", color:C.primary, border:`1px solid ${C.primary}44`, borderRadius:12, padding:"2px 9px", fontSize:11 }}>{g}</span>)}</div>
                      </div>
                    )}
                  </div>
                </SCard>
              );
            })()}

            {/* Two-column editor */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
              <SCard>
                <div className="diff-col-head" style={{ background:"#fafbfc" }}>
                  <div className="diff-col-dot" style={{ background:"#CBD5E1" }} />
                  <span style={{ fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.1em" }}>Original Resume</span>
                  <span style={{ marginLeft:"auto", fontSize:11, background:C.bg, color:C.muted, border:`1px solid ${C.border}`, borderRadius:10, padding:"2px 8px", fontWeight:600 }}>Read Only</span>
                </div>
                <ResumePreview text={candidate.original_resume_text||""} />
              </SCard>
              <SCard style={{ border:`1px solid ${C.teal}44` }}>
                <div className="diff-col-head" style={{ background:"#f0fdfa" }}>
                  <div className="diff-col-dot" style={{ background:C.teal }} />
                  <span style={{ fontSize:11, fontWeight:700, color:C.teal, textTransform:"uppercase", letterSpacing:"0.1em" }}>JD-Aligned Draft</span>
                  {generated && <span style={{ fontSize:11, background:C.tealSoft, color:C.teal, borderRadius:10, padding:"2px 8px", fontWeight:700, display:"inline-flex", alignItems:"center", gap:4 }}><span style={{display:"flex"}}>{STAT_ICONS.check}</span>Draft Ready</span>}
                  {draftText && (
                    <div style={{ display:"flex", background:C.bg, borderRadius:6, border:`1px solid ${C.border}`, overflow:"hidden", marginLeft:"auto" }}>
                      {[{id:"edit",icon:STAT_ICONS.edit,label:"Edit"},{id:"preview",icon:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,label:"Preview"}].map(v=>(
                        <button key={v.id} onClick={()=>setDraftView(v.id)} style={{ padding:"4px 12px", fontSize:11, fontWeight:600, border:"none", cursor:"pointer", background:draftView===v.id?C.teal:"transparent", color:draftView===v.id?"#fff":C.muted, display:"flex", alignItems:"center", gap:4 }}>{v.icon}{v.label}</button>
                      ))}
                    </div>
                  )}
                </div>
                {!draftText && !generating && <div className="empty-state"><div className="empty-state-icon" style={{color:C.primary,display:"flex",justifyContent:"center"}}><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></div><div className="empty-state-title">No draft yet</div><div className="empty-state-sub">Click Generate JD Draft above</div></div>}
                {generating && <div className="empty-state"><div style={{ marginBottom:14, display:"flex", justifyContent:"center", color:C.teal }}><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{animation:"spin 1.5s linear infinite"}}><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></div><div className="empty-state-title">Generating…</div><div className="empty-state-sub">1–3 minutes with local LLM. You can navigate away.</div></div>}
                {draftText && !generating && draftView==="edit" && <textarea value={draftText} onChange={e=>setDraftText(e.target.value)} style={{ width:"100%", height:700, padding:"12px 16px", border:"none", fontSize:11, fontFamily:font.mono, background:"#f7fffe", resize:"vertical", outline:"none", lineHeight:1.7 }} />}
                {draftText && !generating && draftView==="preview" && <ResumePreview text={draftText} />}
              </SCard>
            </div>

            {/* Word Doc format panel */}
            <div style={{ background:C.sidebar, borderRadius:12, padding:20, marginTop:16 }}>
              <div style={{ fontSize:11, color:"rgba(255,255,255,0.4)", letterSpacing:"0.10em", textTransform:"uppercase", marginBottom:12, display:"flex", alignItems:"center", gap:6 }}><span style={{display:"flex",color:"rgba(255,255,255,0.5)"}}>{NAV_ICONS.jdmanager}</span>Word Doc Resume Format — Sections included in download</div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10 }}>
                {["Candidate Name","Contact Details","Location","LinkedIn","Professional Summary","Technical Skills","Work Experience","Project Summary","Education Details","Certifications","Version Label","HR Reviewed"].map((lbl,i)=>(
                  <div key={i} style={{ background:"rgba(255,255,255,0.05)", borderRadius:8, padding:"10px 14px", display:"flex", alignItems:"center", gap:8 }}>
                    <div style={{ width:6, height:6, borderRadius:"50%", background:"rgba(91,173,255,0.7)", flexShrink:0 }} />
                    <span style={{ fontSize:11, color:"#fff" }}>{lbl}</span>
                  </div>
                ))}
              </div>
            </div>
          </>
        )}

        {!candidate && candidates.length===0 && (
          <div className="empty-state">
            <div className="empty-state-icon">🎯</div>
            <div className="empty-state-title">No candidates yet</div>
            <div className="empty-state-sub">Upload a resume to get started</div>
            <Btn icon="↑" small onClick={()=>setPage("upload")}>Upload Resume</Btn>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── Aligned Resumes ────────────────────────────────────── */
function PageJDAlignList({ setPage, setSelectedId }) {
  const [candidates, setCandidates] = useState([]);
  const [filter, setFilter] = useState("All");
  const [expanded, setExpanded] = useState(null);
  const [approving, setApproving] = useState(null);
  const [pg, setPg] = useState(0);
  const PER = 8;

  const load = () => api.getJDAligned().then(setCandidates);
  useEffect(() => { load(); }, []);

  const filtered = filter==="All" ? candidates
    : filter==="Approved" ? candidates.filter(c=>c.status==="Approved")
    : candidates.filter(c=>c.status!=="Approved");
  const paginated = filtered.slice(pg*PER, (pg+1)*PER);
  const totalPgs = Math.ceil(filtered.length/PER);

  const handleApprove = async (id) => {
    setApproving(id);
    const res = await api.approve(id);
    setApproving(null);
    if (res.success) { load(); alert("✅ Candidate approved!"); }
    else alert("Failed: "+(res.error||"Error"));
  };

  const versionColor = (v) => v==="AI_SIMULATED"?C.teal:v==="JD_ALIGNED"?"#7c6af7":C.amber;
  const versionBg    = (v) => v==="AI_SIMULATED"?C.tealSoft:v==="JD_ALIGNED"?"#eeecff":C.amberSoft;
  const versionLabel = (v) => v==="AI_SIMULATED"?"User Edited":v==="JD_ALIGNED"?"AI Draft":v||"Original";

  return (
    <div className="fade-in">
      <Topbar title="JD-Aligned Resumes" sub="Candidates with JD-aligned resume drafts" />
      <div className="page-content">

        <div style={{ display:"flex", gap:12, flexWrap:"wrap", marginBottom:20, background:"linear-gradient(135deg,rgba(13,148,136,0.06) 0%,rgba(21,88,203,0.03) 100%)", borderRadius:14, padding:"14px", border:"1px solid #C8DDD9", boxShadow:"inset 0 1px 0 rgba(255,255,255,0.8)" }}>
          <StatCard label="Total Aligned"     value={candidates.length}                                              gradient={C.tealGrad}    icon="chart"  />
          <StatCard label="Approved"          value={candidates.filter(c=>c.status==="Approved").length}             gradient={C.tealGrad} icon="check"  />
          <StatCard label="Pending Approval"  value={candidates.filter(c=>c.status!=="Approved").length}             gradient={C.amberGrad}   icon="clock"  />
          <StatCard label="User Edited"       value={candidates.filter(c=>c.resume_version_type==="AI_SIMULATED").length} gradient={C.primaryGrad} icon="edit"   />
        </div>

        <div style={{ display:"flex", gap:8, marginBottom:16 }}>
          {[{s:"All",c:C.primary,bg:C.primarySoft,dot:C.primary},{s:"Approved",c:"#065F59",bg:"rgba(13,148,136,0.10)",dot:"#0d9488"},{s:"Pending",c:"#78350f",bg:"#fef3c7",dot:"#d97706"}].map(({s,c,bg,dot})=>(
            <button key={s} onClick={()=>{ setFilter(s); setPg(0); }} style={{ display:"inline-flex",alignItems:"center",gap:5,padding:"5px 16px",borderRadius:20,cursor:"pointer",border:`1px solid ${filter===s?dot+"99":"#C8D4E8"}`,background:filter===s?bg:"#fff",color:filter===s?c:C.muted,fontSize:12,fontWeight:filter===s?700:400,boxShadow:filter===s?`0 0 0 2px ${dot}22`:"none",transition:"all 0.15s" }}>{s!=="All"&&<span style={{width:6,height:6,borderRadius:"50%",background:filter===s?dot:"#CBD5E1",flexShrink:0,display:"inline-block"}}/>}{s}</button>
          ))}
          <span style={{ marginLeft:"auto", fontSize:12, color:C.muted, alignSelf:"center" }}>{filtered.length} result{filtered.length!==1?"s":""}</span>
        </div>

        {filtered.length===0 && (
          <div className="empty-state">
            <div className="empty-state-icon" style={{color:C.teal}}>{STAT_ICONS.chart}</div>
            <div className="empty-state-title">No JD-aligned resumes yet</div>
            <div className="empty-state-sub">Go to <span style={{ color:C.primary, cursor:"pointer", fontWeight:700 }} onClick={()=>setPage("jdalign")}>JD Alignment</span> to generate aligned drafts.</div>
          </div>
        )}

        {totalPgs>1 && (
          <div style={{ display:"flex", gap:6, marginBottom:14 }}>
            {Array.from({length:Math.min(totalPgs,7)},(_,i)=>(
              <button key={i} onClick={()=>setPg(i)} className={`page-num-btn${pg===i?" active":""}`}>{i+1}</button>
            ))}
          </div>
        )}

        {paginated.map(c=>(
          <div key={c.id} className="scard" style={{ background:C.card, border:`1px solid ${expanded===c.id?C.primary+"55":C.border}`, borderRadius:12, marginBottom:12, overflow:"hidden", boxShadow:"0 2px 8px rgba(21,88,203,0.06)" }}>
            <div style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 20px", cursor:"pointer" }} onClick={()=>setExpanded(expanded===c.id?null:c.id)}>
              <Avatar name={c.name||"?"} size={42} />
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                  <span style={{ fontSize:14, fontWeight:700, color:C.primary }}>{c.name||"Unknown"}</span>
                  <span style={{ fontSize:11, fontWeight:600, color:versionColor(c.resume_version_type), background:versionBg(c.resume_version_type), padding:"2px 8px", borderRadius:10 }}>{versionLabel(c.resume_version_type)}</span>
                  <StatusBadge status={c.status} />
                  {c.score>0 && <span className="score-chip" style={{ background:c.score>=75?C.primarySoft:C.amberSoft, color:c.score>=75?C.primary:C.amber, border:`1px solid ${c.score>=75?C.primary+"33":C.amber+"33"}` }}>{c.score}% match</span>}
                </div>
                <div style={{ fontSize:11, color:C.muted, marginTop:3, display:"flex", flexWrap:"wrap", gap:10 }}>
                  {c.email && <span style={{display:"flex",alignItems:"center",gap:3}}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>{c.email}</span>}
                  {c.mobile && <span style={{display:"flex",alignItems:"center",gap:3}}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>{c.mobile}</span>}
                  {c.location && <span style={{display:"flex",alignItems:"center",gap:3}}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>{c.location}</span>}
                </div>
                <div style={{ fontSize:11, color:C.muted, marginTop:1 }}>
                  {c.client_requirement ? `${c.client_requirement.client_name} — ${c.client_requirement.job_title}` : c.company_name||""}
                  {c.created_at && <span>  ·  {c.created_at.slice(0,10)}</span>}
                </div>
              </div>
              <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                {can("action:approve_candidate") && c.status!=="Approved" && (
                  <Btn onClick={(e)=>{ e.stopPropagation(); handleApprove(c.id); }} variant="success" small disabled={approving===c.id}>{approving===c.id?"...":<><span style={{display:"flex"}}>{STAT_ICONS.check}</span>Approve</>}</Btn>
                )}
                {can("action:download_resume") && <Btn onClick={(e)=>{ e.stopPropagation(); api.downloadResume(c.id); }} variant="outline" small><>{STAT_ICONS.download} .docx</></Btn>}
                <Btn onClick={(e)=>{ e.stopPropagation(); if(setSelectedId) setSelectedId(c.id); setPage("jdalign"); }} small><>{STAT_ICONS.edit} Edit Alignment</></Btn>
                <span style={{ fontSize:18, color:C.muted, paddingLeft:4 }}>{expanded===c.id?"▲":"▼"}</span>
              </div>
            </div>

            {expanded===c.id && (
              <div style={{ borderTop:`1px solid ${C.borderSoft}`, padding:"16px 20px", background:"#F8FAFD" }}>
                {(c.strengths?.length>0 || c.gaps?.length>0) && (
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:14 }}>
                    {c.strengths?.length>0 && (
                      <div style={{ background:C.primarySoft, border:`1px solid ${C.primary}33`, borderRadius:9, padding:14 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:C.primary, marginBottom:8, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{STAT_ICONS.ok}</span>Matched Skills ({c.strengths.length})</div>
                        <div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>{c.strengths.slice(0,8).map((s,i)=><span key={i} style={{ background:`${C.primary}12`, color:C.primary, border:`1px solid ${C.primary}22`, borderRadius:10, padding:"1px 7px", fontSize:11 }}>{s.replace("Has: ","")}</span>)}</div>
                      </div>
                    )}
                    {c.gaps?.length>0 && (
                      <div style={{ background:C.primarySoft, border:`1px solid ${C.primary}44`, borderRadius:9, padding:14 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:C.primary, marginBottom:8, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{STAT_ICONS.warn}</span>Gaps vs JD</div>
                        {c.gaps.map((g,i)=><div key={i} style={{ fontSize:11, color:C.text, marginBottom:3 }}>• {g}</div>)}
                      </div>
                    )}
                  </div>
                )}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                  <div>
                    <div style={{ fontSize:11, color:C.muted, fontWeight:700, letterSpacing:"0.08em", marginBottom:6 }}>ALIGNED RESUME (Saved Draft)</div>
                    <textarea readOnly value={c.manual_resume_text||c.improved_resume_text||"No draft saved yet"} style={{ width:"100%", height:320, padding:"10px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:11, fontFamily:font.mono, background:"#F8FAFD", resize:"vertical", lineHeight:1.6 }} />
                  </div>
                  {c.client_requirement?.jd_text && (
                    <div>
                      <div style={{ fontSize:11, color:C.muted, fontWeight:700, letterSpacing:"0.08em", marginBottom:6 }}>JD — {c.client_requirement.client_name} · {c.client_requirement.job_title}</div>
                      <textarea readOnly value={c.client_requirement.jd_text} style={{ width:"100%", height:320, padding:"10px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:11, fontFamily:font.mono, background:C.bg, resize:"vertical", lineHeight:1.6 }} />
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── Pipeline Status ────────────────────────────────────── */
function PagePipeline({ aiOnline, aiProvider }) {
  const [candidates, setCandidates] = useState([]);
  useEffect(() => { api.getCandidates().then(setCandidates); }, []);
  const providerLabel = { groq:"Groq", nvidia:"NVIDIA NIM", gemini:"Google Gemini", azure:"Azure OpenAI", ollama:"Ollama" }[aiProvider] || "AI Provider";
  return (
    <div className="fade-in">
      <Topbar title="Pipeline Status" sub="AI pipeline and system health" />
      <div className="page-content">
        <div style={{ display:"flex", gap:12, marginBottom:22, background:"linear-gradient(135deg,rgba(13,148,136,0.06) 0%,rgba(21,88,203,0.03) 100%)", borderRadius:14, padding:"14px", border:"1px solid #C8DDD9", boxShadow:"inset 0 1px 0 rgba(255,255,255,0.8)" }}>
          <StatCard label="Total Processed" value={candidates.length}  gradient={C.tealGrad}   icon="folder" />
          <StatCard label="Bot Analyzed"    value={candidates.filter(c=>c.status==="Bot Analyzed").length}  gradient={C.purpleGrad} icon="cpu"    />
          <StatCard label="Approved"        value={candidates.filter(c=>c.status==="Approved").length}  gradient={C.amberGrad}  icon="check"  />
          <StatCard label="JD Aligned"      value={candidates.filter(c=>c.resume_version_type==="AI_SIMULATED").length} gradient={C.primaryGrad} icon="target" />
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
          <SCard>
            <SHead>System Status</SHead>
            <div style={{ padding:16 }}>
              {[
                { label:"FastAPI Backend", ok:true, detail:"http://127.0.0.1:8000" },
                { label:providerLabel, ok:aiOnline, detail:aiOnline?"Connected":"Not connected — check Settings" },
                { label:"Database", ok:true, detail:"SQLite / PostgreSQL connected" },
                { label:"Word Doc Generator", ok:true, detail:"python-docx ready" },
                { label:"Upload Folder", ok:true, detail:"./uploads" },
              ].map((s,i)=>(
                <div key={i} className="info-row" style={{ background:s.ok?"#F8FAFD":"#fff5f5", border:`1px solid ${s.ok?"#D1D9E6":"#fca5a5"}` }}>
                  <div style={{ width:10, height:10, borderRadius:"50%", background:s.ok?"#0d9488":"#B91C1C", flexShrink:0, boxShadow:s.ok?"0 0 0 3px rgba(13,148,136,0.2)":"0 0 0 3px rgba(185,28,28,0.2)" }} />
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:C.text }}>{s.label}</div>
                    <div style={{ fontSize:11, color:C.muted, marginTop:1 }}>{s.detail}</div>
                  </div>
                  <span style={{ fontSize:11, fontWeight:700, color:s.ok?"#065F59":"#9B1C1C", background:s.ok?"rgba(13,148,136,0.12)":"#FFE4E6", padding:"3px 10px", borderRadius:20 }}>{s.ok?"● Online":"○ Offline"}</span>
                </div>
              ))}
            </div>
          </SCard>
          <SCard>
            <SHead>Candidate Pipeline</SHead>
            <div style={{ padding:16 }}>
              {["Uploaded","Pending Review","Bot Analyzed","Approved"].map(status=>{
                const count = candidates.filter(c=>c.status===status).length;
                const pct = candidates.length ? Math.round(count/candidates.length*100) : 0;
                const colors = { "Uploaded":"#3b82f6","Pending Review":"#d97706","Bot Analyzed":"#7c3aed","Approved":"#0d9488" };
                return (
                  <div key={status} style={{ marginBottom:18 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:7 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                        <div style={{ width:8, height:8, borderRadius:"50%", background:colors[status], flexShrink:0 }} />
                        <span style={{ fontSize:13, color:C.text, fontWeight:500 }}>{status}</span>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                        <span style={{ fontSize:14, fontWeight:800, color:colors[status] }}>{count}</span>
                        <span style={{ fontSize:11, color:C.muted, fontWeight:400 }}>{pct}%</span>
                      </div>
                    </div>
                    <div style={{ height:10, background:"#EEF2F9", borderRadius:10, overflow:"hidden", border:"1px solid #E2E8F0" }}>
                      <div style={{ height:"100%", width:`${pct}%`, background:`linear-gradient(90deg,${colors[status]},${colors[status]}cc)`, borderRadius:10, transition:"width 0.6s ease", boxShadow:`0 0 6px ${colors[status]}55` }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </SCard>
        </div>
      </div>
    </div>
  );
}

/* ─── AI Log Viewer ─────────────────────────────────────── */
function AILogViewer() {
  const [logs, setLogs]         = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [statusF, setStatusF]   = React.useState("All");
  const [userF, setUserF]       = React.useState("All");
  const [dateF, setDateF]       = React.useState("");

  const load = () => {
    setLoading(true);
    authFetch(`${API}/settings/ai-logs?limit=200`).then(r=>r.json()).then(d=>{
      setLogs(d.logs||[]); setLoading(false);
    }).catch(()=>setLoading(false));
  };
  React.useEffect(()=>{ load(); }, []);

  // Build unique user list for dropdown
  const users = ["All", ...Array.from(new Set(logs.map(l=>l.email).filter(e=>e&&e!=="—")))];

  const filtered = logs.filter(l => {
    const okStatus = statusF==="All" || l.status===statusF;
    const okUser   = userF==="All"   || l.email===userF;
    const okDate   = !dateF          || l.ts.startsWith(dateF);
    return okStatus && okUser && okDate;
  });

  const statusColor = s => s==="OK"?"#0d9488":s.startsWith("HTTP")?"#f59e0b":"#ef4444";
  const statusBg    = s => s==="OK"?"#f0fdfa":s.startsWith("HTTP")?"#fffbeb":"#fff0f0";

  const sel = { padding:"7px 10px", border:`1px solid ${C.border}`, borderRadius:7, fontSize:12, background:"#fff", color:C.text, cursor:"pointer", outline:"none" };

  const okCount  = logs.filter(l=>l.status==="OK").length;
  const errCount = logs.filter(l=>l.status!=="OK").length;

  return (
    <div style={{ padding:20 }}>

      {/* Summary cards */}
      <div style={{ display:"flex", gap:10, marginBottom:16 }}>
        {[
          { label:"Total Calls", value:logs.length, color:C.primary, bg:C.primarySoft },
          { label:"Successful",  value:okCount,     color:"#0d9488", bg:"#f0fdfa" },
          { label:"Errors",      value:errCount,    color:"#ef4444", bg:"#fff0f0" },
          { label:"Users Active",value:users.length-1, color:"#7c3aed", bg:"#f5f3ff" },
        ].map(s=>(
          <div key={s.label} style={{ flex:1, background:s.bg, border:`1px solid ${s.color}22`, borderRadius:10, padding:"10px 14px", textAlign:"center" }}>
            <div style={{ fontSize:22, fontWeight:800, color:s.color }}>{s.value}</div>
            <div style={{ fontSize:11, color:s.color, fontWeight:600, marginTop:2 }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Filters */}
      <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap", alignItems:"center" }}>
        {/* Date picker */}
        <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
          <span style={{ fontSize:10, fontWeight:700, color:C.muted, textTransform:"uppercase" }}>Date</span>
          <input type="date" value={dateF} onChange={e=>setDateF(e.target.value)} style={sel}/>
        </div>
        {/* User dropdown */}
        <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
          <span style={{ fontSize:10, fontWeight:700, color:C.muted, textTransform:"uppercase" }}>User</span>
          <select value={userF} onChange={e=>setUserF(e.target.value)} style={{...sel, minWidth:200}}>
            {users.map(u=><option key={u} value={u}>{u==="All"?"All Users":u}</option>)}
          </select>
        </div>
        {/* Status filter */}
        <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
          <span style={{ fontSize:10, fontWeight:700, color:C.muted, textTransform:"uppercase" }}>Status</span>
          <select value={statusF} onChange={e=>setStatusF(e.target.value)} style={sel}>
            {["All","OK","ERROR"].map(s=><option key={s} value={s}>{s==="All"?"All Status":s}</option>)}
          </select>
        </div>
        {/* Clear + Refresh */}
        <div style={{ display:"flex", gap:6, alignSelf:"flex-end" }}>
          {(dateF||userF!=="All"||statusF!=="All") && (
            <button onClick={()=>{setDateF("");setUserF("All");setStatusF("All");}}
              style={{ padding:"7px 12px", borderRadius:7, border:`1px solid ${C.border}`, background:"#fff", color:C.muted, fontSize:12, cursor:"pointer" }}>
              Clear
            </button>
          )}
          <button onClick={load} style={{ padding:"7px 12px", borderRadius:7, border:`1px solid ${C.border}`, background:C.bg, color:C.muted, fontSize:12, cursor:"pointer" }}>
            ↺ Refresh
          </button>
        </div>
        <div style={{ marginLeft:"auto", fontSize:12, color:C.muted, alignSelf:"flex-end", paddingBottom:2 }}>
          Showing <b>{filtered.length}</b> of <b>{logs.length}</b> entries
        </div>
      </div>

      {loading && <div style={{ padding:20, textAlign:"center", color:C.muted, fontSize:13 }}>Loading logs...</div>}
      {!loading && filtered.length===0 && (
        <div style={{ padding:20, background:C.bg, borderRadius:8, fontSize:13, color:C.muted, textAlign:"center" }}>
          {logs.length===0 ? "No AI activity logged yet. Run an analysis to see logs here." : "No entries match the selected filters."}
        </div>
      )}

      {!loading && filtered.length>0 && (
        <div style={{ overflowX:"auto", borderRadius:8, border:`1px solid ${C.border}` }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
            <thead>
              <tr style={{ background:"#1C3D6B" }}>
                {["Time","User","Candidate #","Operation","Model","Duration","Status","Detail"].map(h=>(
                  <th key={h} style={{ padding:"9px 12px", textAlign:"left", fontWeight:700, color:"#fff", whiteSpace:"nowrap", fontSize:11 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((l,i)=>(
                <tr key={i} style={{ background:i%2===0?"#fff":"#F8FAFD", borderBottom:`1px solid ${C.borderSoft}` }}>
                  <td style={{ padding:"8px 12px", color:C.muted, whiteSpace:"nowrap", fontSize:11 }}>{l.ts.replace("T"," ").slice(0,16)}</td>
                  <td style={{ padding:"8px 12px", fontWeight:600, color:C.text, maxWidth:160, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }} title={l.email}>
                    {l.email!=="—"?l.email.split("@")[0]:l.user_id}
                    {l.email!=="—"&&<div style={{fontSize:10,color:C.muted,fontWeight:400}}>@{l.email.split("@")[1]||""}</div>}
                  </td>
                  <td style={{ padding:"8px 12px", color:C.muted }}>{l.candidate_id!=="—"?`#${l.candidate_id}`:"—"}</td>
                  <td style={{ padding:"8px 12px" }}>
                    <span style={{ background:l.op==="analyze"?C.primarySoft:"#f0fdfa", color:l.op==="analyze"?C.primary:C.teal, padding:"2px 8px", borderRadius:6, fontWeight:700, fontSize:10, textTransform:"uppercase" }}>
                      {l.op==="analyze"?"Analyse":l.op==="jd_align"?"JD Align":l.op||"—"}
                    </span>
                  </td>
                  <td style={{ padding:"8px 12px", color:C.text, fontFamily:"monospace", fontSize:11 }}>{l.model!=="—"?l.model:"—"}</td>
                  <td style={{ padding:"8px 12px", color:C.text, whiteSpace:"nowrap", fontWeight:600 }}>{l.duration}</td>
                  <td style={{ padding:"8px 12px" }}>
                    <span style={{ background:statusBg(l.status), color:statusColor(l.status), padding:"3px 10px", borderRadius:6, fontWeight:700, fontSize:10 }}>{l.status}</span>
                  </td>
                  <td style={{ padding:"8px 12px", color:(l.extra&&l.extra.includes("error"))?"#ef4444":C.muted, maxWidth:220, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", fontSize:11 }} title={l.extra}>
                    {l.extra||"—"}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ─── Model Manager ─────────────────────────────────────── */
const SUGGESTED_MODELS = [
  { name:"qwen2.5:7b",      ram:"~5 GB",  note:"Dev laptop (16GB) — Recommended" },
  { name:"qwen2.5:32b",     ram:"~20 GB", note:"Server laptop (64GB) — Recommended" },
  { name:"llama3.1:8b",     ram:"~6 GB",  note:"Good general purpose alternative" },
  { name:"deepseek-r1:14b", ram:"~9 GB",  note:"Strong reasoning & scoring" },
  { name:"qwen2.5:72b",     ram:"~45 GB", note:"Highest quality — 64GB+ only" },
  { name:"deepseek-r1:32b", ram:"~20 GB", note:"Server — strong reasoning" },
];

function ModelManager({ ollamaUrl, activeModel, onModelChange }) {
  const [sysStatus, setSysStatus]   = React.useState(null);
  const [pulling, setPulling]       = React.useState(false);
  const [pullModel, setPullModel]   = React.useState("");
  const [pullPhase, setPullPhase]   = React.useState(""); // "removing"|"downloading"|"done"|"error"
  const [pullMsg, setPullMsg]       = React.useState("");
  const [deleting, setDeleting]     = React.useState("");
  const [toast, setToast]           = React.useState(null); // { msg, ok }

  const showToast = (msg, ok=true) => {
    setToast({msg, ok});
    setTimeout(()=>setToast(null), 4000);
  };

  const loadStatus = () => {
    authFetch(`${API}/settings/system-status`).then(r=>r.json()).then(setSysStatus).catch(()=>{});
  };

  React.useEffect(()=>{
    loadStatus();
    const timer = setInterval(loadStatus, 2000); // poll every 2s for real-time RAM
    return ()=>clearInterval(timer);
  }, []);

  const handlePull = async (modelName) => {
    if (!modelName.trim() || pulling) return;
    setPulling(true); setPullPhase("removing"); setPullMsg("Removing current model to free RAM...");

    // Remove all installed models via backend proxy (avoids CORS)
    const installed = sysStatus?.installed || [];
    for (const m of installed) {
      await authFetch(`${API}/settings/ollama/delete`, { method:"DELETE", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:m.name}) }).catch(()=>{});
    }
    await loadStatus();

    setPullPhase("downloading"); setPullMsg(`Downloading ${modelName} — this may take several minutes for large models...`);
    try {
      const r = await authFetch(`${API}/settings/ollama/pull`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:modelName}) });
      const data = await r.json();
      if (data.success) {
        setPullPhase("downloading");
        setPullMsg(`Downloading ${modelName} in background — this may take 20-40 minutes for large models. Watch the RAM monitor and installed models list below — it will appear automatically when ready.`);
        setPullModel("");
        // Poll until model appears in installed list
        const poll = setInterval(async () => {
          const res = await authFetch(`${API}/settings/system-status`).then(r=>r.json()).catch(()=>null);
          if (res && res.installed && res.installed.some(m=>m.name===modelName||m.name.startsWith(modelName.split(":")[0]))) {
            clearInterval(poll);
            setPullPhase("done"); setPullMsg(`✅ ${modelName} is ready!`);
            onModelChange(modelName);
            loadStatus();
            showToast(`✅ ${modelName} installed and activated!`, true);
            setPulling(false);
          }
        }, 5000);
      } else {
        setPullPhase("error"); setPullMsg(data.error || "Pull failed — check model name and try again");
        showToast("❌ Model pull failed", false);
        setPulling(false);
      }
    } catch(e) {
      setPullPhase("error"); setPullMsg("Cannot reach server — make sure Ollama is running on this machine");
      showToast("❌ Pull failed", false);
      setPulling(false);
    }
  };

  const handleUninstall = async (modelName) => {
    setDeleting(modelName);
    await authFetch(`${API}/settings/ollama/delete`, { method:"DELETE", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:modelName}) }).catch(()=>{});
    if (activeModel === modelName) onModelChange("");
    loadStatus();
    setDeleting("");
    showToast(`🗑 ${modelName} removed — RAM freed`, true);
  };

  const ram = sysStatus?.ram;
  const installed = sysStatus?.installed || [];
  const loadedModel = sysStatus?.loaded_model;
  const ramColor = !ram ? C.teal : ram.percent > 85 ? "#ef4444" : ram.percent > 65 ? "#f59e0b" : "#0d9488";

  return (
    <div style={{ padding:20 }}>

      {/* Toast notification */}
      {toast && (
        <div style={{ position:"fixed", top:24, right:24, zIndex:9999, padding:"12px 20px", borderRadius:10, background:toast.ok?"#0d9488":"#ef4444", color:"#fff", fontSize:13, fontWeight:600, boxShadow:"0 4px 20px rgba(0,0,0,0.2)", animation:"fadeIn 0.2s ease" }}>
          {toast.msg}
        </div>
      )}

      {/* RAM Status Bar */}
      <div style={{ marginBottom:20, background:C.bg, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <span style={{ fontSize:12, fontWeight:700, color:C.text }}>System RAM</span>
          {ram
            ? <span style={{ fontSize:12, fontWeight:700, color:ramColor }}>{ram.used_gb} GB used / {ram.total_gb} GB total ({ram.percent}%)</span>
            : <span style={{ fontSize:12, color:C.muted }}>Loading...</span>}
        </div>
        <div style={{ height:10, background:"#e2e8f0", borderRadius:6, overflow:"hidden" }}>
          <div style={{ height:"100%", width:`${ram?.percent||0}%`, background:ramColor, borderRadius:6, transition:"width 0.5s ease" }}/>
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", marginTop:6, fontSize:11, color:C.muted }}>
          <span>Free: {ram?.free_gb||"—"} GB</span>
          {loadedModel && <span style={{ color:"#7c3aed", fontWeight:600 }}>Ollama loaded: {loadedModel}</span>}
        </div>
      </div>

      {/* Currently active model */}
      {installed.length > 0 && (
        <div style={{ marginBottom:20 }}>
          <Label>Installed Models</Label>
          <div style={{ display:"flex", flexDirection:"column", gap:8, marginTop:8 }}>
            {installed.map(m => {
              const isActive = m.name === activeModel || m.name === loadedModel;
              const isDeleting = deleting === m.name;
              return (
                <div key={m.name} style={{ display:"flex", alignItems:"center", gap:10, padding:"12px 14px", background:isActive?C.tealSoft:C.card, border:`1.5px solid ${isActive?C.teal:C.border}`, borderRadius:10 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                      <span style={{ fontSize:13, fontWeight:700, color:C.text, fontFamily:"monospace" }}>{m.name}</span>
                      <span style={{ fontSize:11, color:C.muted }}>{m.size_gb} GB on disk</span>
                      {isActive && <span style={{ fontSize:10, fontWeight:700, background:C.teal, color:"#fff", padding:"2px 8px", borderRadius:10 }}>ACTIVE</span>}
                      {m.name===loadedModel && <span style={{ fontSize:10, fontWeight:700, background:"#7c3aed", color:"#fff", padding:"2px 8px", borderRadius:10 }}>LOADED IN RAM</span>}
                    </div>
                  </div>
                  {!isActive && <button onClick={()=>onModelChange(m.name)} style={{ padding:"5px 12px", borderRadius:6, border:`1px solid ${C.teal}`, background:C.tealSoft, color:C.teal, cursor:"pointer", fontSize:12, fontWeight:600, flexShrink:0 }}>Set Active</button>}
                  <button onClick={()=>handleUninstall(m.name)} disabled={isDeleting}
                    style={{ padding:"5px 12px", borderRadius:6, border:"1px solid #ef4444", background:"#fff0f0", color:"#ef4444", cursor:isDeleting?"not-allowed":"pointer", fontSize:12, fontWeight:600, flexShrink:0 }}>
                    {isDeleting ? "Removing…" : "Uninstall"}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {installed.length === 0 && !pulling && (
        <div style={{ padding:"12px 14px", background:"#fff7ed", border:"1px solid #fed7aa", borderRadius:8, fontSize:12, color:"#92400e", marginBottom:16 }}>
          No models installed. Pull one from the list below.
        </div>
      )}

      {/* Pull progress */}
      {pulling && (
        <div style={{ marginBottom:16, padding:"12px 14px", borderRadius:8, border:`1px solid ${pullPhase==="error"?"#ef4444":pullPhase==="done"?C.teal:"#7c3aed"}`, background:pullPhase==="error"?"#fff0f0":pullPhase==="done"?C.tealSoft:"#f5f3ff" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {pullPhase!=="done" && pullPhase!=="error" && (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{animation:"spin 1s linear infinite",flexShrink:0,color:"#7c3aed"}}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            )}
            <span style={{ fontSize:12, fontWeight:600, color:pullPhase==="error"?"#ef4444":pullPhase==="done"?C.teal:"#7c3aed" }}>{pullMsg}</span>
          </div>
          {pullPhase==="downloading" && <div style={{ marginTop:8, fontSize:11, color:C.muted }}>Do not close this page. RAM will update automatically when download completes.</div>}
        </div>
      )}

      {/* Pull new model input */}
      <Label>Pull New Model</Label>
      <div style={{ display:"flex", gap:8, marginTop:8, marginBottom:16 }}>
        <input value={pullModel} onChange={e=>setPullModel(e.target.value)} placeholder="e.g. qwen2.5:7b" disabled={pulling}
          style={{ flex:1, padding:"9px 12px", border:`1.5px solid ${C.border}`, borderRadius:8, fontSize:13, background:pulling?"#f8fafc":C.bg }} />
        <button onClick={()=>handlePull(pullModel)} disabled={pulling||!pullModel.trim()}
          style={{ padding:"9px 18px", borderRadius:8, background:pulling||!pullModel.trim()?"#94a3b8":"linear-gradient(135deg,#7c3aed,#6d28d9)", color:"#fff", border:"none", cursor:pulling||!pullModel.trim()?"not-allowed":"pointer", fontSize:13, fontWeight:600, whiteSpace:"nowrap" }}>
          {pulling ? "Working…" : "Pull & Activate"}
        </button>
      </div>

      {/* Suggested models */}
      <Label>Suggested Models</Label>
      <div style={{ display:"flex", flexDirection:"column", gap:6, marginTop:8 }}>
        {SUGGESTED_MODELS.map(m => {
          const isInstalled = installed.some(i=>i.name===m.name);
          return (
            <div key={m.name} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:isInstalled?C.tealSoft:C.bg, border:`1px solid ${isInstalled?C.teal:C.border}`, borderRadius:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontSize:12, fontWeight:700, color:C.text, fontFamily:"monospace" }}>{m.name}</span>
                  <span style={{ fontSize:11, color:C.muted }}>{m.ram}</span>
                  {isInstalled && <span style={{ fontSize:10, fontWeight:700, background:C.teal, color:"#fff", padding:"2px 6px", borderRadius:8 }}>Installed</span>}
                </div>
                <div style={{ fontSize:11, color:C.muted, marginTop:2 }}>{m.note}</div>
              </div>
              <button onClick={()=>handlePull(m.name)} disabled={pulling||isInstalled}
                style={{ padding:"5px 14px", borderRadius:6, background:isInstalled?"#e2e8f0":pulling?"#94a3b8":"linear-gradient(135deg,#7c3aed,#6d28d9)", color:isInstalled?C.muted:"#fff", border:"none", cursor:pulling||isInstalled?"not-allowed":"pointer", fontSize:12, fontWeight:600, flexShrink:0 }}>
                {isInstalled ? "Installed" : "Pull"}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}
