<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
// Empty string = relative URLs; resolves to whatever host serves this page.
// Works in dev (http://127.0.0.1:8000) and production (https://192.168.1.50) without changes.
const API = "";

/* ─── Auth-aware fetch — redirects to / on 401 ──────────── */
const authFetch = async (url, opts = {}) => {
  const token = localStorage.getItem("cms_token") || "";
  const h = { ...(opts.headers || {}) };
  if (token) h["Authorization"] = `Bearer ${token}`;
  const r = await fetch(url, { ...opts, headers: h });
  if (r.status === 401) {
    localStorage.removeItem("cms_token");
    localStorage.removeItem("cms_username");
    localStorage.removeItem("cms_role");
    localStorage.removeItem("cms_user_id");
    localStorage.removeItem("cms_permissions");
    window.location.href = "/";
  }
  return r;
};

/* ─── Permission check — reads cms_permissions from storage ─ */
const can = (perm) => {
  if (!perm) return true;
  try {
    const raw = localStorage.getItem("cms_permissions");
    if (!raw) return true; // fallback: show all until perms load
    return JSON.parse(raw).includes(perm);
  } catch { return true; }
};

/* ─── Design tokens — Kforce Blue Theme ─────────────────── */
const C = {
  bg: "#ffffff", card: "#ffffff",
  sidebar: "#1C3D6B", sidebarHover: "#264D80", sidebarActive: "#1558CB",
  primary: "#1558CB", primarySoft: "#EEF4FF", primaryGrad: "linear-gradient(135deg,#1558CB,#1042A8)",
  teal: "#0d9488", tealSoft: "#f0fdfa", tealGrad: "linear-gradient(135deg,#0d9488,#0f766e)",
  purple: "#7c3aed", purpleSoft: "#f5f3ff", purpleGrad: "linear-gradient(135deg,#7c3aed,#6d28d9)",
  amber: "#d97706", amberSoft: "#fffbeb", amberGrad: "linear-gradient(135deg,#f59e0b,#d97706)",
  blue: "#1558CB", blueSoft: "#EEF4FF", blueGrad: "linear-gradient(135deg,#1558CB,#1042A8)",
  text: "#1A2E4A", textSub: "#4A5568", muted: "#8A95A3",
  border: "#C7D9F8", borderSoft: "#DCE9FB",
  navDark: "#0d1b2e",
};
const font = { head: "'Segoe UI','Inter',sans-serif", body: "'Segoe UI','Inter',sans-serif", mono: "'Courier New',monospace" };

/* ─── API helpers ────────────────────────────────────────── */
const api = {
  get: async (path) => { try { const r = await authFetch(`${API}${path}`); return await r.json(); } catch { return {}; } },
  post: async (path, body) => { try { const r = await authFetch(`${API}${path}`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) }); return await r.json(); } catch(e) { return { success:false, error:e.message }; } },

/* ─── AI Panel Context ──────────────────────────────────── */
const AICtx = React.createContext({ onAIToggle: () => {}, aiOpen: false, onSpotlight: () => {} });

/* ─── AIPanel ───────────────────────────────────────────── */
function AIPanel({ open, width, onWidthChange, onClose, page, candidateId }) {
  const [tab, setTab] = React.useState("context");
  const [messages, setMessages] = React.useState([{ role:"ai", text:"Hi! I'm K Recruit AI. Ask me about candidates, scores, gaps, interview questions, or pipeline status." }]);
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [insights, setInsights] = React.useState(null);
  const [insightsLoading, setInsightsLoading] = React.useState(false);
  const handleRef = React.useRef(null);
  const chatEndRef = React.useRef(null);
  const dragging = React.useRef(false);

  React.useEffect(() => {
    const handle = handleRef.current; if (!handle) return;
    const onDown = (e) => { dragging.current=true; handle.classList.add("dragging"); document.body.style.cursor="col-resize"; document.body.style.userSelect="none"; e.preventDefault(); };
    const onMove = (e) => { if (!dragging.current) return; const w=Math.min(Math.max(window.innerWidth-e.clientX,260),660); onWidthChange(w); };
    const onUp   = () => { if (!dragging.current) return; dragging.current=false; handle.classList.remove("dragging"); document.body.style.cursor=""; document.body.style.userSelect=""; };
    handle.addEventListener("mousedown",onDown); window.addEventListener("mousemove",onMove); window.addEventListener("mouseup",onUp);
    return () => { handle.removeEventListener("mousedown",onDown); window.removeEventListener("mousemove",onMove); window.removeEventListener("mouseup",onUp); };
  }, [onWidthChange]);

  React.useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior:"smooth" }); }, [messages]);

  React.useEffect(() => {
    if (!open || tab !== "context") return;
    setInsightsLoading(true); setInsights(null);
    const ctx = { page }; if (candidateId) ctx.candidate_id = candidateId;
    const msg = `Give me 3 short AI insights for a recruiter on the "${page}" page${candidateId ? ` viewing candidate ${candidateId}` : ""}. Format as a JSON array: [{"type":"info|warn|good","title":"...","body":"...","action":"..."}]. Return only the JSON array, no markdown.`;
    authFetch(`${API}/bot/chat`,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ message:msg, context:ctx }) })
      .then(r=>r.json()).then(d=>{
        try { const m=(d.reply||"").match(/\[[\s\S]*\]/); setInsights(m?JSON.parse(m[0]):[{type:"info",title:"AI Summary",body:(d.reply||"").slice(0,160),action:"Ask me more in Chat"}]); }
        catch(ex) { setInsights([{type:"info",title:"AI Ready",body:(d.reply||"").slice(0,160)||"Context loaded.",action:"Switch to Chat for questions"}]); }
        setInsightsLoading(false);
      }).catch(()=>{ setInsights([{type:"warn",title:"AI Offline",body:"Configure your AI provider in Settings to enable insights.",action:"Open Settings"}]); setInsightsLoading(false); });
  }, [open, tab, page, candidateId]);

  const sendMsg = async (textOverride) => {
    const msg=(textOverride||input).trim(); if (!msg||loading) return;
    setInput(""); setTab("chat");
    setMessages(m=>[...m,{role:"user",text:msg}]); setLoading(true);
    try {
      const ctx={page}; if(candidateId) ctx.candidate_id=candidateId;
      const r=await authFetch(`${API}/bot/chat`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,context:ctx})});
      const d=await r.json(); setMessages(m=>[...m,{role:"ai",text:d.reply||"No response received."}]);
    } catch(ex) { setMessages(m=>[...m,{role:"ai",text:"Could not reach AI. Check Settings → AI Configuration."}]); }
    setLoading(false);
  };

  const icol = { info:["#EEF4FF","#C7D9F8","#1558CB"], warn:["#fffbeb","#fde68a","#d97706"], good:["#f0fdfa","#99f6e4","#0d9488"] };
  const pageActions = {
    dashboard:[{icon:"chart",label:"Pipeline summary",desc:"AI overview",msg:"Give me a concise pipeline summary"},{icon:"star",label:"Top candidates",desc:"Highest scoring",msg:"Who are the top 5 candidates by score?"},{icon:"alert",label:"Low score alerts",desc:"Needs attention",msg:"Which candidates have low scores?"}],
    listing:  [{icon:"filter",label:"Filter advice",desc:"Best to shortlist",msg:"Which candidates should I shortlist?"},{icon:"trend",label:"Score distribution",desc:"Explain spread",msg:"Explain the score distribution"}],
    review:   [{icon:"bulb",label:"Explain score",desc:"Why this score",msg:"Explain why this candidate scored this way"},{icon:"quest",label:"Interview questions",desc:"Based on gaps",msg:"Generate interview questions based on this candidate's gaps"},{icon:"action",label:"Next action",desc:"What to do next",msg:"What is the best next action for this candidate?"}],
    pipeline: [{icon:"clock",label:"Pending review",desc:"Who needs analysis",msg:"Which pending candidates should I analyze first?"},{icon:"check",label:"Approval ready",desc:"Who to approve",msg:"Which candidates are ready for approval?"}],
  };
  const actions = pageActions[page] || pageActions.dashboard;

/* ─── Spotlight ─────────────────────────────────────────── */
function Spotlight({ open, onClose, setPage, setSelectedId, candidates }) {
  const [query, setQuery] = React.useState("");
  const inputRef = React.useRef(null);
  React.useEffect(() => { if (open) { setQuery(""); setTimeout(()=>inputRef.current&&inputRef.current.focus(),30); } }, [open]);
  React.useEffect(() => { const h=(e)=>{if(e.key==="Escape")onClose();}; window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h); }, [onClose]);

  const navPages = [
    {id:"dashboard",label:"Dashboard",sub:"Overview of all activity"},
    {id:"jdmanager",label:"JD Manager",sub:"Manage job descriptions"},
    {id:"upload",label:"Upload Resume",sub:"Add new candidate"},
    {id:"listing",label:"Candidate List",sub:"Browse all candidates"},
    {id:"pipeline",label:"Pipeline Status",sub:"View pipeline health"},
    {id:"settings",label:"Settings",sub:"AI & account configuration"},
  ];
  const q=query.toLowerCase();
  const filteredNav=q?navPages.filter(p=>p.label.toLowerCase().includes(q)||p.sub.toLowerCase().includes(q)):navPages;
  const filteredCands=q&&candidates?candidates.filter(c=>c.name&&c.name.toLowerCase().includes(q)).slice(0,5):[];
  const scoreColor=(s)=>s>=80?"#0d9488":s>=60?"#d97706":"#B91C1C";

  return (
    <div className={`spotlight-overlay${open?" open":""}`} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="spotlight-box">
        <div className="sl-head">
          <span style={{color:"#8A95A3",display:"flex"}}>{BOT_ICONS.search}</span>
          <input ref={inputRef} className="sl-input" placeholder="Search pages, candidates…" value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Escape"&&onClose()} />
          <div className="sl-kbd"><span className="kbd">Esc</span></div>
        </div>
        <div className="sl-results">
          {filteredNav.length>0&&<>{<div className="sl-group">Navigate</div>}{filteredNav.map(p=>(
            <div key={p.id} className="sl-item" onClick={()=>{setPage(p.id);onClose();}}>
              <div className="sl-icon" style={{color:"#1558CB"}}>{NAV_ICONS[p.id]}</div>
              <div><div className="sl-title">{p.label}</div><div className="sl-sub">{p.sub}</div></div>
              <div className="sl-right"><div className="sl-kbd"><span className="kbd">↵</span></div></div>
            </div>
          ))}</>}
          {filteredCands.length>0&&<>{<div className="sl-group">Candidates</div>}{filteredCands.map(c=>(
            <div key={c.id} className="sl-item" onClick={()=>{setSelectedId(c.id);setPage("review");onClose();}}>
              <div className="sl-icon" style={{background:"#EEF4FF",border:"1px solid #C7D9F8",color:"#1558CB"}}>{BOT_ICONS.person}</div>
              <div><div className="sl-title">{c.name}</div><div className="sl-sub">{c.role||"No role"} · {c.status}</div></div>
              <div className="sl-right">{c.score!=null&&<span className="sl-score" style={{color:scoreColor(c.score)}}>{c.score}%</span>}<div className="sl-kbd"><span className="kbd">↵</span></div></div>
            </div>
          ))}</>}
          {q&&filteredNav.length===0&&filteredCands.length===0&&<div style={{padding:"20px",textAlign:"center",color:"#8A95A3",fontSize:13}}>No results for "{query}"</div>}
        </div>
        <div className="sl-footer">
          <div className="sl-hint"><span className="kbd">↵</span> Open</div>
          <div className="sl-hint"><span className="kbd">Esc</span> Close</div>
          <div style={{marginLeft:"auto"}}><span className="sl-hint"><span className="kbd">Ctrl</span><span className="kbd">K</span> toggle</span></div>
        </div>
      </div>
    </div>
  );
}

/* ─── Resume section parser ──────────────────────────────── */
function parseSections(text) {
  if (!text) return [];
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];
  if ((text.match(/━/g)||[]).length > 10) {
    const nameMap = { "PROFESSIONAL SUMMARY":"Summary","TECHNICAL SKILLS":"Skills","WORK EXPERIENCE":"Work Experience","PROJECT SUMMARY":"Projects","EDUCATION":"Education","CERTIFICATIONS":"Certifications" };
    const parts = text.split(/━{5,}/).map(p=>p.trim()).filter(Boolean);
    const found = {};
    for (let i=0;i<parts.length;i++) { const label=nameMap[parts[i].toUpperCase()]; if (label&&i+1<parts.length) found[label]=parts[i+1]; }
    return ORDER.filter(k=>found[k]).map(k=>({ label:k, content:found[k] }));
  }
  const kwMap = { "summary":"Summary","professional summary":"Summary","objective":"Summary","skills":"Skills","technical skills":"Skills","experience":"Work Experience","work experience":"Work Experience","project":"Projects","education":"Education","certif":"Certifications" };
  const lines = text.split("\n"); let current=null; const buf={};
  for (const line of lines) {
    const s=line.trim(); const lo=s.toLowerCase(); let matched=null;
    for (const [kw,lbl] of Object.entries(kwMap)) { if (lo.startsWith(kw)&&s.length<65) { matched=lbl; break; } }
    if (matched) { current=matched; buf[current]=buf[current]||[]; } else if (current&&s) buf[current].push(s);
  }
  return ORDER.filter(k=>buf[k]?.length).map(k=>({ label:k, content:buf[k].join("\n") }));
}

function PageJDManager({ setPage }) {
  const [jds, setJds] = useState([]);

  const [clientName, setClientName] = useState(""); const [jobTitle, setJobTitle] = useState(""); const [jdText, setJdText] = useState("");
  const [newRecruiter, setNewRecruiter] = useState("");
  const [saving, setSaving] = useState(false); const [savingR, setSavingR] = useState(false);
  const [expanded, setExpanded] = useState(null);
  const load = () => api.getJDs().then(setJds);
  const loadR = () => api.getRecruiters().then(setRecruiters);
  useEffect(() => { load(); loadR(); }, []);
  const createJD = async () => {
    if (!clientName.trim()||!jobTitle.trim()||!jdText.trim()) { alert("Fill all fields."); return; }
    setSaving(true); const res = await api.createJD({ client_name:clientName, job_title:jobTitle, jd_text:jdText }); setSaving(false);
    if (res.id) { setClientName(""); setJobTitle(""); setJdText(""); load(); } else alert("Failed: "+(res.detail||"Error"));
  };
  const deleteJD = async (id) => { if (!window.confirm("Delete this JD?")) return; await api.deleteJD(id); load(); };
  const createRecruiter = async () => {
    if (!newRecruiter.trim()) return; setSavingR(true); await api.createRecruiter(newRecruiter.trim()); setSavingR(false); setNewRecruiter(""); loadR();
  };
  const deleteRecruiter = async (id) => { await api.deleteRecruiter(id); loadR(); };
  return (
    <div className="fade-in">
      <Topbar title="JD Manager" sub="Manage job descriptions and recruiter list" />
      <div className="page-content">
        <div style={{ display:"grid", gridTemplateColumns:"1fr 320px", gap:20 }}>
          <div>
            <SCard style={{ marginBottom:20 }}>
              <SHead>Add New Job Description</SHead>
              <div style={{ padding:20, display:"flex", flexDirection:"column", gap:14 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                  <div><Label>Client / Company Name</Label><Input value={clientName} onChange={e=>setClientName(e.target.value)} placeholder="e.g. JP Morgan" /></div>
                  <div><Label>Job Title</Label><Input value={jobTitle} onChange={e=>setJobTitle(e.target.value)} placeholder="e.g. Java Developer" /></div>
                </div>
                <div><Label>Job Description Text</Label>
                  <textarea value={jdText} onChange={e=>setJdText(e.target.value)} placeholder="Paste full JD here..." rows={5}
                    style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, fontFamily:font.body, resize:"vertical" }} />
                </div>
                <Btn onClick={createJD} disabled={saving}>{saving?"Saving...":"+ Add JD"}</Btn>
              </div>
            </SCard>
            <SCard>
              <SHead>{jds.length} Job Descriptions</SHead>
              {jds.length === 0 && <div className="empty-state" style={{ padding:"36px 20px" }}><div className="empty-state-icon" style={{color:C.primary,display:"flex",justifyContent:"center"}}><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg></div><div style={{ fontSize:13, color:C.muted, marginTop:10 }}>No job descriptions yet. Add one above.</div></div>}
              {jds.map(jd=>(
                <div key={jd.id} style={{ borderBottom:`1px solid ${C.borderSoft}` }}>
                  <div onClick={()=>setExpanded(expanded===jd.id?null:jd.id)} style={{ padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }}
                    onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <div>
                      <div style={{ fontSize:13, fontWeight:600, color:C.text }}>{jd.client_name} — {jd.job_title}</div>
                      <div style={{ fontSize:11, color:C.muted, marginTop:2 }}>ID #{jd.id} · {jd.jd_text?.length||0} chars</div>
                    </div>
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:12, color:C.muted }}>{expanded===jd.id?"▲":"▼"}</span>
                      {can("action:delete_jd") && <button onClick={e=>{e.stopPropagation();deleteJD(jd.id);}} style={{ padding:"4px 12px", background:C.primarySoft, color:C.primary, border:`1px solid ${C.primary}`, borderRadius:6, fontSize:11, fontWeight:600, cursor:"pointer" }}>Delete</button>}
                    </div>
                  </div>
                  {expanded===jd.id && <div style={{ padding:"0 20px 14px", fontSize:12, color:C.textSub, whiteSpace:"pre-wrap", fontFamily:font.mono, background:C.bg, maxHeight:200, overflowY:"auto" }}>{jd.jd_text}</div>}
                </div>
              ))}
            </SCard>
          </div>
          <div>
            <SCard>
              <SHead>Recruiters</SHead>
              <div style={{ padding:16 }}>
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  <Input value={newRecruiter} onChange={e=>setNewRecruiter(e.target.value)} placeholder="Recruiter name" onKeyDown={e=>e.key==="Enter"&&createRecruiter()} />
                  <Btn onClick={createRecruiter} disabled={savingR} small>Add</Btn>
                </div>
                {recruiters.length === 0 && <div style={{ fontSize:12, color:C.muted, textAlign:"center", padding:"12px 0" }}>No recruiters yet.</div>}
                {recruiters.map(r=>(
                  <div key={r.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 12px", background:C.bg, borderRadius:8, marginBottom:6 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}><Avatar name={r.name} size={26}/><span style={{ fontSize:13, fontWeight:500, color:C.text }}>{r.name}</span></div>
                    <button onClick={()=>deleteRecruiter(r.id)} style={{ fontSize:10, padding:"3px 8px", background:C.primarySoft, color:C.primary, border:"none", borderRadius:5, cursor:"pointer" }}>✕</button>
                  </div>
                ))}
              </div>
            </SCard>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── Upload Resume ──────────────────────────────────────── */
function PageUpload({ setPage, setSelectedId }) {
  const [file, setFile] = useState(null); const [jds, setJds] = useState([]); const [recruiters, setRecruiters] = useState([]);

    if (!file) { alert("Please select a PDF resume."); return; }

                {k:"Email",v:result.extracted?.email,icon:(<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>)},
                {k:"Mobile",v:result.extracted?.mobile,icon:(<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>)},
                {k:"Location",v:result.extracted?.location,icon:(<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>)},
              ].map(({k,v,icon})=>(

                  <div style={{ display:"flex", justifyContent:"center", marginBottom:10, color:file?C.teal:C.muted }}><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="12" x2="12" y2="18"/><line x1="9" y1="15" x2="15" y2="15"/></svg></div>
                  <div style={{ fontSize:13, color:file?C.teal:C.muted, fontWeight:file?600:400 }}>{file?"PDF selected":"Click to upload PDF"}</div>

                        <option value="">-- Select JD --</option>
                        {jds.map(jd=><option key={jd.id} value={jd.id}>{jd.client_name} — {jd.job_title}</option>)}
                      </select>
                    </div>
                    {selectedJDObj && <div style={{ background:C.bg, borderRadius:8, padding:"10px 12px", fontSize:11, color:C.textSub, fontFamily:font.mono, maxHeight:80, overflowY:"auto" }}>{selectedJDObj.jd_text?.slice(0,250)}...</div>}

  );
}

/* ─── Candidate List ─────────────────────────────────────── */
function PageListing({ setPage, setSelectedId }) {
  const [candidates, setCandidates] = useState([]);
  const [filter, setFilter] = useState("All"); const [search, setSearch] = useState("");
  const [analyzing, setAnalyzing] = useState(null); const [deleting, setDeleting] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [page, setPage2] = useState(0); const PER = 10;
  useEffect(() => { api.getCandidates().then(setCandidates); }, []);

  // Poll candidates every 3s if any are "Processing" — auto-updates when Ollama finishes
  useEffect(() => {
    const hasProcessing = candidates.some(c => c.status === "Processing");
    if (!hasProcessing) return;
    const timer = setInterval(() => {
      api.getCandidates().then(updated => {
        setCandidates(updated);
        if (!updated.some(c => c.status === "Processing")) clearInterval(timer);
      });
    }, 3000);
    return () => clearInterval(timer);
  }, [candidates]);

  const statuses = ["All","Uploaded","Pending Review","Bot Analyzed","Approved","Processing"];
  const filtered = candidates.filter(c => {
    const ms = filter==="All" || c.status===filter;
    const mq = !search || (c.name||"").toLowerCase().includes(search.toLowerCase()) || (c.role||"").toLowerCase().includes(search.toLowerCase());
    return ms && mq;
  });
  const paged = filtered.slice(page*PER, (page+1)*PER);
  const runAnalysis = async (id, e) => {
    e.stopPropagation();
    setAnalyzing(id);
    const res = await api.analyze(id);
    setAnalyzing(null);
    if (res.success) {
      // Update this candidate to "Processing" locally so spinner shows immediately
      setCandidates(prev => prev.map(c => c.id === id ? {...c, status:"Processing"} : c));
    } else {
      alert("Analysis failed: " + (res.detail || res.error || "Error"));
    }
  };
  const deleteCandidate = async (id, name, e) => {
    e.stopPropagation();
    if (!window.confirm(`Delete "${name}"? This cannot be undone.`)) return;
    setDeleting(id);
    const res = await api.del(`/candidates/${id}`); setDeleting(null);
    if (res.success || res.message) { api.getCandidates().then(setCandidates); }
    else alert("Delete failed: "+(res.error||"Unknown error"));
  };
  return (
    <div className="fade-in">
      <Topbar title="Candidate List" sub={`${candidates.length} total candidates`} action={<Btn icon="↑" onClick={()=>setPage("upload")}>Upload Resume</Btn>} />
      <div className="page-content">
        <SCard>
          <div className="filter-bar" style={{ margin:"14px 16px 0", borderBottom:"none", marginBottom:0 }}>
            <div style={{ flex:1, minWidth:200, position:"relative" }}>
              <span style={{ position:"absolute", left:10, top:"50%", transform:"translateY(-50%)", display:"flex", color:C.muted }}>{BOT_ICONS.search}</span>
              <input value={search} onChange={e=>{setSearch(e.target.value);setPage2(0);}} placeholder="Search name or role..."
                style={{ width:"100%", padding:"8px 12px 8px 30px", border:`1px solid #C8D4E8`, borderRadius:8, fontSize:13, background:"#fff" }} />
            </div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {statuses.map(s=>{
                const sc={All:{c:C.primary,bg:"#EEF4FF",dot:C.primary},Uploaded:{c:"#0369a1",bg:"#e0f2fe",dot:"#0ea5e9"},"Pending Review":{c:"#78350f",bg:"#fef3c7",dot:"#d97706"},"Bot Analyzed":{c:"#5b21b6",bg:"#ede9fe",dot:"#7c3aed"},Approved:{c:"#065F59",bg:"rgba(13,148,136,0.10)",dot:"#0d9488"},Processing:{c:"#92400e",bg:"#fef9c3",dot:"#f59e0b"}}[s]||{c:C.primary,bg:C.primarySoft,dot:C.primary};
                const on=filter===s;
                return (
                  <button key={s} onClick={()=>{setFilter(s);setPage2(0);}} style={{ display:"inline-flex",alignItems:"center",gap:5,padding:"5px 13px",borderRadius:20,border:`1px solid ${on?sc.dot+"99":"#C8D4E8"}`,background:on?sc.bg:"#fff",color:on?sc.c:C.textSub,fontSize:12,fontWeight:on?700:400,cursor:"pointer",boxShadow:on?`0 0 0 2px ${sc.dot}22`:"0 1px 2px rgba(0,0,0,0.04)",transition:"all 0.15s" }}>
                    {s!=="All"&&<span style={{width:6,height:6,borderRadius:"50%",background:on?sc.dot:"#CBD5E1",flexShrink:0,display:"inline-block"}}/>}{s}
                  </button>
                );
              })}
            </div>
          </div>
          <div style={{ height:1, background:C.borderSoft, margin:"10px 0 0" }} />
          <div style={{ padding:"12px 14px" }}>
            {paged.map((c,i)=>(
              <div key={c.id} className="scard" style={{ border:`1px solid ${expanded===c.id?C.primary+"55":C.border}`, borderRadius:11, marginBottom:8, overflow:"hidden", background:C.card, boxShadow:expanded===c.id?"0 2px 12px rgba(21,88,203,0.12)":"0 1px 4px rgba(21,88,203,0.06)" }}>
                {/* Summary row */}
                <div style={{ display:"flex", alignItems:"center", gap:12, padding:"13px 16px", cursor:"pointer" }}
                     onClick={()=>setExpanded(expanded===c.id?null:c.id)}>
                  <span style={{ width:22, fontSize:11, color:C.muted, fontWeight:700, flexShrink:0, textAlign:"right" }}>{String(page*PER+i+1).padStart(2,"0")}</span>
                  <Avatar name={c.name||"?"} size={38}/>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:7, flexWrap:"wrap" }}>
                      <span style={{ fontSize:13.5, fontWeight:700, color:C.text, letterSpacing:"-0.01em" }}>{c.name||"Unknown"}</span>
                      {c.role&&<span style={{ fontSize:11, background:C.primarySoft, color:C.primary, fontWeight:600, padding:"2px 8px", borderRadius:10 }}>{c.role}</span>}
                      <StatusBadge status={c.status}/>
                    </div>
                    <div style={{ fontSize:11, color:C.muted, marginTop:3, display:"flex", gap:8, flexWrap:"wrap" }}>
                      {c.company_name&&<span>{c.company_name}</span>}
                      {c.recruiter_name&&<span>· {c.recruiter_name}</span>}
                      {c.match_level&&<span style={{color:C.textSub,fontWeight:500}}>· {c.match_level} match</span>}
                    </div>
                  </div>
                  <ScorePill score={c.score}/>
                  {can("action:analyze_candidate") && (() => {
                    const isProcessing = c.status === "Processing" || analyzing === c.id;
                    return (
                      <button onClick={e=>runAnalysis(c.id,e)} disabled={isProcessing}
                        style={{ padding:"5px 12px", background:isProcessing?"#fef9c3":"#ede9fe", color:isProcessing?"#92400e":"#5b21b6", border:`1px solid ${isProcessing?"#f59e0b44":"#7c3aed44"}`, borderRadius:7, fontSize:11, fontWeight:600, cursor:isProcessing?"not-allowed":"pointer", whiteSpace:"nowrap", flexShrink:0 }}>
                        {isProcessing
                          ? <span style={{display:"flex",alignItems:"center",gap:4}}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{animation:"spin 1s linear infinite"}}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Processing…</span>
                          : "▶ Analyse"}
                      </button>
                    );
                  })()}
                  <span style={{ fontSize:16, color:C.muted, flexShrink:0, marginLeft:2, userSelect:"none" }}>{expanded===c.id?"▲":"▼"}</span>
                </div>
                {/* Expanded detail */}
                {expanded===c.id&&(
                  <div style={{ borderTop:`1px solid ${C.borderSoft}`, padding:"14px 16px", background:"#F8FAFD" }}>
                    <div style={{ display:"flex", gap:8, marginBottom:(c.strengths?.length>0||c.gaps?.length>0)?12:0, flexWrap:"wrap" }}>
                      <Btn onClick={()=>{if(setSelectedId)setSelectedId(c.id);setPage("review");}} small>Review Resume →</Btn>
                      {can("action:delete_candidate") && <button onClick={e=>deleteCandidate(c.id,c.name||"this candidate",e)} disabled={deleting===c.id}
                        style={{ padding:"5px 13px", background:"#FFF1F2", color:"#9B1C1C", border:"1px solid #9B1C1C33", borderRadius:7, fontSize:11, fontWeight:600, cursor:"pointer", opacity:deleting===c.id?0.5:1 }}>
                        {deleting===c.id?"Deleting...":"Delete"}
                      </button>}
                    </div>
                    {(c.strengths?.length>0||c.gaps?.length>0)&&(
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                        {c.strengths?.length>0&&(
                          <div style={{ background:C.primarySoft, border:`1px solid ${C.primary}22`, borderRadius:9, padding:"10px 12px" }}>
                            <div style={{ fontSize:11, fontWeight:700, color:C.primary, marginBottom:6, textTransform:"uppercase", letterSpacing:"0.07em" }}>Matched Skills ({c.strengths.length})</div>
                            <div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>
                              {c.strengths.slice(0,7).map((s,j)=><span key={j} style={{ background:`${C.primary}12`, color:C.primary, border:`1px solid ${C.primary}22`, borderRadius:10, padding:"1px 7px", fontSize:11 }}>{s.replace("Has: ","")}</span>)}
                              {c.strengths.length>7&&<span style={{fontSize:11,color:C.muted,alignSelf:"center"}}>+{c.strengths.length-7} more</span>}
                            </div>
                          </div>
                        )}
                        {c.gaps?.length>0&&(
                          <div style={{ background:"#FFF1F2", border:"1px solid #9B1C1C22", borderRadius:9, padding:"10px 12px" }}>
                            <div style={{ fontSize:11, fontWeight:700, color:"#9B1C1C", marginBottom:6, textTransform:"uppercase", letterSpacing:"0.07em" }}>Gaps ({c.gaps.length})</div>
                            <div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>
                              {c.gaps.slice(0,7).map((g,j)=><span key={j} style={{ background:"#FFE4E6", color:"#9B1C1C", border:"1px solid #9B1C1C22", borderRadius:10, padding:"1px 7px", fontSize:11 }}>{g.replace(/\[.*?\] /,"")}</span>)}
                              {c.gaps.length>7&&<span style={{fontSize:11,color:C.muted,alignSelf:"center"}}>+{c.gaps.length-7} more</span>}
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            ))}
            {filtered.length===0&&<div className="empty-state"><div className="empty-state-icon" style={{color:C.muted,display:"flex",justifyContent:"center"}}><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div className="empty-state-title">No candidates match</div><div className="empty-state-sub">Try adjusting your filter or search term</div></div>}
          </div>
          <div style={{ padding:"12px 20px", borderTop:`1px solid ${C.borderSoft}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <span style={{ fontSize:12, color:C.muted }}>
              {filtered.length===0?"No results":`Showing ${page*PER+1}–${Math.min((page+1)*PER,filtered.length)} of ${filtered.length}`}
            </span>
            <div style={{ display:"flex", gap:3, alignItems:"center" }}>
              <button onClick={()=>setPage2(p=>Math.max(0,p-1))} disabled={page===0} className="page-num-btn" style={{ padding:"5px 12px", color:page===0?C.muted:C.text, cursor:page===0?"default":"pointer" }}>← Prev</button>
              {Array.from({length:Math.min(Math.ceil(filtered.length/PER),7)},(_,i)=>(
                <button key={i} onClick={()=>setPage2(i)} className={`page-num-btn${page===i?" active":""}`}>{i+1}</button>
              ))}
              <button onClick={()=>setPage2(p=>p+1)} disabled={(page+1)*PER>=filtered.length} className="page-num-btn" style={{ padding:"5px 12px", color:(page+1)*PER>=filtered.length?C.muted:C.text, cursor:(page+1)*PER>=filtered.length?"default":"pointer" }}>Next →</button>
            </div>
          </div>
        </SCard>
      </div>
    </div>
  );
}

/* ─── Review Resume ──────────────────────────────────────── */
function PageReview({ setPage, selectedId, startAI, stopAI }) {
  const [candidates, setCandidates] = useState([]); const [candidate, setCandidate] = useState(null);
  const [tab, setTab] = useState("diff"); const [editText, setEditText] = useState("");
  const [manualText, setManualText] = useState("");
  const [analyzing, setAnalyzing] = useState(false); const [saving, setSaving] = useState(false); const [savingManual, setSavingManual] = useState(false);
  const [botOpen, setBotOpen] = useState(false);
  const [adminContact, setAdminContact] = useState("");
  useEffect(() => {
    api.getCandidates().then(list => {
      setCandidates(list);
      if (list.length > 0) {
        const id = selectedId || list[0].id;
        loadCandidate(id, list);
      }
    });
    api.getSettings().then(r => { if (r.success && r.data) setAdminContact(r.data.admin_contact_email || ""); });
  }, []);
  const loadCandidate = async (id, list) => {
    const c = await api.getCandidate(id);
    if (!c) {
      // stale selectedId (candidate belongs to another recruiter) — fall back to first in list
      const fallback = list && list.length > 0 ? await api.getCandidate(list[0].id) : null;
      setCandidate(fallback || null);
      setEditText(fallback?.improved_resume_text || fallback?.original_resume_text || "");
      setManualText(fallback?.manual_resume_text || "");
      return;
    }
    setCandidate(c);
    setEditText(c.improved_resume_text||c.original_resume_text||"");
    setManualText(c.manual_resume_text||"");
  };
  const runAnalysis = async () => {
    if (!candidate) return;
    setAnalyzing(true);
    startAI && startAI("Queuing analysis for " + (candidate.name||"candidate") + "...");
    const res = await api.analyze(candidate.id);
    if (res.success) {
      setCandidate(prev => ({...prev, status:"Processing"}));
      // Poll until Processing is done
      const poll = setInterval(async () => {
        const updated = await api.getCandidate(candidate.id);
        if (updated && updated.status !== "Processing") {
          clearInterval(poll);
          setAnalyzing(false);
          stopAI && stopAI();
          loadCandidate(candidate.id);
        }
      }, 3000);
    } else {
      setAnalyzing(false);
      stopAI && stopAI();
      alert("Failed: " + (res.detail || res.error));
    }
  };
  const handleApprove = async () => { if (!candidate) return; const res = await api.approve(candidate.id); if (res.success) { loadCandidate(candidate.id); alert("✅ Approved!"); } };
  const handleSave = async () => { if (!candidate) return; setSaving(true); const res = await api.updateResume(candidate.id, editText); setSaving(false); if (res.success) alert("✅ Saved!"); };
  const handleSaveManual = async () => { if (!candidate) return; setSavingManual(true); const res = await api.saveManualResume(candidate.id, manualText); setSavingManual(false); if (res.success) alert("✅ JD Draft saved!"); else alert("Save failed!"); };
  const beforeSecs = parseSections(candidate?.original_resume_text||"");
  const afterSecs  = parseSections(candidate?.improved_resume_text||"");
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];
  const allLabels = [...new Set([...beforeSecs.map(s=>s.label),...afterSecs.map(s=>s.label)])];
  const labels = [...ORDER.filter(l=>allLabels.includes(l)),...allLabels.filter(l=>!ORDER.includes(l))];
  const bMap = Object.fromEntries(beforeSecs.map(s=>[s.label,s.content]));
  const aMap = Object.fromEntries(afterSecs.map(s=>[s.label,s.content]));
  return (
    <div className="fade-in">
      <Topbar title="Review Resume" sub={candidate?`${candidate.name||"Unknown"} · ${candidate.company_name||""}`:"Select a candidate"} />
      <div className="page-content">
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:18 }}>
          <select onChange={e=>loadCandidate(Number(e.target.value))} value={candidate?.id||""} style={{ padding:"9px 14px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.card, color:C.text }}>
            {candidates.map(c=><option key={c.id} value={c.id}>{c.name||"Unknown"} — {c.company_name||"N/A"}</option>)}
          </select>
          {candidates.length === 0 && <span style={{ fontSize:12, color:C.muted }}>No candidates. <span style={{ color:C.primary, cursor:"pointer" }} onClick={()=>setPage("upload")}>Upload one →</span></span>}
        </div>
        {candidate && (
          <>
            <SCard style={{ marginBottom:16 }}>
              <div style={{ height:4, background:"linear-gradient(90deg,#1558CB,#0d9488,#7c3aed)", borderRadius:"0" }} />
              <div style={{ padding:"18px 22px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:16 }}>
                <div style={{ display:"flex", alignItems:"center", gap:16 }}>
                  <Avatar name={candidate.name||"?"} size={50} />
                  <div>
                    <div style={{ fontSize:16, fontWeight:700, color:C.primary, letterSpacing:"-0.01em" }}>{candidate.name||"Unknown"}</div>
                    {candidate.role && (
                      <div style={{ fontSize:12, color:C.teal, fontWeight:600, marginTop:3, display:"flex", alignItems:"center", gap:5 }}>
                        <div style={{ width:6, height:6, borderRadius:"50%", background:C.teal, flexShrink:0 }} />{candidate.role}
                      </div>
                    )}
                    <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:8, alignItems:"center" }}>
                      <span className="score-chip" style={{ background:candidate.score>=75?C.primarySoft:candidate.score>=50?C.amberSoft:"#FFF1F2", color:candidate.score>=75?C.primary:candidate.score>=50?C.amber:"#9B1C1C", border:`1px solid ${candidate.score>=75?C.primary+"33":candidate.score>=50?C.amber+"33":"#9B1C1C33"}` }}>ATS {candidate.score||0}%</span>
                      {candidate.semantic_score!=null && <span className="score-chip" style={{ background:candidate.semantic_score>=70?C.primarySoft:C.amberSoft, color:candidate.semantic_score>=70?C.primary:C.amber, border:`1px solid ${candidate.semantic_score>=70?C.primary+"33":C.amber+"33"}` }}>Sem {candidate.semantic_score}%</span>}
                      {candidate.match_level && <span className="info-badge" style={{ background:"#F1F5F9", color:C.textSub }}>{candidate.match_level}</span>}
                      <StatusBadge status={candidate.status} />

                    <span style={{ display:"flex", animation:analyzing?"spin 1.2s linear infinite":"none" }}>{analyzing?STAT_ICONS.clock:STAT_ICONS.sparkle}</span>
                    {analyzing?"Analyzing...":"Run AI Analysis"}
                  </button>
                  {/* Secondary actions */}
                  {can("action:approve_candidate") && candidate.status !== "Approved" && (
                    <button onClick={handleApprove} style={{ display:"flex", alignItems:"center", gap:7, padding:"9px 18px", borderRadius:9, border:"1.5px solid #0d9488", background:"#F0FDFB", color:"#065F59", fontSize:12, fontWeight:700, cursor:"pointer", transition:"all 0.18s" }}
                      onMouseEnter={e=>{e.currentTarget.style.background="rgba(13,148,136,0.15)";}} onMouseLeave={e=>{e.currentTarget.style.background="#F0FDFB";}}>
                      <span style={{display:"flex"}}>{STAT_ICONS.match}</span>Approve
                    </button>
                  )}
                  {can("action:download_resume") && <button onClick={()=>api.downloadResume(candidate.id)} style={{ display:"flex", alignItems:"center", gap:7, padding:"9px 16px", borderRadius:9, border:"1.5px solid #C8D4E8", background:"#F8FAFD", color:C.textSub, fontSize:12, fontWeight:600, cursor:"pointer", transition:"all 0.15s" }}
                    onMouseEnter={e=>{e.currentTarget.style.background="#EEF4FF";e.currentTarget.style.borderColor="#1558CB";e.currentTarget.style.color="#1558CB";}} onMouseLeave={e=>{e.currentTarget.style.background="#F8FAFD";e.currentTarget.style.borderColor="#C8D4E8";e.currentTarget.style.color=C.textSub;}}>
                    <span style={{display:"flex"}}>{STAT_ICONS.download}</span>Download
                  </button>}
                  <button onClick={()=>setBotOpen(o=>!o)} style={{ display:"flex", alignItems:"center", gap:7, padding:"9px 16px", borderRadius:9, border:`1.5px solid ${botOpen?"#1558CB":"#C8D4E8"}`, background:botOpen?"linear-gradient(135deg,#0d1b2e,#1C3D6B)":"#F8FAFD", color:botOpen?"#5BADFF":C.textSub, fontSize:12, fontWeight:600, cursor:"pointer", transition:"all 0.15s" }}>
                    <span style={{display:"flex"}}>{STAT_ICONS.cpu}</span>{botOpen?"Close Bot":"AI Bot"}
                  </button>
                </div>
              </div>
            </SCard>

            {/* Bot Agent Panel */}
            {botOpen && (
              <div style={{ background:"#0d1b2e", borderRadius:12, padding:"16px 20px", marginBottom:16, border:"1px solid rgba(21,88,203,0.35)" }}>
                <div style={{ fontSize:13, fontWeight:700, color:"#fff", marginBottom:12, display:"flex", alignItems:"center", gap:8 }}><span style={{display:"flex",color:"#5BADFF"}}>{STAT_ICONS.cpu}</span>Bot Agent — Action Plan</div>
                {(candidate.recommendations||[]).length===0 && (
                  <div style={{ color:"rgba(255,255,255,0.45)", fontSize:12 }}>Run ▶ AI Analysis first to generate the action plan.</div>

                {(candidate.recommendations||[]).map((rec,i)=>(

                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                      {rec.priority==="MUST HAVE"&&<span style={{ background:"#9B1C1C", color:"#fff", borderRadius:4, padding:"1px 7px", fontSize:11, fontWeight:700 }}>MUST HAVE</span>}
                      <span style={{ fontSize:12, color:"#93c5fd", fontWeight:700 }}>{rec.section}</span>
                    </div>
                    <div style={{ fontSize:11, color:"#FCA5A5", marginBottom:4, display:"flex", alignItems:"flex-start", gap:5 }}><span style={{display:"flex",flexShrink:0,marginTop:1}}>{STAT_ICONS.gap}</span>{rec.issue}</div>
                    <div style={{ fontSize:11, color:"#7dd3fa", display:"flex", alignItems:"flex-start", gap:5 }}><span style={{display:"flex",flexShrink:0,marginTop:1}}>{STAT_ICONS.match}</span>{rec.fix}</div>

                <div style={{ padding:"14px 18px", display:"flex", flexDirection:"column", gap:10 }}>

                                </div>
                                <div style={{ fontSize:11, color:"#92400e", marginBottom:7 }}>Adds value if present</div>
                                <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                                  {niceToHave.map(({label,ctx},i)=>(

                                      <span style={{ background:`${C.amber}33`, color:"#92400e", border:`1px solid ${C.amber}`, borderRadius:12, padding:"2px 9px", fontSize:11 }}>{label}</span>
                                      {ctx&&<div style={{ fontSize:11, color:"#92400e", marginTop:3, marginLeft:4, fontStyle:"italic", lineHeight:1.5 }}>"{ctx}"</div>}
                                    </div>
                                  ))}
                                </div>
                              </div>

                            {legacyGaps.length>0 && (
                              <div style={{ background:C.primarySoft, border:`1px solid ${C.primary}44`, borderRadius:11, padding:11 }}>
                                <div style={{ fontSize:11, fontWeight:700, color:C.primary, marginBottom:5, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex"}}>{STAT_ICONS.gap}</span>Gaps ({legacyGaps.length})</div>
                                <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
                                  {legacyGaps.map((g,i)=><span key={i} style={{ background:"#fff", color:C.primary, border:`1px solid ${C.primary}44`, borderRadius:12, padding:"2px 9px", fontSize:11 }}>{g}</span>)}
