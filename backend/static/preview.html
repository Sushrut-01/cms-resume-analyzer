<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K Recruit · Premium</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter','Segoe UI',sans-serif; background: #f0f2f5; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.22s ease; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #e63946; outline-offset: -1px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = "http://127.0.0.1:8000";

/* ─── Design tokens ─────────────────────────────────────── */
const C = {
  bg: "#f0f2f5", card: "#ffffff",
  sidebar: "#0f172a", sidebarHover: "#1e293b", sidebarActive: "#1e3a5f",
  primary: "#e63946", primarySoft: "#fff1f2", primaryGrad: "linear-gradient(135deg,#e63946,#c1121f)",
  teal: "#0d9488", tealSoft: "#f0fdfa", tealGrad: "linear-gradient(135deg,#0d9488,#0f766e)",
  purple: "#7c3aed", purpleSoft: "#f5f3ff", purpleGrad: "linear-gradient(135deg,#7c3aed,#6d28d9)",
  amber: "#d97706", amberSoft: "#fffbeb", amberGrad: "linear-gradient(135deg,#f59e0b,#d97706)",
  blue: "#2563eb", blueSoft: "#eff6ff", blueGrad: "linear-gradient(135deg,#3b82f6,#2563eb)",
  text: "#0f172a", textSub: "#475569", muted: "#94a3b8",
  border: "#e2e8f0", borderSoft: "#f1f5f9",
};
const font = { head: "'Georgia',serif", body: "'Inter','Segoe UI',sans-serif", mono: "'JetBrains Mono','Courier New',monospace" };

/* ─── API helpers ────────────────────────────────────────── */
const api = {
  get: async (path) => { try { const r = await fetch(`${API}${path}`); return await r.json(); } catch { return {}; } },
  post: async (path, body) => { try { const r = await fetch(`${API}${path}`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) }); return await r.json(); } catch(e) { return { success:false, error:e.message }; } },
  put: async (path, body) => { try { const r = await fetch(`${API}${path}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) }); return await r.json(); } catch(e) { return { success:false, error:e.message }; } },
  del: async (path) => { try { const r = await fetch(`${API}${path}`, { method:"DELETE" }); return await r.json(); } catch(e) { return { success:false }; } },
  getCandidates: async () => { try { const r = await fetch(`${API}/candidates/`); const d = await r.json(); return d.data || []; } catch { return []; } },
  getCandidate: async (id) => { try { const r = await fetch(`${API}/candidates/${id}`); const d = await r.json(); return d.data || {}; } catch { return {}; } },
  getJDs: async () => { try { const r = await fetch(`${API}/client-requirements`); return await r.json() || []; } catch { return []; } },
  getRecruiters: async () => { try { const r = await fetch(`${API}/recruiters/`); const d = await r.json(); return d.data || []; } catch { return []; } },
  getSettings: async () => { try { const r = await fetch(`${API}/settings/`); return await r.json(); } catch { return { success:false }; } },
  getJDAligned: async () => { try { const r = await fetch(`${API}/candidates/list/jd-aligned`); const d = await r.json(); return d.data || []; } catch { return []; } },
  uploadResume: async (file, jdId, recruiterName) => {
    const form = new FormData(); form.append("file",file); form.append("client_requirement_id",jdId); form.append("recruiter_name",recruiterName||"");
    try { const r = await fetch(`${API}/candidates/upload`,{method:"POST",body:form}); const d = await r.json(); if (!r.ok) return {success:false,error:d?.detail||"Upload failed"}; return d; } catch(e) { return {success:false,error:e.message}; }
  },
  analyze: async (id) => { try { const r = await fetch(`${API}/candidates/${id}/analyze`,{method:"POST"}); return await r.json(); } catch(e) { return {success:false,error:e.message}; } },
  approve: async (id) => { try { const r = await fetch(`${API}/candidates/${id}/approve`,{method:"PUT"}); return await r.json(); } catch(e) { return {success:false}; } },
  updateResume: async (id, text) => { const f=new FormData(); f.append("improved_text",text); try { const r = await fetch(`${API}/candidates/${id}/update`,{method:"PUT",body:f}); return await r.json(); } catch(e) { return {success:false}; } },
  generateJDAligned: async (id) => { try { const r = await fetch(`${API}/candidates/${id}/generate-jd-aligned-resume`,{method:"POST"}); return await r.json(); } catch(e) { return {success:false,error:e.message}; } },
  saveManualResume: async (id, text) => { const f=new FormData(); f.append("manual_text",text); try { const r = await fetch(`${API}/candidates/${id}/manual-resume`,{method:"PUT",body:f}); return await r.json(); } catch(e) { return {success:false}; } },
  downloadResume: (id) => window.open(`${API}/candidates/${id}/download-resume`,"_blank"),
  saveSettings: async (payload) => { try { const r = await fetch(`${API}/settings/`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}); return await r.json(); } catch(e) { return {success:false}; } },
  testConnection: async () => { try { const r = await fetch(`${API}/settings/test`,{method:"POST"}); return await r.json(); } catch(e) { return {success:false,message:e.message}; } },
  createJD: async (p) => { try { const r = await fetch(`${API}/client-requirements`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}); return await r.json(); } catch(e) { return {error:e.message}; } },
  deleteJD: async (id) => { try { const r = await fetch(`${API}/client-requirements/${id}`,{method:"DELETE"}); return await r.json(); } catch(e) { return {success:false}; } },
  createRecruiter: async (name) => { try { const r = await fetch(`${API}/recruiters/`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})}); return await r.json(); } catch(e) { return {success:false}; } },
  deleteRecruiter: async (id) => { try { const r = await fetch(`${API}/recruiters/${id}`,{method:"DELETE"}); return await r.json(); } catch(e) { return {success:false}; } },
  changeCredentials: async (u,p) => { try { const r = await fetch(`${API}/settings/`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login_username:u,login_password:p})}); return await r.json(); } catch(e) { return {success:false}; } },
  ollamaStatus: async () => { try { const r = await fetch(`${API}/candidates/system/ollama-status`); return await r.json(); } catch { return {online:false}; } },
};

/* ─── Shared components ──────────────────────────────────── */
const initials = (name="") => name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase() || "?";
const avatarGrads = ["linear-gradient(135deg,#e63946,#c1121f)","linear-gradient(135deg,#0d9488,#0f766e)","linear-gradient(135deg,#7c3aed,#6d28d9)","linear-gradient(135deg,#2563eb,#1d4ed8)","linear-gradient(135deg,#d97706,#b45309)"];
const Avatar = ({ name="?", size=36 }) => {
  const idx = (name.charCodeAt(0)||0) % avatarGrads.length;
  return <div style={{ width:size, height:size, borderRadius:"50%", background:avatarGrads[idx], display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:size*0.34, fontWeight:700, flexShrink:0, letterSpacing:"-0.02em" }}>{initials(name)}</div>;
};

const statusMap = {
  "Approved":       { bg:"#dcfce7", color:"#166534", dot:"#22c55e" },
  "Bot Analyzed":   { bg:"#ede9fe", color:"#5b21b6", dot:"#7c3aed" },
  "Pending Review": { bg:"#fef9c3", color:"#854d0e", dot:"#eab308" },
  "Uploaded":       { bg:"#e0f2fe", color:"#075985", dot:"#0ea5e9" },
};
const StatusBadge = ({ status }) => {
  const s = statusMap[status] || { bg:"#f1f5f9", color:"#475569", dot:"#94a3b8" };
  return <span style={{ display:"inline-flex", alignItems:"center", gap:5, background:s.bg, color:s.color, fontSize:11, fontWeight:600, padding:"3px 10px", borderRadius:20 }}><span style={{ width:6, height:6, borderRadius:"50%", background:s.dot, flexShrink:0 }}/>{status}</span>;
};

const ScorePill = ({ score }) => {
  score = score || 0;
  const color = score>=85 ? C.teal : score>=70 ? C.amber : C.primary;
  const bg    = score>=85 ? C.tealSoft : score>=70 ? C.amberSoft : C.primarySoft;
  return <span style={{ display:"inline-block", background:bg, color, fontSize:12, fontWeight:700, padding:"3px 12px", borderRadius:20, minWidth:48, textAlign:"center" }}>{score}%</span>;
};

const Btn = ({ children, onClick, variant="primary", small, disabled, icon }) => {
  const s = { primary:{background:C.primaryGrad,color:"#fff",border:"none"}, outline:{background:"transparent",color:C.primary,border:`1.5px solid ${C.primary}`}, ghost:{background:C.borderSoft,color:C.textSub,border:`1px solid ${C.border}`}, success:{background:C.tealGrad,color:"#fff",border:"none"}, warn:{background:C.amberGrad,color:"#fff",border:"none"} }[variant] || {};
  return <button onClick={onClick} disabled={disabled} style={{ ...s, padding:small?"6px 14px":"9px 20px", borderRadius:8, cursor:disabled?"not-allowed":"pointer", fontSize:small?11:13, fontWeight:600, display:"inline-flex", alignItems:"center", gap:6, opacity:disabled?0.5:1 }}>{icon&&<span>{icon}</span>}{children}</button>;
};

const SCard = ({ children, style={} }) => <div style={{ background:C.card, borderRadius:14, border:`1px solid ${C.border}`, boxShadow:"0 1px 3px rgba(0,0,0,0.05)", overflow:"hidden", ...style }}>{children}</div>;
const SHead = ({ children, action }) => <div style={{ padding:"15px 20px", borderBottom:`1px solid ${C.borderSoft}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}><div style={{ fontSize:14, fontWeight:700, color:C.text }}>{children}</div>{action}</div>;

const StatCard = ({ label, value, sub, gradient, icon }) => (
  <div className="fade-in" style={{ background:C.card, borderRadius:14, padding:"20px 22px", flex:1, minWidth:150, boxShadow:"0 1px 3px rgba(0,0,0,0.06)", border:`1px solid ${C.border}`, position:"relative", overflow:"hidden" }}>
    <div style={{ position:"absolute", right:16, top:16, width:42, height:42, borderRadius:10, background:gradient, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, opacity:0.9 }}>{icon}</div>
    <div style={{ fontSize:30, fontWeight:800, color:C.text, letterSpacing:"-0.02em" }}>{value}</div>
    <div style={{ fontSize:13, color:C.textSub, fontWeight:500, marginTop:3 }}>{label}</div>
    {sub && <div style={{ fontSize:11, color:C.muted, marginTop:4 }}>{sub}</div>}
  </div>
);

const Topbar = ({ title, sub, action }) => (
  <div style={{ height:62, background:C.card, borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between", padding:"0 28px", position:"sticky", top:0, zIndex:50 }}>
    <div><div style={{ fontSize:17, fontWeight:700, color:C.text, letterSpacing:"-0.01em" }}>{title}</div>{sub && <div style={{ fontSize:12, color:C.muted, marginTop:1 }}>{sub}</div>}</div>
    {action}
  </div>
);

const Label = ({ children }) => <div style={{ fontSize:11, color:C.muted, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:5 }}>{children}</div>;
const Input = ({ value, onChange, placeholder, type="text", style={} }) => (
  <input type={type} value={value} onChange={onChange} placeholder={placeholder}
    style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, color:C.text, background:C.bg, ...style }} />
);

/* ─── Sidebar ────────────────────────────────────────────── */
const navGroups = [
  { label:"MAIN",    items:[{ id:"dashboard", icon:"▤", label:"Dashboard" }] },
  { label:"RESUMES", items:[{ id:"jdmanager", icon:"📋", label:"JD Manager" },{ id:"upload", icon:"↑", label:"Upload Resume" },{ id:"listing", icon:"≡", label:"Candidate List" },{ id:"review", icon:"⊞", label:"Review Resume" }] },
  { label:"OUTPUT",  items:[{ id:"jdalign", icon:"🎯", label:"JD Alignment" },{ id:"jdalignlist", icon:"📊", label:"Aligned Resumes" },{ id:"pipeline", icon:"⚙", label:"Pipeline Status" }] },
  { label:"SYSTEM",  items:[{ id:"settings", icon:"◎", label:"Settings" }] },
];

function Sidebar({ active, setPage, onLogout, username, aiOnline, aiProvider }) {
  return (
    <div style={{ width:230, background:C.sidebar, display:"flex", flexDirection:"column", height:"100vh", position:"fixed", left:0, top:0, zIndex:100 }}>
      <div style={{ padding:"22px 20px 18px", borderBottom:"1px solid rgba(255,255,255,0.06)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ width:32, height:32, borderRadius:8, background:C.primaryGrad, display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, fontWeight:700, color:"#fff" }}>K</div>
          <div>
            <div style={{ fontSize:15, fontWeight:700, color:"#fff", letterSpacing:"-0.01em" }}><span style={{ color:C.primary }}>K</span> Recruit</div>
            <div style={{ fontSize:9, color:"rgba(255,255,255,0.28)", letterSpacing:"0.14em", textTransform:"uppercase", marginTop:1 }}>HR Management Portal</div>
          </div>
        </div>
      </div>
      <nav style={{ flex:1, padding:"10px 12px", overflowY:"auto" }}>
        {navGroups.map(group => (
          <div key={group.label} style={{ marginBottom:6 }}>
            <div style={{ fontSize:9, color:"rgba(255,255,255,0.22)", letterSpacing:"0.12em", padding:"10px 8px 4px", fontWeight:600 }}>{group.label}</div>
            {group.items.map(item => {
              const isActive = active === item.id;
              return (
                <div key={item.id} onClick={() => setPage(item.id)}
                  style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 12px", borderRadius:8, cursor:"pointer", marginBottom:2, background:isActive ? C.sidebarActive : "transparent", transition:"background 0.15s" }}
                  onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = C.sidebarHover; }}
                  onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = "transparent"; }}>
                  <span style={{ fontSize:14, opacity:isActive?1:0.4, width:18, textAlign:"center" }}>{item.icon}</span>
                  <span style={{ fontSize:13, color:isActive?"#fff":"rgba(255,255,255,0.48)", fontWeight:isActive?600:400 }}>{item.label}</span>
                  {isActive && <div style={{ marginLeft:"auto", width:4, height:4, borderRadius:"50%", background:C.primary }} />}
                </div>
              );
            })}
          </div>
        ))}
      </nav>
      <div style={{ padding:"14px 16px", borderTop:"1px solid rgba(255,255,255,0.06)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:10 }}>
          <div style={{ width:8, height:8, borderRadius:"50%", background:aiOnline?"#22c55e":"#ef4444" }} />
          <span style={{ fontSize:10, color:"rgba(255,255,255,0.35)" }}>{aiOnline ? `${aiProvider||"AI"} Online` : "AI Offline"}</span>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
          <Avatar name={username||"Admin"} size={30} />
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:12, color:"#fff", fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{username||"Admin"}</div>
            <div style={{ fontSize:10, color:"rgba(255,255,255,0.3)" }}>Logged in</div>
          </div>
        </div>
        <button onClick={onLogout} style={{ width:"100%", padding:"7px", background:"rgba(230,57,70,0.12)", border:"1px solid rgba(230,57,70,0.25)", borderRadius:7, color:C.primary, fontSize:11, fontWeight:600, cursor:"pointer" }}>⎋ Sign Out</button>
      </div>
    </div>
  );
}

/* ─── Resume section parser ──────────────────────────────── */
function parseSections(text) {
  if (!text) return [];
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];
  if ((text.match(/━/g)||[]).length > 10) {
    const nameMap = { "PROFESSIONAL SUMMARY":"Summary","TECHNICAL SKILLS":"Skills","WORK EXPERIENCE":"Work Experience","PROJECT SUMMARY":"Projects","EDUCATION":"Education","CERTIFICATIONS":"Certifications" };
    const parts = text.split(/━{5,}/).map(p=>p.trim()).filter(Boolean);
    const found = {};
    for (let i=0;i<parts.length;i++) { const label=nameMap[parts[i].toUpperCase()]; if (label&&i+1<parts.length) found[label]=parts[i+1]; }
    return ORDER.filter(k=>found[k]).map(k=>({ label:k, content:found[k] }));
  }
  const kwMap = { "summary":"Summary","professional summary":"Summary","objective":"Summary","skills":"Skills","technical skills":"Skills","experience":"Work Experience","work experience":"Work Experience","project":"Projects","education":"Education","certif":"Certifications" };
  const lines = text.split("\n"); let current=null; const buf={};
  for (const line of lines) {
    const s=line.trim(); const lo=s.toLowerCase(); let matched=null;
    for (const [kw,lbl] of Object.entries(kwMap)) { if (lo.startsWith(kw)&&s.length<65) { matched=lbl; break; } }
    if (matched) { current=matched; buf[current]=buf[current]||[]; } else if (current&&s) buf[current].push(s);
  }
  return ORDER.filter(k=>buf[k]?.length).map(k=>({ label:k, content:buf[k].join("\n") }));
}

/* ─── Dashboard ──────────────────────────────────────────── */
function PageDashboard({ setPage }) {
  const [candidates, setCandidates] = useState([]);
  useEffect(() => { api.getCandidates().then(setCandidates); }, []);
  const total    = candidates.length;
  const pending  = candidates.filter(c=>c.status==="Pending Review"||c.status==="Uploaded").length;
  const analyzed = candidates.filter(c=>c.status==="Bot Analyzed").length;
  const approved = candidates.filter(c=>c.status==="Approved").length;
  return (
    <div className="fade-in">
      <Topbar title="Dashboard" sub="Overview of all candidate activity" action={<Btn icon="↑" onClick={()=>setPage("upload")}>Upload Resume</Btn>} />
      <div style={{ padding:24 }}>
        <div style={{ display:"flex", gap:14, marginBottom:22 }}>
          <StatCard label="Total Candidates" value={total}    gradient={C.blueGrad}   icon="👥" sub="All time" />
          <StatCard label="Pending Review"   value={pending}  gradient={C.amberGrad}  icon="⏳" sub="Needs attention" />
          <StatCard label="Bot Analyzed"     value={analyzed} gradient={C.purpleGrad} icon="🤖" sub="AI processed" />
          <StatCard label="Approved"         value={approved} gradient={C.tealGrad}   icon="✓"  sub="Ready to submit" />
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 280px", gap:18 }}>
          <SCard>
            <SHead action={<Btn variant="ghost" small onClick={()=>setPage("listing")}>View all →</Btn>}>Recent Candidates</SHead>
            {candidates.length === 0 && <div style={{ padding:32, textAlign:"center", color:C.muted, fontSize:13 }}>No candidates yet. Upload a resume to get started!</div>}
            {candidates.length > 0 && (
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead><tr style={{ background:C.borderSoft }}>
                  {["Candidate","Role","Score","Status"].map(h=><th key={h} style={{ padding:"10px 16px", fontSize:11, fontWeight:600, color:C.muted, textAlign:"left", textTransform:"uppercase", letterSpacing:"0.06em" }}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {candidates.slice(0,6).map(c=>(
                    <tr key={c.id} onClick={()=>setPage("review")} style={{ borderTop:`1px solid ${C.borderSoft}`, cursor:"pointer" }}
                      onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <td style={{ padding:"11px 16px" }}><div style={{ display:"flex", alignItems:"center", gap:10 }}><Avatar name={c.name||"?"} size={32}/><div><div style={{ fontSize:13, fontWeight:600, color:C.text }}>{c.name||"Unknown"}</div><div style={{ fontSize:11, color:C.muted }}>{c.company_name||"N/A"}</div></div></div></td>
                      <td style={{ padding:"11px 16px", fontSize:12, color:C.textSub }}>{c.role||"—"}</td>
                      <td style={{ padding:"11px 16px" }}><ScorePill score={c.score}/></td>
                      <td style={{ padding:"11px 16px" }}><StatusBadge status={c.status}/></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </SCard>
          <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
            <SCard>
              <SHead>Pipeline</SHead>
              <div style={{ padding:"16px 20px" }}>
                {[{label:"Uploaded",count:candidates.filter(c=>c.status==="Uploaded").length,color:"#3b82f6"},{label:"Bot Analyzed",count:analyzed,color:"#7c3aed"},{label:"Approved",count:approved,color:"#0d9488"}].map(s=>(
                  <div key={s.label} style={{ marginBottom:14 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}><span style={{ fontSize:12, color:C.textSub }}>{s.label}</span><span style={{ fontSize:12, fontWeight:700, color:s.color }}>{s.count}</span></div>
                    <div style={{ height:6, background:C.borderSoft, borderRadius:10, overflow:"hidden" }}><div style={{ height:"100%", width:total ? `${Math.round(s.count/total*100)}%` : "0%", background:s.color, borderRadius:10 }}/></div>
                  </div>
                ))}
              </div>
            </SCard>
            <SCard>
              <SHead>Quick Actions</SHead>
              <div style={{ padding:"12px 16px" }}>
                {[{label:"Upload New Resume",icon:"↑",page:"upload"},{label:"JD Manager",icon:"📋",page:"jdmanager"},{label:"Review Resume",icon:"⊞",page:"review"},{label:"JD Alignment",icon:"🎯",page:"jdalign"},{label:"Pipeline Status",icon:"⚙",page:"pipeline"}].map(a=>(
                  <div key={a.label} onClick={()=>setPage(a.page)} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 12px", background:C.bg, borderRadius:8, cursor:"pointer", marginBottom:6 }}
                    onMouseEnter={e=>e.currentTarget.style.background=C.borderSoft} onMouseLeave={e=>e.currentTarget.style.background=C.bg}>
                    <span style={{ fontSize:14 }}>{a.icon}</span><span style={{ fontSize:12, color:C.text, fontWeight:500 }}>{a.label}</span>
                  </div>
                ))}
              </div>
            </SCard>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── JD Manager ─────────────────────────────────────────── */
function PageJDManager({ setPage }) {
  const [jds, setJds] = useState([]);
  const [recruiters, setRecruiters] = useState([]);
  const [clientName, setClientName] = useState(""); const [jobTitle, setJobTitle] = useState(""); const [jdText, setJdText] = useState("");
  const [newRecruiter, setNewRecruiter] = useState("");
  const [saving, setSaving] = useState(false); const [savingR, setSavingR] = useState(false);
  const [expanded, setExpanded] = useState(null);
  const load = () => api.getJDs().then(setJds);
  const loadR = () => api.getRecruiters().then(setRecruiters);
  useEffect(() => { load(); loadR(); }, []);
  const createJD = async () => {
    if (!clientName.trim()||!jobTitle.trim()||!jdText.trim()) { alert("Fill all fields."); return; }
    setSaving(true); const res = await api.createJD({ client_name:clientName, job_title:jobTitle, jd_text:jdText }); setSaving(false);
    if (res.id) { setClientName(""); setJobTitle(""); setJdText(""); load(); } else alert("Failed: "+(res.detail||"Error"));
  };
  const deleteJD = async (id) => { if (!window.confirm("Delete this JD?")) return; await api.deleteJD(id); load(); };
  const createRecruiter = async () => {
    if (!newRecruiter.trim()) return; setSavingR(true); await api.createRecruiter(newRecruiter.trim()); setSavingR(false); setNewRecruiter(""); loadR();
  };
  const deleteRecruiter = async (id) => { await api.deleteRecruiter(id); loadR(); };
  return (
    <div className="fade-in">
      <Topbar title="JD Manager" sub="Manage job descriptions and recruiter list" />
      <div style={{ padding:24 }}>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 320px", gap:20 }}>
          <div>
            <SCard style={{ marginBottom:20 }}>
              <SHead>Add New Job Description</SHead>
              <div style={{ padding:20, display:"flex", flexDirection:"column", gap:14 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                  <div><Label>Client / Company Name</Label><Input value={clientName} onChange={e=>setClientName(e.target.value)} placeholder="e.g. JP Morgan" /></div>
                  <div><Label>Job Title</Label><Input value={jobTitle} onChange={e=>setJobTitle(e.target.value)} placeholder="e.g. Java Developer" /></div>
                </div>
                <div><Label>Job Description Text</Label>
                  <textarea value={jdText} onChange={e=>setJdText(e.target.value)} placeholder="Paste full JD here..." rows={5}
                    style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, fontFamily:font.body, resize:"vertical" }} />
                </div>
                <Btn onClick={createJD} disabled={saving}>{saving?"Saving...":"+ Add JD"}</Btn>
              </div>
            </SCard>
            <SCard>
              <SHead>{jds.length} Job Descriptions</SHead>
              {jds.length === 0 && <div style={{ padding:28, textAlign:"center", color:C.muted, fontSize:13 }}>No JDs yet.</div>}
              {jds.map(jd=>(
                <div key={jd.id} style={{ borderBottom:`1px solid ${C.borderSoft}` }}>
                  <div onClick={()=>setExpanded(expanded===jd.id?null:jd.id)} style={{ padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }}
                    onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <div>
                      <div style={{ fontSize:13, fontWeight:600, color:C.text }}>{jd.client_name} — {jd.job_title}</div>
                      <div style={{ fontSize:11, color:C.muted, marginTop:2 }}>ID #{jd.id} · {jd.jd_text?.length||0} chars</div>
                    </div>
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:12, color:C.muted }}>{expanded===jd.id?"▲":"▼"}</span>
                      <button onClick={e=>{e.stopPropagation();deleteJD(jd.id);}} style={{ padding:"4px 12px", background:C.primarySoft, color:C.primary, border:`1px solid ${C.primary}`, borderRadius:6, fontSize:11, fontWeight:600, cursor:"pointer" }}>Delete</button>
                    </div>
                  </div>
                  {expanded===jd.id && <div style={{ padding:"0 20px 14px", fontSize:12, color:C.textSub, whiteSpace:"pre-wrap", fontFamily:font.mono, background:C.bg, maxHeight:200, overflowY:"auto" }}>{jd.jd_text}</div>}
                </div>
              ))}
            </SCard>
          </div>
          <div>
            <SCard>
              <SHead>Recruiters</SHead>
              <div style={{ padding:16 }}>
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  <Input value={newRecruiter} onChange={e=>setNewRecruiter(e.target.value)} placeholder="Recruiter name" onKeyDown={e=>e.key==="Enter"&&createRecruiter()} />
                  <Btn onClick={createRecruiter} disabled={savingR} small>Add</Btn>
                </div>
                {recruiters.length === 0 && <div style={{ fontSize:12, color:C.muted, textAlign:"center", padding:"12px 0" }}>No recruiters yet.</div>}
                {recruiters.map(r=>(
                  <div key={r.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 12px", background:C.bg, borderRadius:8, marginBottom:6 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}><Avatar name={r.name} size={26}/><span style={{ fontSize:13, fontWeight:500, color:C.text }}>{r.name}</span></div>
                    <button onClick={()=>deleteRecruiter(r.id)} style={{ fontSize:10, padding:"3px 8px", background:C.primarySoft, color:C.primary, border:"none", borderRadius:5, cursor:"pointer" }}>✕</button>
                  </div>
                ))}
              </div>
            </SCard>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── Upload Resume ──────────────────────────────────────── */
function PageUpload({ setPage }) {
  const [file, setFile] = useState(null); const [jds, setJds] = useState([]); const [recruiters, setRecruiters] = useState([]);
  const [selectedJD, setSelectedJD] = useState(""); const [recruiterName, setRecruiterName] = useState("");
  const [loading, setLoading] = useState(false); const [result, setResult] = useState(null);
  useEffect(() => { api.getJDs().then(setJds); api.getRecruiters().then(setRecruiters); }, []);
  const selectedJDObj = jds.find(j=>j.id===Number(selectedJD));
  const handleUpload = async () => {
    if (!file) { alert("Please select a PDF resume."); return; }
    if (!selectedJD) { alert("Please select a Job Description."); return; }
    setLoading(true); const res = await api.uploadResume(file, Number(selectedJD), recruiterName); setLoading(false);
    if (!res.success) { alert("Upload failed: "+(res.error||"Unknown error")); return; }
    setResult(res);
  };
  return (
    <div className="fade-in">
      <Topbar title="Upload Resume" sub="Upload candidate PDF and select a Job Description" />
      <div style={{ padding:24, maxWidth:900 }}>
        {result && result.success && (
          <div style={{ background:C.tealSoft, border:`1px solid ${C.teal}`, borderRadius:12, padding:18, marginBottom:20 }}>
            <div style={{ fontSize:14, fontWeight:700, color:C.teal, marginBottom:8 }}>✅ Resume uploaded successfully!</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10 }}>
              {[["Name",result.extracted?.name],["Email",result.extracted?.email],["Mobile",result.extracted?.mobile],["Location",result.extracted?.location]].map(([k,v])=>(
                <div key={k} style={{ background:C.card, borderRadius:8, padding:"10px 12px" }}>
                  <div style={{ fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:"0.08em" }}>{k}</div>
                  <div style={{ fontSize:13, fontWeight:600, color:v?C.teal:C.muted, marginTop:3 }}>{v||"Not detected"}</div>
                </div>
              ))}
            </div>
            <div style={{ marginTop:14, display:"flex", gap:10 }}>
              <Btn variant="success" onClick={()=>setPage("review")}>Review Resume →</Btn>
              <Btn variant="ghost" onClick={()=>{ setFile(null); setResult(null); }}>Upload Another</Btn>
            </div>
          </div>
        )}
        {!result && (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginBottom:20 }}>
            <SCard>
              <SHead>Candidate Resume (PDF)</SHead>
              <div style={{ padding:20 }}>
                <label style={{ display:"block", border:`2px dashed ${file?C.teal:C.border}`, borderRadius:12, padding:"32px 20px", textAlign:"center", background:file?C.tealSoft:C.bg, cursor:"pointer" }}>
                  <div style={{ fontSize:36, marginBottom:10 }}>📄</div>
                  <div style={{ fontSize:13, color:C.muted }}>Click to upload PDF</div>
                  {file && <div style={{ marginTop:10, color:C.teal, fontSize:12, fontWeight:600 }}>✓ {file.name}</div>}
                  <input type="file" accept=".pdf" style={{ display:"none" }} onChange={e=>setFile(e.target.files[0])} />
                </label>
              </div>
            </SCard>
            <SCard>
              <SHead>Job Description & Recruiter</SHead>
              <div style={{ padding:20, display:"flex", flexDirection:"column", gap:14 }}>
                {jds.length === 0 ? (
                  <div style={{ background:C.amberSoft, border:`1px solid ${C.amber}`, borderRadius:8, padding:14, fontSize:12 }}>
                    No JDs found. <span style={{ color:C.primary, cursor:"pointer", fontWeight:700 }} onClick={()=>setPage("jdmanager")}>Go to JD Manager →</span>
                  </div>
                ) : (
                  <>
                    <div>
                      <Label>Job Description</Label>
                      <select value={selectedJD} onChange={e=>setSelectedJD(e.target.value)} style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }}>
                        <option value="">-- Select JD --</option>
                        {jds.map(jd=><option key={jd.id} value={jd.id}>{jd.client_name} — {jd.job_title}</option>)}
                      </select>
                    </div>
                    {selectedJDObj && <div style={{ background:C.bg, borderRadius:8, padding:"10px 12px", fontSize:11, color:C.textSub, fontFamily:font.mono, maxHeight:80, overflowY:"auto" }}>{selectedJDObj.jd_text?.slice(0,250)}...</div>}
                    <div>
                      <Label>Recruiter</Label>
                      <select value={recruiterName} onChange={e=>setRecruiterName(e.target.value)} style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }}>
                        <option value="">-- Select Recruiter --</option>
                        {recruiters.map(r=><option key={r.id} value={r.name}>{r.name}</option>)}
                      </select>
                    </div>
                  </>
                )}
              </div>
            </SCard>
          </div>
        )}
        {!result && (
          <div style={{ display:"flex", gap:12 }}>
            <Btn onClick={handleUpload} disabled={loading} icon="↑">{loading?"Uploading...":"Upload Resume"}</Btn>

          </div>
        )}
      </div>
    </div>
  );
}

/* ─── Candidate List ─────────────────────────────────────── */
function PageListing({ setPage, setSelectedId }) {
  const [candidates, setCandidates] = useState([]);
  const [filter, setFilter] = useState("All"); const [search, setSearch] = useState("");
  const [analyzing, setAnalyzing] = useState(null);
  const [page, setPage2] = useState(0); const PER = 10;
  useEffect(() => { api.getCandidates().then(setCandidates); }, []);
  const statuses = ["All","Uploaded","Pending Review","Bot Analyzed","Approved"];
  const filtered = candidates.filter(c => {
    const ms = filter==="All" || c.status===filter;
    const mq = !search || (c.name||"").toLowerCase().includes(search.toLowerCase()) || (c.role||"").toLowerCase().includes(search.toLowerCase());
    return ms && mq;
  });
  const paged = filtered.slice(page*PER, (page+1)*PER);
  const runAnalysis = async (id, e) => {
    e.stopPropagation();
    setAnalyzing(id);
    const res = await api.analyze(id); setAnalyzing(null);
    if (res.success) { alert("✅ AI Analysis complete!"); api.getCandidates().then(setCandidates); }
    else alert("Analysis failed: "+(res.detail||res.error||"Error"));
  };
  return (
    <div className="fade-in">
      <Topbar title="Candidate List" sub={`${candidates.length} total candidates`} action={<Btn icon="↑" onClick={()=>setPage("upload")}>Upload Resume</Btn>} />
      <div style={{ padding:24 }}>
        <SCard>
          <div style={{ padding:"14px 20px", borderBottom:`1px solid ${C.borderSoft}`, display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
            <div style={{ flex:1, minWidth:200, position:"relative" }}>
              <span style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", fontSize:13, color:C.muted }}>🔍</span>
              <input value={search} onChange={e=>{setSearch(e.target.value);setPage2(0);}} placeholder="Search name or role..."
                style={{ width:"100%", padding:"8px 12px 8px 32px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }} />
            </div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {statuses.map(s=>(
                <button key={s} onClick={()=>{setFilter(s);setPage2(0);}} style={{ padding:"5px 14px", borderRadius:20, border:`1px solid ${filter===s?C.primary:C.border}`, background:filter===s?C.primarySoft:"transparent", color:filter===s?C.primary:C.textSub, fontSize:12, fontWeight:filter===s?600:400, cursor:"pointer" }}>{s}</button>
              ))}
            </div>
          </div>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead><tr style={{ background:C.borderSoft }}>
              {["#","Candidate","Role","Match","Score","Status","Action"].map(h=><th key={h} style={{ padding:"10px 16px", fontSize:11, fontWeight:600, color:C.muted, textAlign:"left", textTransform:"uppercase", letterSpacing:"0.06em", whiteSpace:"nowrap" }}>{h}</th>)}
            </tr></thead>
            <tbody>
              {paged.map((c,i)=>(
                <tr key={c.id} style={{ borderTop:`1px solid ${C.borderSoft}`, cursor:"pointer" }}
                  onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}
                  onClick={()=>{ if(setSelectedId) setSelectedId(c.id); setPage("review"); }}>
                  <td style={{ padding:"12px 16px", fontSize:12, color:C.muted, fontWeight:600 }}>{String(page*PER+i+1).padStart(2,"0")}</td>
                  <td style={{ padding:"12px 16px" }}><div style={{ display:"flex", alignItems:"center", gap:10 }}><Avatar name={c.name||"?"} size={34}/><div><div style={{ fontSize:13, fontWeight:600, color:C.text }}>{c.name||"Unknown"}</div><div style={{ fontSize:11, color:C.muted }}>{c.company_name||"N/A"} {c.recruiter_name?`· ${c.recruiter_name}`:""}</div></div></div></td>
                  <td style={{ padding:"12px 16px" }}><span style={{ fontSize:12, background:C.tealSoft, color:C.teal, fontWeight:600, padding:"3px 10px", borderRadius:6 }}>{c.role||"—"}</span></td>
                  <td style={{ padding:"12px 16px" }}><span style={{ fontSize:12, color:C.textSub }}>{c.match_level||"—"}</span></td>
                  <td style={{ padding:"12px 16px" }}><ScorePill score={c.score}/></td>
                  <td style={{ padding:"12px 16px" }}><StatusBadge status={c.status}/></td>
                  <td style={{ padding:"12px 16px" }}>
                    <button onClick={e=>runAnalysis(c.id,e)} disabled={analyzing===c.id}
                      style={{ padding:"5px 12px", background:C.primarySoft, color:C.primary, border:`1px solid ${C.primary}`, borderRadius:6, fontSize:11, fontWeight:600, cursor:"pointer", opacity:analyzing===c.id?0.5:1 }}>
                      {analyzing===c.id?"⏳":"▶ Analyze"}
                    </button>
                  </td>
                </tr>
              ))}
              {filtered.length === 0 && <tr><td colSpan={7} style={{ padding:"32px 20px", textAlign:"center", color:C.muted, fontSize:13 }}>No candidates match.</td></tr>}
            </tbody>
          </table>
          <div style={{ padding:"12px 20px", borderTop:`1px solid ${C.borderSoft}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <span style={{ fontSize:12, color:C.muted }}>Showing {page*PER+1}–{Math.min((page+1)*PER,filtered.length)} of {filtered.length}</span>
            <div style={{ display:"flex", gap:4 }}>
              <button onClick={()=>setPage2(p=>Math.max(0,p-1))} disabled={page===0} style={{ padding:"5px 12px", borderRadius:6, border:`1px solid ${C.border}`, background:"transparent", color:page===0?C.muted:C.text, cursor:page===0?"default":"pointer", fontSize:12 }}>← Prev</button>
              <button onClick={()=>setPage2(p=>p+1)} disabled={(page+1)*PER>=filtered.length} style={{ padding:"5px 12px", borderRadius:6, border:`1px solid ${C.border}`, background:"transparent", color:(page+1)*PER>=filtered.length?C.muted:C.text, cursor:(page+1)*PER>=filtered.length?"default":"pointer", fontSize:12 }}>Next →</button>
            </div>
          </div>
        </SCard>
      </div>
    </div>
  );
}

/* ─── Review Resume ──────────────────────────────────────── */
function PageReview({ setPage, selectedId }) {
  const [candidates, setCandidates] = useState([]); const [candidate, setCandidate] = useState(null);
  const [tab, setTab] = useState("diff"); const [editText, setEditText] = useState("");
  const [analyzing, setAnalyzing] = useState(false); const [saving, setSaving] = useState(false);
  useEffect(() => { api.getCandidates().then(list => { setCandidates(list); if (list.length > 0) { const id = selectedId || list[0].id; loadCandidate(id); } }); }, []);
  const loadCandidate = async (id) => { const c = await api.getCandidate(id); setCandidate(c); setEditText(c.improved_resume_text||c.original_resume_text||""); };
  const runAnalysis = async () => {
    if (!candidate) return; setAnalyzing(true);
    const res = await api.analyze(candidate.id); setAnalyzing(false);
    if (res.success) { loadCandidate(candidate.id); alert("✅ Analysis complete!"); }
    else alert("Failed: "+(res.detail||res.error));
  };
  const handleApprove = async () => { if (!candidate) return; const res = await api.approve(candidate.id); if (res.success) { loadCandidate(candidate.id); alert("✅ Approved!"); } };
  const handleSave = async () => { if (!candidate) return; setSaving(true); const res = await api.updateResume(candidate.id, editText); setSaving(false); if (res.success) alert("✅ Saved!"); };
  const beforeSecs = parseSections(candidate?.original_resume_text||"");
  const afterSecs  = parseSections(candidate?.improved_resume_text||"");
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];
  const allLabels = [...new Set([...beforeSecs.map(s=>s.label),...afterSecs.map(s=>s.label)])];
  const labels = [...ORDER.filter(l=>allLabels.includes(l)),...allLabels.filter(l=>!ORDER.includes(l))];
  const bMap = Object.fromEntries(beforeSecs.map(s=>[s.label,s.content]));
  const aMap = Object.fromEntries(afterSecs.map(s=>[s.label,s.content]));
  return (
    <div className="fade-in">
      <Topbar title="Review Resume" sub={candidate?`${candidate.name||"Unknown"} · ${candidate.company_name||""}`:"Select a candidate"} />
      <div style={{ padding:24 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:18 }}>
          <select onChange={e=>loadCandidate(Number(e.target.value))} value={candidate?.id||""} style={{ padding:"9px 14px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.card, color:C.text }}>
            {candidates.map(c=><option key={c.id} value={c.id}>{c.name||"Unknown"} — {c.company_name||"N/A"}</option>)}
          </select>
          {candidates.length === 0 && <span style={{ fontSize:12, color:C.muted }}>No candidates. <span style={{ color:C.primary, cursor:"pointer" }} onClick={()=>setPage("upload")}>Upload one →</span></span>}
        </div>
        {candidate && (
          <>
            <SCard style={{ marginBottom:16 }}>
              <div style={{ padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
                <div style={{ display:"flex", alignItems:"center", gap:14 }}>
                  <Avatar name={candidate.name||"?"} size={46} />
                  <div>
                    <div style={{ fontSize:16, fontWeight:700, color:C.text }}>{candidate.name||"Unknown"}</div>
                    {candidate.role && <div style={{ fontSize:12, color:C.teal, fontWeight:600 }}>{candidate.role}</div>}
                    <div style={{ fontSize:12, color:C.muted, display:"flex", gap:10, flexWrap:"wrap", marginTop:3 }}>
                      <span>ATS: <b style={{ color:candidate.score>=75?C.teal:candidate.score>=50?C.amber:C.primary }}>{candidate.score||0}%</b></span>
                      {candidate.semantic_score!=null && <span>Semantic: <b style={{ color:candidate.semantic_score>=70?C.teal:C.amber }}>{candidate.semantic_score}%</b></span>}
                      <span>· {candidate.match_level||"N/A"} · <StatusBadge status={candidate.status} /></span>
                    </div>
                  </div>
                </div>
                <div style={{ display:"flex", gap:8 }}>
                  <Btn variant="outline" small onClick={runAnalysis} disabled={analyzing}>{analyzing?"⏳ Analyzing...":"▶ Run AI"}</Btn>
                  {candidate.status !== "Approved" && <Btn variant="success" small onClick={handleApprove}>✓ Approve</Btn>}
                  <Btn variant="ghost" small onClick={()=>api.downloadResume(candidate.id)}>⬇ Download</Btn>
                </div>
              </div>
            </SCard>

            {/* Gaps & Strengths */}
            {(candidate.gaps?.length>0||candidate.strengths?.length>0) && (
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:16 }}>
                {candidate.strengths?.length>0 && <SCard style={{ border:`1px solid ${C.teal}44` }}><div style={{ padding:14 }}><div style={{ fontSize:11, fontWeight:700, color:C.teal, marginBottom:8 }}>✅ Matched Skills ({candidate.strengths.length})</div><div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>{candidate.strengths.slice(0,12).map((s,i)=><span key={i} style={{ background:C.tealSoft, color:C.teal, border:`1px solid ${C.teal}44`, borderRadius:12, padding:"2px 8px", fontSize:11 }}>{s.replace("Has: ","")}</span>)}</div></div></SCard>}
                {candidate.gaps?.length>0 && <SCard style={{ border:"1px solid #ef444444" }}><div style={{ padding:14 }}><div style={{ fontSize:11, fontWeight:700, color:"#dc2626", marginBottom:8 }}>⚠ Gaps ({candidate.gaps.length})</div><div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>{candidate.gaps.slice(0,12).map((g,i)=><span key={i} style={{ background:"#fee2e2", color:"#dc2626", border:"1px solid #dc262633", borderRadius:12, padding:"2px 8px", fontSize:11 }}>{g.replace("[MUST HAVE] ","").replace("[NICE TO HAVE] ","")}</span>)}</div></div></SCard>}
              </div>
            )}

            <div style={{ display:"flex", gap:4, marginBottom:0 }}>
              {[{id:"diff",label:"Before / After"},{id:"edit",label:"✏ Edit Mode"}].map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{ padding:"7px 18px", borderRadius:"6px 6px 0 0", cursor:"pointer", border:`1px solid ${C.border}`, borderBottom:tab===t.id?`1px solid ${C.card}`:`1px solid ${C.border}`, background:tab===t.id?C.card:C.bg, color:tab===t.id?C.text:C.muted, fontSize:12, fontWeight:600 }}>{t.label}</button>
              ))}
            </div>
            <SCard style={{ borderRadius:"0 12px 12px 12px" }}>
              {tab === "diff" && (
                <div style={{ padding:16, display:"flex", gap:16 }}>
                  {[{title:"Before (Original)",map:bMap,bg:"#fff",hc:C.muted},{title:"After (AI Improved)",map:aMap,bg:"#f5fffe",hc:C.teal}].map(col=>(
                    <div key={col.title} style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:10, overflow:"hidden" }}>
                      <div style={{ padding:"12px 18px", borderBottom:`1px solid ${C.border}`, fontSize:11, fontWeight:700, color:col.hc, textTransform:"uppercase", letterSpacing:"0.1em", background:"rgba(0,0,0,0.02)" }}>{col.title}</div>
                      {labels.length === 0 && <div style={{ padding:32, textAlign:"center", color:C.muted, fontSize:12 }}>{col.hc===C.teal?"Click ▶ Run AI to generate improvements":"No content to preview."}</div>}
                      {labels.map((lbl,i)=>(

          {draftText && <Btn variant="success" onClick={handleSave} disabled={saving}>{saving?"Saving...":"💾 Save Draft"}</Btn>}

            </div>
            {provider==="ollama" && <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}><div><Label>Ollama URL</Label><Input value={ollamaUrl} onChange={e=>setOllamaUrl(e.target.value)} placeholder="http://localhost:11434"/></div><div><Label>Model</Label><Input value={ollamaModel} onChange={e=>setOllamaModel(e.target.value)} placeholder="qwen2.5:0.5b"/></div></div>}
            {provider==="groq" && <div style={{ display:"flex", flexDirection:"column", gap:14 }}><div style={{ background:"#f0fdf4", border:"1px solid #22c55e", borderRadius:8, padding:"10px 14px", fontSize:12, color:"#166534" }}>⚡ Free at <b>console.groq.com</b> — key starts with <code>gsk_</code></div><KeyRow label="Groq API Key" value={groqKey} onChange={setGroqKey} masked={cfg?.groq_api_key_masked} show={showGroq} setShow={setShowGroq}/><div><Label>Model</Label><select value={groqModel} onChange={e=>setGroqModel(e.target.value)} style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }}><option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout 17B — Recommended ⭐</option><option value="llama-3.3-70b-versatile">Llama 3.3 70B — Highest quality</option><option value="llama-3.1-8b-instant">Llama 3.1 8B — Fastest</option></select></div></div>}
            {provider==="nvidia" && <div style={{ display:"flex", flexDirection:"column", gap:14 }}><div style={{ background:"#f0fdf4", border:"1px solid #22c55e", borderRadius:8, padding:"10px 14px", fontSize:12, color:"#166534" }}>🟢 1,000 free credits at <b>build.nvidia.com</b> — key starts with <code>nvapi-</code></div><KeyRow label="NVIDIA API Key" value={nvidiaKey} onChange={setNvidiaKey} masked={cfg?.nvidia_api_key_masked} show={showNvidia} setShow={setShowNvidia}/><div><Label>Model</Label><select value={nvidiaModel} onChange={e=>setNvidiaModel(e.target.value)} style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }}><option value="meta/llama-3.1-70b-instruct">meta/llama-3.1-70b-instruct (Recommended)</option><option value="meta/llama-3.3-70b-instruct">meta/llama-3.3-70b-instruct</option></select></div></div>}
            {provider==="gemini" && <div style={{ display:"flex", flexDirection:"column", gap:14 }}><KeyRow label="Gemini API Key" value={geminiKey} onChange={setGeminiKey} masked={cfg?.gemini_api_key_masked} show={showGemini} setShow={setShowGemini}/><div><Label>Model</Label><select value={geminiModel} onChange={e=>setGeminiModel(e.target.value)} style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }}><option value="gemini-2.0-flash">gemini-2.0-flash (Recommended)</option><option value="gemini-1.5-flash">gemini-1.5-flash</option><option value="gemini-1.5-pro">gemini-1.5-pro</option></select></div></div>}
            {provider==="azure" && <div style={{ display:"flex", flexDirection:"column", gap:14 }}><div style={{ background:C.blueSoft, border:"1px solid #3b82f6", borderRadius:8, padding:"10px 14px", fontSize:12, color:"#1e40af" }}>☁ Get endpoint &amp; key from: <b>portal.azure.com → Azure OpenAI → Keys and Endpoint</b></div><div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}><div><Label>Azure Endpoint</Label><Input value={azureEndpoint} onChange={e=>setAzureEndpoint(e.target.value)} placeholder="https://YOUR-RESOURCE.openai.azure.com"/></div><div><Label>Deployment Name</Label><Input value={azureDeployment} onChange={e=>setAzureDeployment(e.target.value)} placeholder="gpt-4o"/></div></div><KeyRow label="Azure API Key" value={azureKey} onChange={setAzureKey} masked={cfg?.azure_api_key_masked} show={showAzure} setShow={setShowAzure}/><div><Label>API Version</Label><select value={azureApiVersion} onChange={e=>setAzureApiVersion(e.target.value)} style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }}><option value="2024-08-01-preview">2024-08-01-preview (Recommended)</option><option value="2024-05-01-preview">2024-05-01-preview</option></select></div></div>}
            <div style={{ display:"flex", gap:10, marginTop:20 }}>
              <Btn variant="success" onClick={handleSave} disabled={saving}>{saving?"Saving...":"💾 Save Fields"}</Btn>
              <Btn variant="outline" onClick={handleTest} disabled={testing}>{testing?"Testing...":"🔌 Test Connection"}</Btn>
            </div>
            {testResult && <div style={{ marginTop:14, background:testResult.success?C.tealSoft:C.primarySoft, border:`1px solid ${testResult.success?C.teal:C.primary}`, borderRadius:8, padding:"10px 16px", fontSize:13, color:testResult.success?C.teal:C.primary }}>{testResult.success?"✅":"❌"} {testResult.provider?.toUpperCase()} — {testResult.message}</div>}
          </div>
        </SCard>

        <SCard style={{ marginBottom:20 }}>
          <SHead>📧 Admin Contact Email</SHead>
          <div style={{ padding:20 }}>
            <div style={{ fontSize:12, color:C.muted, marginBottom:10 }}>Shown to users when a JD domain is not fully supported.</div>
            <Input value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} placeholder="admin@yourcompany.com" />
            <div style={{ fontSize:11, color:C.muted, marginTop:6 }}>Saved when you click "Save Fields" above.</div>
          </div>
        </SCard>

        {semStatus && (
          <SCard style={{ marginBottom:20, border:`1px solid ${semStatus.available?C.teal+"44":C.border}` }}>
            <div style={{ padding:"16px 20px", display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ fontSize:18 }}>{semStatus.available?"🧠":"⚪"}</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:13, fontWeight:700, color:C.text }}>Semantic Engine <span style={{ marginLeft:10, fontSize:11, padding:"2px 8px", borderRadius:10, fontWeight:600, background:semStatus.available?C.tealSoft:C.primarySoft, color:semStatus.available?C.teal:C.primary }}>{semStatus.available?"Active":"Offline"}</span></div>
                <div style={{ fontSize:11, color:C.muted, marginTop:3 }}>{semStatus.available ? semStatus.label : "pip install sentence-transformers to enable soft gap detection"}</div>
              </div>
            </div>
          </SCard>
        )}

        <SCard>
          <SHead>🔐 Login Credentials</SHead>
          <div style={{ padding:20 }}>
            <div style={{ fontSize:12, color:C.muted, marginBottom:16 }}>Change username and password. You will be signed out after saving.</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:16 }}>
              <div><Label>New Username</Label><Input value={newUser} onChange={e=>setNewUser(e.target.value)} placeholder="Enter username"/></div>
              <div><Label>New Password</Label><div style={{ display:"flex", gap:8 }}><input type={showPwd?"text":"password"} value={newPass} onChange={e=>setNewPass(e.target.value)} placeholder="New password" style={{ flex:1, padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }}/><button onClick={()=>setShowPwd(!showPwd)} style={{ padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, cursor:"pointer", background:C.bg, fontSize:12 }}>{showPwd?"🙈":"👁"}</button></div></div>
              <div><Label>Confirm Password</Label><input type={showPwd?"text":"password"} value={confirmPass} onChange={e=>setConfirmPass(e.target.value)} placeholder="Repeat password" style={{ width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:8, fontSize:13, background:C.bg }}/></div>
            </div>
            {credMsg && <div style={{ background:credMsg.ok?C.tealSoft:C.primarySoft, border:`1px solid ${credMsg.ok?C.teal:C.primary}`, borderRadius:7, padding:"9px 14px", fontSize:13, color:credMsg.ok?C.teal:C.primary, marginBottom:12 }}>{credMsg.text}</div>}
            <Btn onClick={handleCredSave} disabled={savingCred}>{savingCred?"Saving...":"Update Credentials"}</Btn>
          </div>
        </SCard>
      </div>
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */
function App() {
  const [page, setPage] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [alignState, setAlignState] = useState(null);
  const [aiOnline, setAiOnline] = useState(false);
  const [aiProvider, setAiProvider] = useState("groq");

  const username = localStorage.getItem("cms_username") || "Admin";

  /* Auth guard — redirect to login if no token */
  useEffect(() => {
    const token = localStorage.getItem("cms_token");
    if (!token) { window.location.href = "/"; return; }
    /* Check AI status */
    api.ollamaStatus().then(r => { setAiOnline(r.online||false); setAiProvider(r.provider||"groq"); });
  }, []);

  const handleLogout = () => {
    localStorage.removeItem("cms_token");
    localStorage.removeItem("cms_username");
    window.location.href = "/";
  };

  const pages = {
    dashboard:   <PageDashboard setPage={setPage} />,
    jdmanager:   <PageJDManager setPage={setPage} />,
    upload:      <PageUpload setPage={setPage} />,
    listing:     <PageListing setPage={setPage} setSelectedId={setSelectedId} />,
    review:      <PageReview setPage={setPage} selectedId={selectedId} />,
    jdalign:     <PageJDAlign setPage={setPage} selectedId={selectedId} alignState={alignState} setAlignState={setAlignState} />,
    jdalignlist: <PageJDAlignList setPage={setPage} />,
    pipeline:    <PagePipeline aiOnline={aiOnline} aiProvider={aiProvider} />,
    settings:    <PageSettings onSave={() => api.ollamaStatus().then(r=>{ setAiOnline(r.online||false); setAiProvider(r.provider||"groq"); })} />,
  };

  return (
    <div style={{ display:"flex", background:C.bg, minHeight:"100vh" }}>
      <Sidebar active={page} setPage={setPage} onLogout={handleLogout} username={username} aiOnline={aiOnline} aiProvider={aiProvider} />
      <div style={{ marginLeft:230, flex:1, minHeight:"100vh", overflow:"auto" }}>
        {pages[page] || pages.dashboard}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
