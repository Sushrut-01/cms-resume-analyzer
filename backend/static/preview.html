    groq:   (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>),
    nvidia: (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>),
    gemini: (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>),
    azure:  (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>),
  };
  const EyeIcon = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>);
  const EyeOffIcon = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>);
  const ProvCard = ({ id, title, sub }) => {
    const active = provider===id;
    return (
      <div onClick={()=>switchProvider(id)} style={{ flex:1, minWidth:140, border:`2px solid ${active?C.teal:C.border}`, borderRadius:12, padding:"16px 18px", cursor:"pointer", background:active?C.tealSoft:C.card, transition:"all 0.2s", boxShadow:active?"0 0 0 3px rgba(13,148,136,0.12)":"none" }}>
        <div style={{ display:"flex", alignItems:"flex-start", gap:10 }}>
          <div style={{ width:38, height:38, borderRadius:9, background:active?"rgba(13,148,136,0.15)":C.bg, display:"flex", alignItems:"center", justifyContent:"center", color:active?C.teal:"#6B9FDB", flexShrink:0 }}>{PROV_ICONS[id]}</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:13, fontWeight:700, color:active?C.teal:C.text }}>{title}</div>
            <div style={{ fontSize:11, color:C.muted, marginTop:2 }}>{sub}</div>
          </div>
          {active && <div style={{ width:18, height:18, borderRadius:"50%", background:C.teal, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", flexShrink:0, marginTop:2 }}>{STAT_ICONS.check}</div>}
        </div>
      </div>
    );
  };
  const KeyRow = ({ label, value, onChange, masked, show, setShow }) => (
    <div>
      <Label>{label}</Label>
      {masked&&!value&&<div style={{ fontSize:11, color:C.teal, marginBottom:5, display:"flex", alignItems:"center", gap:5 }}><span style={{display:"flex",color:C.teal,flexShrink:0}}>{STAT_ICONS.key}</span>Key saved: {masked} — leave blank to keep</div>}
      <div style={{ display:"flex", gap:8 }}>
        <input type={show?"text":"password"} value={value} onChange={e=>onChange(e.target.value)} placeholder={masked?"Enter new key to replace...":"Paste key here..."}
          style={{ flex:1, padding:"9px 12px", border:`1px solid ${value?C.teal:C.border}`, borderRadius:8, fontSize:13, fontFamily:font.mono, background:C.bg }} />
        <button onClick={()=>setShow(!show)} style={{ padding:"9px 14px", border:`1px solid ${C.border}`, borderRadius:8, cursor:"pointer", background:C.bg, color:C.textSub, display:"flex", alignItems:"center", justifyContent:"center" }}>{show?<EyeOffIcon/>:<EyeIcon/>}</button>
      </div>
    </div>
  );
  return (
    <div className="fade-in">
      <Topbar title="Settings" sub="Configure AI provider, models, and preferences" />
      <div style={{ padding:24, maxWidth:860, background:"linear-gradient(180deg,rgba(21,88,203,0.03) 0%,transparent 160px)" }}>
        <SCard style={{ marginBottom:20, borderTop:"3px solid #7c3aed" }}>
          <SHead action={
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              {can("action:edit_settings") && <Btn variant="success" small onClick={handleSave} disabled={saving}>{saving?"Saving...":<>{STAT_ICONS.save} Save</>}</Btn>}
              <Btn variant="outline" small onClick={handleTest} disabled={testing}>
                {testing?"Testing…":<><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{marginRight:4}}><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>Test Connection</>}
              </Btn>
            </div>
          }>{STAT_ICONS.cpu} Ollama — Model Manager</SHead>

          {/* Ollama URL — compact row at top */}
          <div style={{ padding:"12px 20px 0", display:"flex", gap:12, alignItems:"flex-end", borderBottom:`1px solid ${C.borderSoft}`, paddingBottom:14 }}>
            <div style={{ flex:1 }}>
              <Label>Ollama URL</Label>
              <Input value={ollamaUrl} onChange={e=>setOllamaUrl(e.target.value)} placeholder="http://localhost:11434"/>
            </div>
            <div style={{ fontSize:11, color:"#065F59", background:C.tealSoft, border:`1px solid ${C.teal}`, borderRadius:7, padding:"6px 12px", whiteSpace:"nowrap", display:"flex", alignItems:"center", gap:5 }}>
              {STAT_ICONS.cpu} Local only — data never leaves office network
            </div>
          </div>
          {testResult && (
            <div style={{ margin:"0 20px", marginTop:10, background:testResult.success?C.tealSoft:C.primarySoft, border:`1px solid ${testResult.success?C.teal:C.primary}`, borderRadius:8, padding:"9px 14px", fontSize:12, color:testResult.success?C.teal:C.primary, display:"flex", alignItems:"center", gap:8 }}>
              <span style={{display:"flex",flexShrink:0}}>{testResult.success?STAT_ICONS.ok:STAT_ICONS.xmark}</span>
              <span><b>OLLAMA</b> — {testResult.message}</span>
            </div>
          )}
          <ModelManager ollamaUrl={ollamaUrl} activeModel={ollamaModel} onModelChange={m=>{ setOllamaModel(m); api.saveSettings({provider:"ollama", ollama_url:ollamaUrl, ollama_model:m}); if(onSave) onSave(); }} />
        </SCard>

        <SCard style={{ marginBottom:20, borderTop:"3px solid #0d9488" }}>
          <SHead><span style={{display:"flex",marginRight:4}}>{BOT_ICONS.mail}</span>Admin Contact Email</SHead>
          <div style={{ padding:20 }}>
            <div style={{ fontSize:12, color:C.muted, marginBottom:10 }}>Shown to users when a JD domain is not fully supported.</div>
            <Input value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} placeholder="admin@yourcompany.com" />
            <div style={{ fontSize:11, color:C.muted, marginTop:6 }}>Saved when you click "Save Fields" above.</div>
          </div>
        </SCard>

        {semStatus && (
          <SCard style={{ marginBottom:20, border:`1px solid ${semStatus.available?C.teal+"44":C.border}`, borderTop:`3px solid ${semStatus.available?"#7c3aed":"#94A3B8"}` }}>
            <div style={{ padding:"16px 20px", display:"flex", alignItems:"center", gap:12 }}>
              <div style={{ width:38, height:38, borderRadius:9, background:semStatus.available?"rgba(13,148,136,0.12)":"#F5F8FF", display:"flex", alignItems:"center", justifyContent:"center", color:semStatus.available?C.teal:C.muted, border:`1px solid ${semStatus.available?"rgba(13,148,136,0.25)":"#DDE4EE"}`, flexShrink:0 }}>{STAT_ICONS.cpu}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:13, fontWeight:700, color:C.text }}>Semantic Engine <span style={{ marginLeft:10, fontSize:11, padding:"2px 8px", borderRadius:10, fontWeight:600, background:semStatus.available?C.tealSoft:C.primarySoft, color:semStatus.available?C.teal:C.primary }}>{semStatus.available?"Active":"Offline"}</span></div>
                <div style={{ fontSize:11, color:C.muted, marginTop:3 }}>{semStatus.available ? semStatus.label : "pip install sentence-transformers to enable soft gap detection"}</div>
              </div>
            </div>
          </SCard>
        )}

        <SCard style={{ marginBottom:20, borderTop:"3px solid #1C3D6B" }}>
          <SHead>{STAT_ICONS.list} AI Activity Log</SHead>
          <AILogViewer />
        </SCard>

      </div>
    </div>
  );
}

/* ─── Page: User Management (admin only) ────────────────── */
function PageUsers() {
  const [users,       setUsers]       = React.useState([]);
  const [roles,       setRoles]       = React.useState([]);
  const [loading,     setLoading]     = React.useState(true);
  const [search,      setSearch]      = React.useState("");
  const [roleFilter,  setRoleFilter]  = React.useState("all");
  const [expanded,    setExpanded]    = React.useState(null);
  const [editForm,    setEditForm]    = React.useState({});
  const [saving,      setSaving]      = React.useState(false);
  const [deleting,    setDeleting]    = React.useState(null);
  const [showCreate,  setShowCreate]  = React.useState(false);
  const [createForm,  setCreateForm]  = React.useState({ name:"", email:"", password:"", role:"recruiter" });
  const [creating,    setCreating]    = React.useState(false);
  const [msg,         setMsg]         = React.useState(null);
  const meId = localStorage.getItem("cms_user_id");

  const load = () => {
    setLoading(true);
    Promise.all([api.getUsers(), api.getRoles()]).then(([ur, rr]) => {
      setUsers(ur.data || []);
      setRoles(rr.data || []);
      setLoading(false);
    });
  };
  React.useEffect(() => { load(); }, []);

  const filtered = users.filter(u => {
    const q = search.toLowerCase();
    const matchQ    = !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
    const matchRole = roleFilter === "all" || u.role === roleFilter;
    return matchQ && matchRole;
  });

  const openEdit = (u) => {
    setExpanded(expanded === u.id ? null : u.id);
    setEditForm({ name:u.name, email:u.email, role:u.role, is_active:u.is_active, password:"" });
    setMsg(null);
  };

  const handleSave = async (id) => {
    setSaving(true); setMsg(null);
    const p = { name:editForm.name, email:editForm.email, role:editForm.role, is_active:editForm.is_active };
    if (editForm.password) p.password = editForm.password;
    const res = await api.updateUser(id, p);
    setSaving(false);
    if (res.success) { setMsg({ ok:true, text:"Saved successfully." }); load(); }
    else setMsg({ ok:false, text:res.detail || "Failed to save." });
  };

  const handleDelete = async (id, name) => {
    if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
    setDeleting(id);
    await api.deleteUser(id);
    setDeleting(null); setExpanded(null);
    load();
  };

  const handleCreate = async (e) => {
    e.preventDefault();
    if (!createForm.name.trim() || !createForm.email.trim() || !createForm.password) return;
    setCreating(true); setMsg(null);
    const res = await api.createUser(createForm);
    setCreating(false);
    if (res.success) {
      setShowCreate(false);
      setCreateForm({ name:"", email:"", password:"", role:"recruiter" });
      load();
    } else setMsg({ ok:false, text:res.detail || res.error || "Failed to create user." });
  };

  const total     = users.length;
  const admins    = users.filter(u => u.role === "admin" || u.role === "super_admin").length;
  const recruiters= users.filter(u => u.role === "recruiter").length;
  const active    = users.filter(u => u.is_active).length;
  const inp = { display:"block", width:"100%", padding:"8px 12px", border:`1.5px solid ${C.border}`, borderRadius:7, fontSize:13, fontFamily:font.body, color:C.text, background:"#fff" };

  return (
    <div className="fade-in">
      <Topbar title="User Management" sub="Admin · Manage recruiter accounts"
        action={<Btn icon={STAT_ICONS.person} onClick={()=>setShowCreate(s=>!s)}>+ Create User</Btn>} />
      <div className="page-content">

        {/* Stats row */}
        <div style={{ display:"flex", gap:12, marginBottom:18 }}>
          <StatCard label="Total Users"  value={total}      gradient={C.blueGrad}   icon="people" />
          <StatCard label="Admins"       value={admins}     gradient={C.purpleGrad} icon="key" />
          <StatCard label="Recruiters"   value={recruiters} gradient={C.primaryGrad}icon="person" />
          <StatCard label="Active"       value={active}     gradient={C.tealGrad}   icon="check" />
        </div>

        {/* Create user form */}
        {showCreate && (
          <SCard style={{ marginBottom:16 }}>
            <SHead action={<button onClick={()=>setShowCreate(false)} style={{ background:"none", border:"none", cursor:"pointer", color:C.muted, fontSize:22, lineHeight:1, padding:"0 4px" }}>×</button>}>
              Create New User
            </SHead>
            <form onSubmit={handleCreate} style={{ padding:"16px 20px", display:"flex", flexDirection:"column", gap:12 }}>
              {msg&&!msg.ok&&<div style={{ background:"#FFF1F2", border:"1px solid #9B1C1C33", borderRadius:7, padding:"8px 12px", fontSize:12, color:"#9B1C1C" }}>{msg.text}</div>}
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:5 }}>Full Name</label>
                  <input style={inp} placeholder="Jane Smith" value={createForm.name} onChange={e=>setCreateForm(f=>({...f,name:e.target.value}))} required />
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:5 }}>Login Email</label>
                  <input style={inp} placeholder="jane.smith" value={createForm.email} onChange={e=>setCreateForm(f=>({...f,email:e.target.value}))} required />
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:5 }}>Temporary Password</label>
                  <input type="password" style={inp} placeholder="Set initial password" value={createForm.password} onChange={e=>setCreateForm(f=>({...f,password:e.target.value}))} required />
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:5 }}>Role</label>
                  <select style={inp} value={createForm.role} onChange={e=>setCreateForm(f=>({...f,role:e.target.value}))}>
                    {roles.map(r=><option key={r.name} value={r.name}>{r.label}</option>)}
                  </select>
                </div>
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <Btn disabled={creating}>{creating?"Creating…":"Create User"}</Btn>
                <Btn variant="ghost" onClick={()=>setShowCreate(false)}>Cancel</Btn>
              </div>
            </form>
          </SCard>
        )}

        {/* User list */}
        <SCard>
          <div className="filter-bar" style={{ margin:"14px 16px 0", marginBottom:0, borderBottom:"none" }}>
            <input placeholder="Search name or login…" value={search} onChange={e=>setSearch(e.target.value)}
              style={{ flex:1, minWidth:180, padding:"7px 12px", border:`1.5px solid ${C.border}`, borderRadius:7, fontSize:13, fontFamily:font.body, color:C.text }} />
            {["all", ...roles.map(r=>r.name)].map(r=>(
              <button key={r} onClick={()=>setRoleFilter(r)} style={{ padding:"6px 14px", borderRadius:7, border:`1.5px solid ${roleFilter===r?C.primary:C.border}`, background:roleFilter===r?C.primarySoft:"#fff", color:roleFilter===r?C.primary:C.muted, fontSize:12, fontWeight:600, cursor:"pointer" }}>
                {r==="all"?"All Roles":(roles.find(x=>x.name===r)?.label||r)}
              </button>
            ))}
          </div>
          <div style={{ padding:"10px 14px" }}>
            {loading && <div className="empty-state"><div style={{ color:C.muted, fontSize:13 }}>Loading users…</div></div>}
            {!loading && filtered.length === 0 && (
              <div className="empty-state">
                <div className="empty-state-icon" style={{ color:C.primary }}>{STAT_ICONS.person}</div>
                <div className="empty-state-title">No users found</div>
                <div className="empty-state-sub">Create a user to get started.</div>
              </div>
            )}
            {!loading && filtered.map(u => {
              const isMe = String(u.id) === meId;
              const isExp = expanded === u.id;
              return (
                <div key={u.id} style={{ border:`1px solid ${isExp?C.primary+"55":C.border}`, borderRadius:11, marginBottom:8, overflow:"hidden", transition:"all 0.15s" }}>
                  {/* Row header */}
                  <div style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", cursor:"pointer", background:isExp?"#F8FAFD":"#fff" }}
                       onClick={()=>openEdit(u)}>
                    <Avatar name={u.name} size={36} />
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:C.text, display:"flex", alignItems:"center", gap:7 }}>
                        {u.name}
                        {isMe && <span style={{ fontSize:11, fontWeight:700, color:C.primary, background:C.primarySoft, padding:"1px 7px", borderRadius:10 }}>You</span>}
                      </div>
                      <div style={{ fontSize:11, color:C.muted, marginTop:2 }}>{u.email}</div>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                      <span style={{ background:(u.role==="admin"||u.role==="super_admin")?C.purpleSoft:C.primarySoft, color:(u.role==="admin"||u.role==="super_admin")?C.purple:C.primary, fontSize:11, fontWeight:700, padding:"3px 10px", borderRadius:20 }}>
                        {roles.find(r=>r.name===u.role)?.label || u.role.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())}
                      </span>
                      <span style={{ background:u.is_active?"rgba(13,148,136,0.10)":"#fef2f2", color:u.is_active?"#065F59":"#9B1C1C", fontSize:11, fontWeight:700, padding:"3px 10px", borderRadius:20 }}>
                        {u.is_active?"Active":"Inactive"}
                      </span>
                      <span style={{ fontSize:11, color:C.muted }}>{u.created_at?.slice(0,10)||""}</span>
                    </div>
                    <span style={{ color:C.muted, fontSize:14, flexShrink:0, marginLeft:4 }}>{isExp?"▲":"▼"}</span>
                  </div>

                  {/* Expanded edit panel */}
                  {isExp && (
                    <div style={{ borderTop:`1px solid ${C.borderSoft}`, padding:"16px 18px", background:"#F8FAFD" }}>
                      {msg && <div style={{ background:msg.ok?"#f0fdf4":"#FFF1F2", border:`1px solid ${msg.ok?"#86efac":"#9B1C1C33"}`, borderRadius:7, padding:"7px 12px", fontSize:12, color:msg.ok?"#15803d":"#9B1C1C", marginBottom:10 }}>{msg.text}</div>}
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
                        <div>
                          <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:4 }}>Full Name</label>
                          <input style={inp} value={editForm.name||""} onChange={e=>setEditForm(f=>({...f,name:e.target.value}))} />
                        </div>
                        <div>
                          <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:4 }}>Kforce Email (login ID)</label>
                          <input style={inp} value={editForm.email||""} onChange={e=>setEditForm(f=>({...f,email:e.target.value}))} placeholder="firstname.lastname@kforce.co.in" />
                        </div>
                        <div>
                          <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:4 }}>Role</label>
                          <select style={inp} value={editForm.role||"recruiter"} onChange={e=>setEditForm(f=>({...f,role:e.target.value}))} disabled={isMe}>
                            {roles.map(r=><option key={r.name} value={r.name}>{r.label}</option>)}
                          </select>
                        </div>
                        <div>
                          <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:4 }}>Status</label>
                          <select style={inp} value={editForm.is_active?"active":"inactive"} onChange={e=>setEditForm(f=>({...f,is_active:e.target.value==="active"}))} disabled={isMe}>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive (cannot login)</option>
                          </select>
                        </div>
                        <div style={{ gridColumn:"span 2" }}>
                          <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:4 }}>Password <span style={{ fontWeight:400, color:C.muted }}>(leave blank to keep · not needed for Microsoft login users)</span></label>
                          <input type="password" style={inp} placeholder="New password" value={editForm.password||""} onChange={e=>setEditForm(f=>({...f,password:e.target.value}))} />
                        </div>
                      </div>
                      <div style={{ display:"flex", gap:8 }}>
                        <Btn onClick={()=>handleSave(u.id)} disabled={saving}>{saving?"Saving…":"Save Changes"}</Btn>
                        {!isMe && (
                          <button onClick={()=>handleDelete(u.id, u.name)} disabled={deleting===u.id}
                            style={{ padding:"6px 14px", background:"#FFF1F2", color:"#9B1C1C", border:"1px solid #9B1C1C33", borderRadius:7, fontSize:12, fontWeight:600, cursor:"pointer", opacity:deleting===u.id?0.5:1 }}>
                            {deleting===u.id?"Deleting…":"Delete User"}
                          </button>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </SCard>
      </div>
    </div>
  );
}

/* ─── Permission grid — module-level to keep stable reference */
function PermGrid({ perms, setPerms, disabled }) {
  return (
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
      <div>
        <div style={{ fontSize:11, fontWeight:700, color:C.primary, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:8 }}>Pages</div>
        {PERM_PAGES.map(p => (
          <label key={p.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"5px 0", cursor:disabled?"default":"pointer" }}>
            <input type="checkbox" checked={perms.includes(p.id)}
              onChange={() => { if (!disabled) setPerms(prev => prev.includes(p.id) ? prev.filter(x=>x!==p.id) : [...prev, p.id]); }}
              style={{ width:14, height:14, accentColor:C.primary, cursor:disabled?"default":"pointer" }} />
            <span style={{ fontSize:12, color:C.text }}>{p.label}</span>
          </label>
        ))}
      </div>
      <div>
        <div style={{ fontSize:11, fontWeight:700, color:C.teal, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:8 }}>Actions</div>
        {PERM_ACTIONS.map(p => (
          <label key={p.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"5px 0", cursor:disabled?"default":"pointer" }}>
            <input type="checkbox" checked={perms.includes(p.id)}
              onChange={() => { if (!disabled) setPerms(prev => prev.includes(p.id) ? prev.filter(x=>x!==p.id) : [...prev, p.id]); }}
              style={{ width:14, height:14, accentColor:C.teal, cursor:disabled?"default":"pointer" }} />
            <span style={{ fontSize:12, color:C.text }}>{p.label}</span>
          </label>
        ))}
      </div>
    </div>
  );
}

/* ─── Page: Roles & Access (super_admin only) ───────────── */
const PERM_PAGES = [
  { id:"page:dashboard",    label:"Dashboard" },
  { id:"page:jdmanager",    label:"JD Manager" },
  { id:"page:upload",       label:"Upload Resume" },
  { id:"page:listing",      label:"Candidate List" },
  { id:"page:review",       label:"Review Resume" },
  { id:"page:jdalign",      label:"JD Alignment" },
  { id:"page:jdalignlist",  label:"Aligned Resumes" },
  { id:"page:pipeline",     label:"Pipeline Status" },
  { id:"page:settings",     label:"Settings" },
  { id:"page:users",        label:"Users" },
  { id:"page:roles",        label:"Roles & Access" },
];
const PERM_ACTIONS = [
  { id:"action:analyze_candidate",  label:"Analyze Candidate" },
  { id:"action:approve_candidate",  label:"Approve Candidate" },
  { id:"action:delete_candidate",   label:"Delete Candidate" },
  { id:"action:create_jd",          label:"Create JD" },
  { id:"action:edit_jd",            label:"Edit JD" },
  { id:"action:delete_jd",          label:"Delete JD" },
  { id:"action:generate_aligned",   label:"Generate JD Draft" },
  { id:"action:download_resume",    label:"Download Resume" },
  { id:"action:manage_users",       label:"Manage Users" },
  { id:"action:manage_roles",       label:"Manage Roles" },
  { id:"action:edit_settings",      label:"Edit Settings" },
];

function PageRoles() {
  const [roles,        setRoles]        = React.useState([]);
  const [loading,      setLoading]      = React.useState(true);
  const [selected,     setSelected]     = React.useState(null); // role being edited
  const [editPerms,    setEditPerms]    = React.useState([]);
  const [editLabel,    setEditLabel]    = React.useState("");
  const [saving,       setSaving]       = React.useState(false);
  const [deleting,     setDeleting]     = React.useState(null);
  const [showCreate,   setShowCreate]   = React.useState(false);
  const [newName,      setNewName]      = React.useState("");
  const [newLabel,     setNewLabel]     = React.useState("");
  const [newPerms,     setNewPerms]     = React.useState([]);
  const [creating,     setCreating]     = React.useState(false);
  const [msg,          setMsg]          = React.useState(null);

  const load = () => { setLoading(true); api.getRoles().then(r => { setRoles(r.data||[]); setLoading(false); }); };
  React.useEffect(() => { load(); }, []);

  const openEdit = (role) => {
    if (selected?.id === role.id) { setSelected(null); return; }
    setSelected(role);
    setEditPerms(role.permissions || []);
    setEditLabel(role.label);
    setMsg(null);
  };

  const handleSave = async () => {
    if (!selected) return;
    setSaving(true); setMsg(null);
    const res = await api.updateRole(selected.id, { label: editLabel, permissions: editPerms });
    setSaving(false);
    if (res.success) { setMsg({ ok:true, text:"Saved." }); load(); }
    else setMsg({ ok:false, text: res.detail || "Failed to save." });
  };

  const handleDelete = async (role) => {
    if (!confirm(`Delete role "${role.label}"? Users with this role may lose access.`)) return;
    setDeleting(role.id);
    await api.deleteRole(role.id);
    setDeleting(null); setSelected(null);
    load();
  };

  const handleCreate = async (e) => {
    e.preventDefault();
    if (!newName.trim() || !newLabel.trim()) return;
    setCreating(true); setMsg(null);
    const res = await api.createRole({ name: newName.trim(), label: newLabel.trim(), permissions: newPerms });
    setCreating(false);
    if (res.success) { setShowCreate(false); setNewName(""); setNewLabel(""); setNewPerms([]); load(); }
    else setMsg({ ok:false, text: res.detail || res.error || "Failed to create role." });
  };

  return (
    <div className="fade-in">
      <Topbar title="Roles & Access" sub="Super Admin · Manage roles and permissions"
        action={<Btn icon={STAT_ICONS.key} onClick={()=>{ setShowCreate(s=>!s); setMsg(null); }}>+ New Role</Btn>} />
      <div className="page-content">

        {/* Create role form */}
        {showCreate && (
          <SCard style={{ marginBottom:16 }}>
            <SHead action={<button onClick={()=>setShowCreate(false)} style={{ background:"none", border:"none", cursor:"pointer", color:C.muted, fontSize:22, lineHeight:1, padding:"0 4px" }}>×</button>}>
              Create New Role
            </SHead>
            <form onSubmit={handleCreate} style={{ padding:"16px 20px", display:"flex", flexDirection:"column", gap:14 }}>
              {msg&&!msg.ok&&<div style={{ background:"#FFF1F2", border:"1px solid #9B1C1C33", borderRadius:7, padding:"8px 12px", fontSize:12, color:"#9B1C1C" }}>{msg.text}</div>}
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:5 }}>Role Name (slug)</label>
                  <input style={{ display:"block", width:"100%", padding:"8px 12px", border:`1.5px solid ${C.border}`, borderRadius:7, fontSize:13, fontFamily:font.body, color:C.text }} placeholder="e.g. senior_recruiter" value={newName} onChange={e=>setNewName(e.target.value)} required />
                  <div style={{ fontSize:11, color:C.muted, marginTop:3 }}>Lowercase, underscores only. Cannot be changed.</div>
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:5 }}>Display Label</label>
                  <input style={{ display:"block", width:"100%", padding:"8px 12px", border:`1.5px solid ${C.border}`, borderRadius:7, fontSize:13, fontFamily:font.body, color:C.text }} placeholder="e.g. Senior Recruiter" value={newLabel} onChange={e=>setNewLabel(e.target.value)} required />
                </div>
              </div>
              <div>
                <div style={{ fontSize:11, fontWeight:600, color:C.textSub, marginBottom:10 }}>Permissions</div>
                <PermGrid perms={newPerms} setPerms={setNewPerms} disabled={false} />
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <Btn disabled={creating}>{creating?"Creating…":"Create Role"}</Btn>
                <Btn variant="ghost" onClick={()=>setShowCreate(false)}>Cancel</Btn>
              </div>
            </form>
          </SCard>
        )}

        {/* Role list */}
        {loading && <div className="empty-state"><div style={{ color:C.muted, fontSize:13 }}>Loading roles…</div></div>}
        {!loading && roles.map(role => {
          const isSelected = selected?.id === role.id;
          const systemColors = { super_admin:{ bg:"#FFF8F0", color:C.amber, border:`1px solid ${C.amber}44` }, admin:{ bg:C.purpleSoft, color:C.purple, border:`1px solid ${C.purple}44` }, recruiter:{ bg:C.primarySoft, color:C.primary, border:`1px solid ${C.primary}44` } };
          const sc = systemColors[role.name] || { bg:C.tealSoft, color:C.teal, border:`1px solid ${C.teal}44` };
          return (
            <SCard key={role.id} style={{ marginBottom:12, border: isSelected ? `1.5px solid ${C.primary}` : `1px solid ${C.border}`, transition:"all 0.15s" }}>
              {/* Header row */}
              <div style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 20px", cursor:"pointer", background:isSelected?"#F8FAFD":"#fff", borderRadius: isSelected?"9px 9px 0 0":"9px" }}
                   onClick={()=>openEdit(role)}>
                <div style={{ width:38, height:38, borderRadius:9, background:sc.bg, border:sc.border, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                  <span style={{ fontSize:14, color:sc.color }}>{STAT_ICONS.key}</span>
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                    <span style={{ fontSize:14, fontWeight:700, color:C.text }}>{role.label}</span>
                    <span style={{ fontSize:11, color:C.muted, background:C.borderSoft, padding:"2px 8px", borderRadius:10 }}>{role.name}</span>
                    {role.is_system && <span style={{ fontSize:11, fontWeight:700, color:C.amber, background:"#FFF8F0", border:`1px solid ${C.amber}44`, padding:"2px 8px", borderRadius:10 }}>System</span>}
                  </div>
                  <div style={{ fontSize:11, color:C.muted, marginTop:3 }}>{(role.permissions||[]).length} permission{(role.permissions||[]).length!==1?"s":""}</div>
                </div>
                <div style={{ display:"flex", gap:8, alignItems:"center", flexShrink:0 }}>
                  {!role.is_system && (
                    <button onClick={e=>{e.stopPropagation(); handleDelete(role);}} disabled={deleting===role.id}
                      style={{ padding:"4px 12px", background:"#FFF1F2", color:"#9B1C1C", border:"1px solid #9B1C1C33", borderRadius:6, fontSize:11, fontWeight:600, cursor:"pointer", opacity:deleting===role.id?0.5:1 }}>
                      {deleting===role.id?"…":"Delete"}
                    </button>
                  )}
                  <span style={{ fontSize:16, color:C.muted }}>{isSelected?"▲":"▼"}</span>
                </div>
              </div>

              {/* Expanded permissions editor */}
              {isSelected && (
                <div style={{ borderTop:`1px solid ${C.borderSoft}`, padding:"16px 20px", background:"#F8FAFD" }}>
                  {msg && <div style={{ background:msg.ok?"#f0fdf4":"#FFF1F2", border:`1px solid ${msg.ok?"#86efac":"#9B1C1C33"}`, borderRadius:7, padding:"7px 12px", fontSize:12, color:msg.ok?"#15803d":"#9B1C1C", marginBottom:12 }}>{msg.text}</div>}
                  {role.name === "super_admin" ? (
                    <>
                      <div style={{ fontSize:11, color:C.amber, fontWeight:600, marginBottom:12, display:"flex", alignItems:"center", gap:6 }}>
                        <span>⚠</span> Super Admin role cannot be modified.
                      </div>
                      <PermGrid perms={role.permissions||[]} setPerms={()=>{}} disabled={true} />
                    </>
                  ) : (
                    <>
                      {!role.is_system && (
                        <div style={{ marginBottom:14 }}>
                          <label style={{ fontSize:11, fontWeight:600, color:C.textSub, display:"block", marginBottom:5 }}>Display Label</label>
                          <input value={editLabel} onChange={e=>setEditLabel(e.target.value)} style={{ padding:"8px 12px", border:`1.5px solid ${C.border}`, borderRadius:7, fontSize:13, fontFamily:font.body, color:C.text, width:280 }} />
                        </div>
                      )}
                      <div style={{ marginBottom:14 }}>
                        <PermGrid perms={editPerms} setPerms={setEditPerms} disabled={false} />
                      </div>
                      <Btn onClick={handleSave} disabled={saving}>{saving?"Saving…":"Save Permissions"}</Btn>
                    </>
                  )}
                </div>
              )}
            </SCard>
          );
        })}
      </div>
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */
function App() {
  const [page, setPage] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [alignState, setAlignState] = useState(null);
  const [aiOnline, setAiOnline] = useState(false);
  const [aiProvider, setAiProvider] = useState("groq");

  const [aiPanelOpen, setAiPanelOpen] = useState(false);
  const [aiPanelWidth, setAiPanelWidth] = useState(() => parseInt(localStorage.getItem("ai_panel_width") || "330"));
  const [spotlightOpen, setSpotlightOpen] = useState(false);
  const [allCandidates, setAllCandidates] = useState([]);
  const [aiRunning, setAiRunning] = useState(false);
  const [aiTask, setAiTask] = useState("");
  const startAI = (task) => { setAiRunning(true); setAiTask(task); };
  const stopAI  = ()     => { setAiRunning(false); setAiTask(""); };

  const username = localStorage.getItem("cms_username") || "Admin";
  const role     = localStorage.getItem("cms_role")     || "recruiter";

  useEffect(() => {
    const token = localStorage.getItem("cms_token");
    if (!token) { window.location.href = "/"; return; }
    // Verify token is still valid; refresh role from server
    fetch(`${API}/auth/verify`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token}) })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(d => {
        if (!d.valid) { window.location.href = "/"; return; }
        if (d.role)        localStorage.setItem("cms_role",        d.role);
        if (d.user_id)     localStorage.setItem("cms_user_id",     String(d.user_id));
        if (d.permissions) localStorage.setItem("cms_permissions", JSON.stringify(d.permissions));
        api.ollamaStatus().then(r => { setAiOnline(r.online||false); setAiProvider(r.provider||"groq"); });
        api.getCandidates().then(setAllCandidates);
      })
      .catch(() => { window.location.href = "/"; });
  }, []);

  const handlePanelWidth = (w) => { setAiPanelWidth(w); localStorage.setItem("ai_panel_width", w); };

  useEffect(() => {
    const h = (e) => { if ((e.ctrlKey||e.metaKey) && e.key==="k") { e.preventDefault(); setSpotlightOpen(s=>!s); } };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  const handleLogout = () => {
    localStorage.removeItem("cms_token");
    localStorage.removeItem("cms_username");
    localStorage.removeItem("cms_role");
    localStorage.removeItem("cms_user_id");
    localStorage.removeItem("cms_permissions");
    window.location.href = "/";
  };

  const onSettingsSave = () => api.ollamaStatus().then(r=>{ setAiOnline(r.online||false); setAiProvider(r.provider||"groq"); });

  const renderPage = () => {
    switch(page) {
      case "jdmanager":   return <PageJDManager setPage={setPage} />;
      case "upload":      return <PageUpload setPage={setPage} setSelectedId={setSelectedId} startAI={startAI} stopAI={stopAI} />;
      case "listing":     return <PageListing setPage={setPage} setSelectedId={setSelectedId} />;
      case "review":      return <PageReview setPage={setPage} selectedId={selectedId} startAI={startAI} stopAI={stopAI} />;
      case "jdalign":     return <PageJDAlign setPage={setPage} selectedId={selectedId} alignState={alignState} setAlignState={setAlignState} startAI={startAI} stopAI={stopAI} />;
      case "jdalignlist": return <PageJDAlignList setPage={setPage} setSelectedId={setSelectedId} />;
      case "pipeline":    return <PagePipeline aiOnline={aiOnline} aiProvider={aiProvider} />;
      case "settings":    return <PageSettings onSave={onSettingsSave} />;
      case "users":       return <PageUsers />;
      case "roles":       return <PageRoles />;
      default:            return <PageDashboard setPage={setPage} setSelectedId={setSelectedId} />;
    }
  };

  const aiCtxValue = { onAIToggle:()=>setAiPanelOpen(o=>!o), aiOpen:aiPanelOpen, onSpotlight:()=>setSpotlightOpen(true) };
  const rPad = aiPanelOpen ? aiPanelWidth : 0;

  return (
    <AICtx.Provider value={aiCtxValue}>
      {/* Top accent bar — full width */}
      <div style={{ position:"fixed", top:0, left:0, right:0, height:4, background:"linear-gradient(90deg,#1C3D6B 0%,#1558CB 40%,#00B4CC 70%,#1558CB 100%)", zIndex:10000, pointerEvents:"none" }} />
      <div style={{ background:"#1C3D6B", height:"100vh", padding:"4px", overflow:"hidden" }}>
      <div style={{ display:"flex", background:C.bg, height:"calc(100vh - 8px)", borderRadius:10, overflow:"hidden", boxShadow:"0 0 0 1px rgba(21,88,203,0.3),0 8px 40px rgba(10,22,40,0.6)" }}>
        <Sidebar active={page} setPage={setPage} onLogout={handleLogout} username={username} aiOnline={aiOnline} aiProvider={aiProvider} />
        <div style={{ marginRight:rPad, flex:1, height:"100%", overflow:"auto", paddingBottom: aiRunning ? 52 : 0, transition:"margin-right 0.28s cubic-bezier(0.4,0,0.2,1)" }}>
          {renderPage()}
        </div>
        <AIPanel open={aiPanelOpen} width={aiPanelWidth} onWidthChange={handlePanelWidth} onClose={()=>setAiPanelOpen(false)} page={page} candidateId={selectedId} />
        <Spotlight open={spotlightOpen} onClose={()=>setSpotlightOpen(false)} setPage={setPage} setSelectedId={setSelectedId} candidates={allCandidates} />
        {aiRunning && (
          <div style={{ position:"fixed", bottom:4, left:238, right:rPad+4, zIndex:9999, background:"#0d1b2e", color:"#fff", padding:"10px 24px", display:"flex", alignItems:"center", gap:14, borderTop:"2px solid #1558CB", fontSize:13, transition:"right 0.28s cubic-bezier(0.4,0,0.2,1)", borderRadius:"0 0 8px 0" }}>
            <span style={{ display:"flex", animation:"spin 1.2s linear infinite", color:"#5BADFF" }}>{STAT_ICONS.clock}</span>
            <span><strong>AI is working:</strong> {aiTask}</span>
            <span style={{ color:"rgba(255,255,255,0.45)", fontSize:11 }}>— Navigate freely, results will be here when you return</span>
          </div>
        )}
      </div>
      </div>
    </AICtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
