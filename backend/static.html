<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CMS Resume Optimizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Trebuchet MS', sans-serif; background: #f5f4f0; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = "http://127.0.0.1:8000";

const C = {
  bg: "#f5f4f0", card: "#ffffff", sidebar: "#1a1a2e",
  accent: "#e63946", accentSoft: "#fde8ea",
  teal: "#2a9d8f", tealSoft: "#e0f5f3",
  gold: "#e9c46a", goldSoft: "#fdf6e3",
  text: "#1a1a2e", muted: "#8b8fa8", border: "#e8e6df",
};
const font = { head: "'Georgia', serif", body: "'Trebuchet MS', sans-serif", mono: "'Courier New', monospace" };

const api = {
  getCandidates: async () => {
    try { const r = await fetch(`${API}/candidates/`); const d = await r.json(); return d.data || []; } catch { return []; }
  },
  getCandidate: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}`); const d = await r.json(); return d.data || {}; } catch { return {}; }
  },
  uploadResume: async (file, clientRequirementId) => {
    const form = new FormData();
    form.append("file", file);
    form.append("client_requirement_id", clientRequirementId);
    try {
      const r = await fetch(`${API}/candidates/upload`, { method: "POST", body: form });
      const data = await r.json();
      if (!r.ok) return { success: false, error: data?.detail || "Upload failed" };
      return data;
    } catch (e) { return { success: false, error: e.message }; }
  },
  getJDs: async () => {
    try { const r = await fetch(`${API}/client-requirements`); return await r.json(); }
    catch { return []; }
  },
  createJD: async (payload) => {
    try {
      const r = await fetch(`${API}/client-requirements`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      return await r.json();
    } catch (e) { return { error: e.message }; }
  },
  deleteJD: async (id) => {
    try { const r = await fetch(`${API}/client-requirements/${id}`, { method: "DELETE" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  analyze: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/analyze`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  approve: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/approve`, { method: "PUT" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  ollamaStatus: async () => {
    try { const r = await fetch(`${API}/candidates/system/ollama-status`); return await r.json(); }
    catch { return { online: false }; }
  },
  updateResume: async (id, text) => {
    const form = new FormData(); form.append("improved_text", text);
    try { const r = await fetch(`${API}/candidates/${id}/update`, { method: "PUT", body: form }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  generateJDAligned: async (id) => {
    try { const r = await fetch(`${API}/candidates/${id}/generate-jd-aligned-resume`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  saveManualResume: async (id, text) => {
    const form = new FormData(); form.append("manual_text", text);
    try { const r = await fetch(`${API}/candidates/${id}/manual-resume`, { method: "PUT", body: form }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  downloadResume: (id) => { window.open(`${API}/candidates/${id}/download-resume`, '_blank'); },
  getJDAligned: async () => {
    try { const r = await fetch(`${API}/candidates/list/jd-aligned`); const d = await r.json(); return d.data || []; } catch { return []; }
  },
  getSettings: async () => {
    try { const r = await fetch(`${API}/settings/`); return await r.json(); } catch { return { success: false }; }
  },
  saveSettings: async (payload) => {
    try { const r = await fetch(`${API}/settings/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); return await r.json(); }
    catch (e) { return { success: false, error: e.message }; }
  },
  testConnection: async () => {
    try { const r = await fetch(`${API}/settings/test`, { method: "POST" }); return await r.json(); }
    catch (e) { return { success: false, message: e.message }; }
  },
};

const Badge = ({ label, color = C.teal, bg = C.tealSoft }) => (
  <span style={{ fontSize: 11, fontWeight: 700, color, background: bg, padding: "2px 10px", borderRadius: 20, whiteSpace: "nowrap" }}>{label}</span>
);

const Avatar = ({ initials, size = 36 }) => (
  <div style={{ width: size, height: size, borderRadius: "50%", background: "linear-gradient(135deg, #e63946, #c1121f)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: size * 0.33, fontFamily: font.head, fontWeight: 700, flexShrink: 0 }}>{initials}</div>
);

const Btn = ({ children, onClick, variant = "primary", small, full, disabled }) => {
  const styles = {
    primary: { background: C.accent, color: "#fff", border: "none" },
    outline: { background: "transparent", color: C.accent, border: `1px solid ${C.accent}` },
    ghost: { background: "transparent", color: C.muted, border: `1px solid ${C.border}` },
    success: { background: C.teal, color: "#fff", border: "none" },
    warn: { background: C.gold, color: C.text, border: "none" },
  };
  const s = styles[variant] || styles.primary;
  return (
    <button onClick={onClick} disabled={disabled} style={{ ...s, padding: small ? "6px 12px" : "9px 18px", borderRadius: 6, cursor: disabled ? "not-allowed" : "pointer", fontSize: small ? 11 : 13, fontFamily: font.body, fontWeight: 600, width: full ? "100%" : "auto", opacity: disabled ? 0.5 : 1 }}>{children}</button>
  );
};

const StatCard = ({ label, value, sub, color = C.accent }) => (
  <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "18px 22px", flex: 1, minWidth: 130 }}>
    <div style={{ fontSize: 28, fontFamily: font.head, fontWeight: 700, color }}>{value}</div>
    <div style={{ fontSize: 13, color: C.text, fontWeight: 600, marginTop: 2 }}>{label}</div>
    {sub && <div style={{ fontSize: 11, color: C.muted, marginTop: 3 }}>{sub}</div>}
  </div>
);

const navItems = [
  { id: "dashboard", icon: "⬛", label: "Dashboard" },
  { id: "jdmanager", icon: "📋", label: "JD Manager" },
  { id: "upload", icon: "⬆", label: "Upload Resume" },
  { id: "listing", icon: "☰", label: "Candidate List" },
  { id: "review", icon: "⊞", label: "Review Resume" },
  { id: "jdalign", icon: "🎯", label: "JD Alignment" },
  { id: "jdalignlist", icon: "📊", label: "Aligned Resumes" },
  { id: "pipeline", icon: "⚙", label: "Pipeline Status" },
  { id: "settings", icon: "◎", label: "Settings" },
];

function Sidebar({ active, setPage, ollamaOnline, ollamaProvider }) {
  return (
    <div style={{ width: 220, background: C.sidebar, display: "flex", flexDirection: "column", height: "100vh", position: "fixed", left: 0, top: 0, zIndex: 100 }}>
      <div style={{ padding: "24px 20px 20px", borderBottom: "1px solid rgba(255,255,255,0.07)" }}>
        <div style={{ fontSize: 17, fontFamily: font.head, color: "#fff", fontWeight: 700 }}><span style={{ color: C.accent }}>CMS</span> Resume AI</div>
        <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)", marginTop: 3, letterSpacing: "0.12em" }}>HR MANAGEMENT PORTAL</div>
      </div>
      <nav style={{ flex: 1, padding: "12px 0" }}>
        {navItems.map(item => (
          <div key={item.id} onClick={() => setPage(item.id)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 20px", cursor: "pointer", background: active === item.id ? "rgba(230,57,70,0.18)" : "transparent", borderLeft: active === item.id ? `3px solid ${C.accent}` : "3px solid transparent" }}>
            <span style={{ fontSize: 14, opacity: active === item.id ? 1 : 0.45 }}>{item.icon}</span>
            <span style={{ fontSize: 13, color: active === item.id ? "#fff" : "rgba(255,255,255,0.5)", fontWeight: active === item.id ? 600 : 400 }}>{item.label}</span>
          </div>
        ))}
      </nav>
      <div style={{ padding: "12px 20px", borderTop: "1px solid rgba(255,255,255,0.07)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: ollamaOnline ? "#4ade80" : "#ef4444" }} />
          <span style={{ fontSize: 11, color: "rgba(255,255,255,0.5)" }}>
            {(() => {
              const label = ollamaProvider === "gemini" ? "Gemini ✦" : ollamaProvider === "azure" ? "Azure OpenAI ☁" : "Ollama";
              return ollamaOnline ? `${label} Online` : `${label} Offline`;
            })()}
          </span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <Avatar initials="HR" size={32} />
          <div><div style={{ fontSize: 12, color: "#fff", fontWeight: 600 }}>Head HR</div><div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)" }}>hr@company.com</div></div>
        </div>
      </div>
    </div>
  );
}

function Topbar({ title, sub, setPage }) {
  return (
    <div style={{ height: 60, background: C.card, borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 28px", position: "sticky", top: 0, zIndex: 50 }}>
      <div>
        <div style={{ fontSize: 16, fontFamily: font.head, fontWeight: 700, color: C.text }}>{title}</div>
        {sub && <div style={{ fontSize: 11, color: C.muted, marginTop: 1 }}>{sub}</div>}
      </div>
      <Btn onClick={() => setPage("upload")} small>+ Upload Resume</Btn>
    </div>
  );
}

function PageDashboard({ setPage }) {
  const [candidates, setCandidates] = useState([]);
  useEffect(() => { api.getCandidates().then(setCandidates); }, []);
  const total = candidates.length;
  const pending = candidates.filter(c => c.status === "Pending Review" || c.status === "Uploaded").length;
  const analyzed = candidates.filter(c => c.status === "Bot Analyzed").length;
  const approved = candidates.filter(c => c.status === "Approved").length;
  return (
    <div>
      <Topbar title="Dashboard" sub="Overview of all candidate activity" setPage={setPage} />
      <div style={{ padding: 28 }}>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 28 }}>
          <StatCard label="Total Candidates" value={total} color={C.accent} />
          <StatCard label="Pending Review" value={pending} color={C.gold} />
          <StatCard label="Bot Analyzed" value={analyzed} color={C.teal} />
          <StatCard label="Approved" value={approved} color="#2a9d8f" />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20 }}>
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
            <div style={{ padding: "16px 20px", borderBottom: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700 }}>Recent Candidates</div>
              <Btn onClick={() => setPage("listing")} variant="ghost" small>View All →</Btn>
            </div>
            {candidates.length === 0 && <div style={{ padding: 28, textAlign: "center", color: C.muted, fontSize: 13 }}>No candidates yet. Upload a resume to get started!</div>}
            {candidates.slice(0, 5).map((c, i) => (
              <div key={c.id} onClick={() => setPage("review")} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 20px", borderBottom: i < 4 ? `1px solid ${C.border}` : "none", cursor: "pointer" }}>
                <Avatar initials={(c.name || "??").slice(0, 2).toUpperCase()} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.name || "Unknown"}</div>
                  <div style={{ fontSize: 11, color: C.muted }}>{c.company_name || "N/A"}</div>
                </div>
                <Badge label={c.status} color={c.status === "Approved" ? C.teal : c.status === "Bot Analyzed" ? "#7c6af7" : C.gold} bg={c.status === "Approved" ? C.tealSoft : c.status === "Bot Analyzed" ? "#eeecff" : C.goldSoft} />
                <div style={{ fontSize: 13, fontWeight: 700, color: c.score >= 80 ? C.teal : c.score >= 70 ? C.gold : C.accent, minWidth: 36, textAlign: "right" }}>{c.score || 0}%</div>
              </div>
            ))}
          </div>
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 20 }}>
            <div style={{ fontSize: 13, fontFamily: font.head, fontWeight: 700, marginBottom: 14 }}>Quick Actions</div>
            {[
              { label: "Upload New Resume", icon: "⬆", page: "upload" },
              { label: "View Candidate List", icon: "☰", page: "listing" },
              { label: "Review Resume", icon: "⊞", page: "review" },
              { label: "JD Alignment Editor", icon: "🎯", page: "jdalign" },
              { label: "Aligned Resumes", icon: "📊", page: "jdalignlist" },
              { label: "Pipeline Status", icon: "⚙", page: "pipeline" },
            ].map(a => (
              <div key={a.label} onClick={() => setPage(a.page)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", background: C.bg, borderRadius: 7, cursor: "pointer", marginBottom: 8 }}>
                <span>{a.icon}</span><span style={{ fontSize: 12, color: C.text, fontWeight: 500 }}>{a.label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function PageUpload({ setPage, setSelectedId }) {
  const [file, setFile] = useState(null);
  const [jds, setJds] = useState([]);
  const [selectedJD, setSelectedJD] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [checked, setChecked] = useState({ image: false, email: false, mobile: false, summary: false });

  useEffect(() => { api.getJDs().then(setJds); }, []);

  const selectedJDObj = jds.find(j => j.id === Number(selectedJD));

  const handleUpload = async () => {
    if (!file) { alert("Please select a PDF resume."); return; }
    if (!selectedJD) { alert("Please select a Job Description. Go to JD Manager to create one first."); return; }
    setLoading(true);
    const res = await api.uploadResume(file, Number(selectedJD));
    setLoading(false);
    if (res.success) {
      setResult(res);
      const ext = res.extracted || {};
      setChecked({ image: false, email: !!ext.email, mobile: !!ext.mobile, summary: !!ext.summary });
      if (setSelectedId) setSelectedId(res.candidate_id);
    } else { alert("Upload failed: " + (res.error || "Unknown error")); }
  };

  return (
    <div>
      <Topbar title="Upload Resume" sub="Upload candidate PDF and select a Job Description" setPage={setPage} />
      <div style={{ padding: 28, maxWidth: 860 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 24 }}>
            <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700, marginBottom: 16 }}>Candidate Resume (PDF)</div>
            <label style={{ display: "block", border: `2px dashed ${file ? C.teal : C.border}`, borderRadius: 10, padding: "32px 20px", textAlign: "center", background: file ? C.tealSoft : C.bg, cursor: "pointer" }}>
              <div style={{ fontSize: 36, marginBottom: 10 }}>📄</div>
              <div style={{ fontSize: 13, color: C.muted }}>Click to upload PDF</div>
              {file && <div style={{ marginTop: 10, color: C.teal, fontSize: 12, fontWeight: 600 }}>✓ {file.name}</div>}
              <input type="file" accept=".pdf" style={{ display: "none" }} onChange={e => setFile(e.target.files[0])} />
            </label>
          </div>
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 24 }}>
            <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700, marginBottom: 16 }}>Select Job Description</div>
            {jds.length === 0 ? (
              <div style={{ background: C.goldSoft, border: `1px solid ${C.gold}`, borderRadius: 8, padding: 14, fontSize: 12, color: C.text }}>
                No JDs found. <span style={{ color: C.accent, cursor: "pointer", fontWeight: 700 }} onClick={() => setPage("jdmanager")}>Go to JD Manager →</span> to create one first.
              </div>
            ) : (
              <>
                <select value={selectedJD} onChange={e => setSelectedJD(e.target.value)} style={{ display: "block", width: "100%", padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg, marginBottom: 12 }}>
                  <option value="">-- Select JD --</option>
                  {jds.map(jd => (
                    <option key={jd.id} value={jd.id}>{jd.client_name} — {jd.job_title}</option>
                  ))}
                </select>
                {selectedJDObj && (
                  <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 6, padding: 10, fontSize: 11, color: C.muted, maxHeight: 100, overflowY: "auto", fontFamily: font.mono, whiteSpace: "pre-wrap" }}>
                    {selectedJDObj.jd_text.slice(0, 300)}{selectedJDObj.jd_text.length > 300 ? "..." : ""}
                  </div>
                )}
              </>
            )}
          </div>
        </div>

        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 20, marginBottom: 20 }}>
          <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700, marginBottom: 14 }}>After Upload → Cross Check</div>
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            {[{ key: "image", label: "Profile Image", icon: "🖼" }, { key: "email", label: "Email ID", icon: "📧" }, { key: "mobile", label: "Mobile No", icon: "📱" }, { key: "summary", label: "Summary", icon: "📝" }].map(item => (
              <div key={item.key} style={{ display: "flex", alignItems: "center", gap: 8, background: checked[item.key] ? C.tealSoft : C.bg, border: `1px solid ${checked[item.key] ? C.teal : C.border}`, borderRadius: 8, padding: "10px 16px", transition: "all 0.3s" }}>
                <span style={{ fontSize: 16 }}>{item.icon}</span>
                <span style={{ fontSize: 12, color: checked[item.key] ? C.teal : C.muted, fontWeight: checked[item.key] ? 600 : 400 }}>{checked[item.key] ? "✓ " : ""}{item.label}</span>
              </div>
            ))}
          </div>
        </div>

        {result && result.success && (
          <div style={{ background: C.tealSoft, border: `1px solid ${C.teal}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.teal, marginBottom: 8 }}>✅ Resume Uploaded Successfully!</div>
            <div style={{ fontSize: 12, color: C.text, lineHeight: 1.8 }}>
              <div><strong>Name:</strong> {result.extracted?.name || "Not detected"}</div>
              <div><strong>Email:</strong> {result.extracted?.email || "Not detected"}</div>
              <div><strong>Mobile:</strong> {result.extracted?.mobile || "Not detected"}</div>
              <div><strong>Location:</strong> {result.extracted?.location || "Not detected"}</div>
              <div style={{ marginTop: 8 }}>Go to <span style={{ color: C.accent, cursor: "pointer", fontWeight: 700 }} onClick={() => setPage("listing")}>Candidate List</span> to run AI analysis!</div>
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <Btn onClick={handleUpload} disabled={loading}>{loading ? "Uploading..." : "🚀 Upload & Run Pipeline"}</Btn>
          <Btn variant="ghost" onClick={() => setPage("dashboard")}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}

function PageListing({ setPage, setSelectedId }) {
  const [candidates, setCandidates] = useState([]);
  const [filter, setFilter] = useState("All");
  const [analyzing, setAnalyzing] = useState(null);
  useEffect(() => { api.getCandidates().then(setCandidates); }, []);
  const statuses = ["All", "Uploaded", "Pending Review", "Bot Analyzed", "Approved"];
  const filtered = filter === "All" ? candidates : candidates.filter(c => c.status === filter);
  const runAnalysis = async (id) => {
    setAnalyzing(id);
    const res = await api.analyze(id);
    setAnalyzing(null);
    if (res.success) { alert("✅ AI Analysis complete!"); api.getCandidates().then(setCandidates); }
    else alert("Analysis failed: " + (res.detail || res.error || "Error"));
  };
  return (
    <div>
      <Topbar title="Candidate List" sub="All uploaded resumes and AI analysis status" setPage={setPage} />
      <div style={{ padding: 28 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          {statuses.map(s => (
            <button key={s} onClick={() => setFilter(s)} style={{ padding: "6px 16px", borderRadius: 20, cursor: "pointer", border: filter === s ? `1px solid ${C.accent}` : `1px solid ${C.border}`, background: filter === s ? C.accentSoft : "transparent", color: filter === s ? C.accent : C.muted, fontSize: 12, fontWeight: 600 }}>{s}</button>
          ))}
        </div>
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
          <div style={{ display: "grid", gridTemplateColumns: "2fr 1.5fr 0.8fr 0.8fr 1fr 0.6fr 1.2fr", padding: "10px 20px", background: C.bg, borderBottom: `1px solid ${C.border}` }}>
            {["Candidate", "Company", "Tech Score", "Match", "Status", "AI", "Actions"].map(h => (
              <div key={h} style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>{h}</div>
            ))}
          </div>
          {filtered.length === 0 && <div style={{ padding: 28, textAlign: "center", color: C.muted, fontSize: 13 }}>No candidates found.</div>}
          {filtered.map((c, i) => (
            <div key={c.id} style={{ display: "grid", gridTemplateColumns: "2fr 1.5fr 0.8fr 0.8fr 1fr 0.6fr 1.2fr", padding: "12px 20px", borderBottom: i < filtered.length - 1 ? `1px solid ${C.border}` : "none", alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Avatar initials={(c.name || "??").slice(0, 2).toUpperCase()} size={30} />
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{c.name || "Unknown"}</div>

    </div>
  );
}

// ── Resume section parser (client-side) ──────────────────────────────────────
function parseSections(text) {
  if (!text) return [];
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];

  // ━━━ structured format
  if ((text.match(/━/g) || []).length > 10) {
    const nameMap = {
      "PROFESSIONAL SUMMARY": "Summary",
      "TECHNICAL SKILLS": "Skills",
      "WORK EXPERIENCE": "Work Experience",
      "PROJECT SUMMARY": "Projects",
      "EDUCATION": "Education",
      "CERTIFICATIONS": "Certifications",
    };
    const parts = text.split(/━{5,}/).map(p => p.trim()).filter(Boolean);
    const found = {};
    for (let i = 0; i < parts.length; i++) {
      const label = nameMap[parts[i].toUpperCase()];
      if (label && i + 1 < parts.length) found[label] = parts[i + 1];
    }
    return ORDER.filter(k => found[k]).map(k => ({ label: k, content: found[k] }));
  }

  // Plain keyword fallback
  const kwMap = {
    "summary": "Summary", "professional summary": "Summary",
    "objective": "Summary", "profile": "Summary", "about me": "Summary",
    "skills": "Skills", "technical skills": "Skills",
    "key skills": "Skills", "core competencies": "Skills", "expertise": "Skills",
    "experience": "Work Experience", "work experience": "Work Experience",
    "professional experience": "Work Experience", "employment": "Work Experience",
    "project": "Projects", "project summary": "Projects", "projects": "Projects",
    "education": "Education", "academic": "Education", "qualification": "Education",
    "certif": "Certifications", "certification": "Certifications",
    "achievement": "Certifications",
  };
  const lines = text.split("\n");
  let current = null;
  const buf = {};
  for (const line of lines) {
    const s = line.trim();
    const lo = s.toLowerCase();
    let matched = null;
    for (const [kw, lbl] of Object.entries(kwMap)) {
      if (lo.startsWith(kw) && s.length < 65) { matched = lbl; break; }
    }
    if (matched) { current = matched; buf[current] = buf[current] || []; }
    else if (current && s) buf[current].push(s);
  }
  return ORDER.filter(k => buf[k]?.length).map(k => ({ label: k, content: buf[k].join("\n") }));
}

function sectionBadge(before, after) {
  if (!after && !before) return null;
  if (!after || after.trim() === (before || "").trim()) return { label: "unchanged", color: C.muted, bg: "#f0f0ee" };
  const bWords = new Set((before || "").toLowerCase().split(/\s+/).filter(Boolean));
  const aWords = new Set(after.toLowerCase().split(/\s+/).filter(Boolean));
  const common = [...bWords].filter(w => aWords.has(w)).length;
  const sim = bWords.size ? common / Math.max(bWords.size, aWords.size) : 0;
  if (aWords.size > bWords.size * 1.25) return { label: "expanded", color: "#7c6af7", bg: "#eeecff" };
  if (sim < 0.65) return { label: "improved", color: C.teal, bg: C.tealSoft };
  return { label: "updated", color: C.gold, bg: C.goldSoft };
}

function SectionDiff({ beforeText, afterText }) {
  const beforeSecs = parseSections(beforeText);
  const afterSecs  = parseSections(afterText);

  const allLabels = [...new Set([...beforeSecs.map(s => s.label), ...afterSecs.map(s => s.label)])];
  const ORDER = ["Summary","Skills","Work Experience","Projects","Education","Certifications"];
  const labels = [...ORDER.filter(l => allLabels.includes(l)), ...allLabels.filter(l => !ORDER.includes(l))];

  const bMap = Object.fromEntries(beforeSecs.map(s => [s.label, s.content]));
  const aMap = Object.fromEntries(afterSecs.map(s => [s.label, s.content]));

  const noAfter = !afterText || afterText.trim().length < 10;

  const colStyle = (tint) => ({
    flex: 1, minWidth: 0, background: tint, border: `1px solid ${C.border}`,
    borderRadius: 10, overflow: "hidden",
  });
  const hdrStyle = (color) => ({
    padding: "12px 18px", borderBottom: `1px solid ${C.border}`,
    fontSize: 11, fontWeight: 700, letterSpacing: "0.1em",
    textTransform: "uppercase", color, background: "rgba(0,0,0,0.03)",
  });

  return (
    <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
      {/* BEFORE column */}
      <div style={colStyle("#ffffff")}>
        <div style={hdrStyle(C.muted)}>Before (Original)</div>
        {labels.map((label, i) => {
          const content = bMap[label] || "";
          return (
            <div key={label} style={{ borderBottom: i < labels.length - 1 ? `1px solid ${C.border}` : "none" }}>
              <div style={{ padding: "10px 18px 4px", fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>
                {label}
              </div>
              <div style={{ padding: "0 18px 14px", fontSize: 12, color: content ? C.text : C.muted, lineHeight: 1.7, whiteSpace: "pre-wrap", fontFamily: font.body }}>
                {content || <em style={{ opacity: 0.4 }}>—</em>}
              </div>
            </div>
          );
        })}
      </div>

      {/* AFTER column */}
      <div style={colStyle("#f5fffe")}>
        <div style={hdrStyle(C.teal)}>After (AI Improved)</div>
        {noAfter ? (
          <div style={{ padding: 40, textAlign: "center", color: C.muted }}>
            <div style={{ fontSize: 28, marginBottom: 10 }}>🤖</div>
            <div style={{ fontSize: 13 }}>Click <strong>▶ Run AI</strong> to generate improvements</div>
          </div>
        ) : labels.map((label, i) => {
          const before  = bMap[label] || "";
          const after   = aMap[label] || "";
          const badge   = sectionBadge(before, after);
          return (
            <div key={label} style={{ borderBottom: i < labels.length - 1 ? `1px solid ${C.border}` : "none" }}>
              <div style={{ padding: "10px 18px 4px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>{label}</span>
                {badge && (
                  <span style={{ fontSize: 10, fontWeight: 700, color: badge.color, background: badge.bg, padding: "2px 10px", borderRadius: 20 }}>
                    {badge.label}
                  </span>
                )}
              </div>
              <div style={{ padding: "0 18px 14px", fontSize: 12, color: after ? C.text : C.muted, lineHeight: 1.7, whiteSpace: "pre-wrap", fontFamily: font.body, background: badge && badge.label !== "unchanged" ? `${badge.bg}55` : "transparent", borderRadius: 6, margin: "0 8px 6px" }}>
                {after || before || <em style={{ opacity: 0.4 }}>—</em>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ResumePreview({ text }) {
  const sections = parseSections(text || "");

  // Extract header lines (name, role, contact) before first real section
  const headerLines = [];
  for (const line of (text || "").split("\n").slice(0, 12)) {
    const s = line.trim();
    if (!s || s.match(/━{3,}/)) continue;
    const up = s.toUpperCase();
    if (["PROFESSIONAL SUMMARY","TECHNICAL SKILLS","WORK EXPERIENCE","PROJECT SUMMARY","EDUCATION","CERTIFICATIONS"].includes(up)) break;
    headerLines.push(s);
  }

  if (!text || (!sections.length && !headerLines.length)) {
    return <div style={{ padding: 24, color: C.muted, fontSize: 12, textAlign: "center" }}>No content to preview.</div>;
  }

  const sectionIcons = { Summary: "📝", Skills: "⚡", "Work Experience": "💼", Projects: "🚀", Education: "🎓", Certifications: "🏆" };

  return (
    <div style={{ padding: "16px 20px", overflowY: "auto", maxHeight: 700 }}>
      {headerLines.length > 0 && (
        <div style={{ textAlign: "center", marginBottom: 18, paddingBottom: 14, borderBottom: `2px solid ${C.teal}44` }}>
          {headerLines[0] && <div style={{ fontSize: 17, fontWeight: 700, color: C.sidebar, fontFamily: font.head, marginBottom: 3 }}>{headerLines[0]}</div>}
          {headerLines[1] && !headerLines[1].includes("@") && !headerLines[1].match(/\d{8,}/) && (
            <div style={{ fontSize: 12, color: C.accent, fontWeight: 600, marginBottom: 4 }}>{headerLines[1]}</div>
          )}
          {headerLines.slice(1).filter(l => l.includes("@") || l.includes("📧") || l.includes("📱") || l.includes("📍") || l.includes("linkedin")).map((l, i) => (
            <div key={i} style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{l}</div>
          ))}
        </div>
      )}
      {sections.map((sec) => (
        <div key={sec.label} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6, paddingBottom: 5, borderBottom: `1px solid ${C.border}` }}>
            <span style={{ fontSize: 13 }}>{sectionIcons[sec.label] || "📌"}</span>
            <span style={{ fontSize: 10, fontWeight: 700, color: C.teal, letterSpacing: "0.12em", textTransform: "uppercase" }}>{sec.label}</span>
          </div>
          <div style={{ fontSize: 12, color: C.text, lineHeight: 1.8, whiteSpace: "pre-wrap", fontFamily: font.body }}>
            {sec.content.split("\n").map((line, i) => {
              const s = line.trim();
              if (!s) return null;
              const isBullet = /^[-•◦◆▪*]/.test(s);
              const isDraft  = s.startsWith("[DRAFT");
              return (
                <div key={i} style={{ display: "flex", gap: 8, marginBottom: isBullet ? 3 : 5, color: isDraft ? C.gold : C.text }}>
                  {isBullet && <span style={{ color: C.teal, flexShrink: 0, marginTop: 1 }}>•</span>}
                  <span style={{ fontWeight: isDraft ? 600 : 400, fontStyle: isDraft ? "italic" : "normal" }}>
                    {isBullet ? s.replace(/^[-•◦◆▪*]\s*/, "") : s}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

      // Refresh candidate to get updated history
      const updated = await api.getCandidate(candidate.id);
      setCandidate(updated);
    } else alert("Generation failed: " + (res.error || "Error"));
  };

  const handleSave = async () => {
    if (!candidate || !draftText) return;
    setSaving(true);
    const res = await api.saveManualResume(candidate.id, draftText);
    setSaving(false);
    if (res.success) alert("✅ JD-Aligned resume saved! Click ⬇ Download to get Word doc.");

          <select onChange={e => loadCandidate(Number(e.target.value))} value={candidate?.id || ""} style={{ padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.card, color: C.text }}>

                <div>

                    {candidate.score > 0 ? `Tech Score: ${candidate.score}%` : "Not yet analyzed"} · {candidate.company_name || ""} · {candidate.status}

                  {candidate.match_level && <Badge label={`${candidate.match_level} Match`} color={candidate.match_level === "High" ? C.teal : C.gold} bg={candidate.match_level === "High" ? C.tealSoft : C.goldSoft} />}

                <Btn onClick={handleSave} variant="success" disabled={saving || !draftText}>{saving ? "Saving..." : "💾 Save Draft"}</Btn>

            {candidate.gaps?.length > 0 && (() => {
              const mustHave   = (candidate.gaps||[]).filter(g=>g.startsWith("[MUST HAVE]")).map(g=>g.replace("[MUST HAVE] ",""));
              const niceToHave = (candidate.gaps||[]).filter(g=>g.startsWith("[NICE TO HAVE]")).map(g=>g.replace("[NICE TO HAVE] ",""));
              const legacy     = (candidate.gaps||[]).filter(g=>!g.startsWith("["));
              return (
                <div style={{ marginBottom: 16 }}>
                  {mustHave.length > 0 && (
                    <div style={{ background: "#fff1f1", border: "1px solid #ef444444", borderRadius: 10, padding: 14, marginBottom: 8 }}>

                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>

                  {niceToHave.length > 0 && (
                    <div style={{ background: C.goldSoft, border: `1px solid ${C.gold}`, borderRadius: 10, padding: 14, marginBottom: 8 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: "#b45309", marginBottom: 8 }}>💡 NICE TO HAVE — Strengthens profile ({niceToHave.length})</div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {niceToHave.map((g,i) => <Badge key={i} label={g} color="#b45309" bg="#fef3c7" />)}
                      </div>

                    <div style={{ background: C.accentSoft, border: `1px solid ${C.accent}44`, borderRadius: 10, padding: 14 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 8 }}>⚠ Gaps — will be injected into draft</div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {legacy.map((g,i) => <Badge key={i} label={g} color={C.accent} bg="#fff" />)}
                      </div>
                    </div>

            })()}

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>

              {/* ── LEFT: Original Resume — structured preview ── */}
              <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
                <div style={{ padding: "10px 16px", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>

                  <Badge label="Read Only" color={C.muted} bg={C.bg} />

                <ResumePreview text={candidate.original_resume_text || ""} />

              {/* ── RIGHT: JD-Aligned Draft — edit + preview toggle ── */}
              <div style={{ background: C.card, border: `1px solid ${C.teal}44`, borderRadius: 10, overflow: "hidden" }}>
                <div style={{ padding: "8px 16px", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 11, color: C.teal, fontWeight: 700, letterSpacing: "0.08em" }}>JD-ALIGNED DRAFT</span>
                  <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                    {generated && <Badge label="✓ Draft Ready" color={C.teal} bg={C.tealSoft} />}
                    {draftText && (
                      <div style={{ display: "flex", background: C.bg, borderRadius: 6, border: `1px solid ${C.border}`, overflow: "hidden", marginLeft: 8 }}>
                        {[{ id: "edit", label: "✏ Edit" }, { id: "preview", label: "👁 Preview" }].map(v => (

                    )}

                </div>

                {!draftText && !generating && (
                  <div style={{ padding: 40, textAlign: "center", color: C.muted }}>
                    <div style={{ fontSize: 36, marginBottom: 12 }}>🧠</div>
                    <div style={{ fontSize: 14, marginBottom: 6, fontWeight: 600 }}>Click Generate JD Draft above</div>
                    <div style={{ fontSize: 12 }}>AI will align the resume to the Job Description</div>
                  </div>
                )}

                {generating && (
                  <div style={{ padding: 40, textAlign: "center", color: C.muted }}>
                    <div style={{ fontSize: 36, marginBottom: 12 }}>⏳</div>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>Generating JD-aligned resume...</div>
                    <div style={{ fontSize: 12, marginTop: 8 }}>This may take 2–3 minutes with local LLM</div>

                )}

                  <textarea value={draftText} onChange={e => setDraftText(e.target.value)}
                    style={{ width: "100%", height: 700, padding: "12px 16px", border: "none", fontSize: 11, fontFamily: font.mono, background: "#f7fffe", resize: "vertical", outline: "none", lineHeight: 1.7 }} />
                )}

                {draftText && !generating && draftView === "preview" && (
                  <ResumePreview text={draftText} />
                )}
              </div>
            </div>

            <div style={{ background: C.sidebar, borderRadius: 10, padding: 20, marginTop: 16 }}>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 12 }}>📋 Word Doc Resume Format — Sections included in download</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10 }}>
                {[
                  { icon: "👤", label: "Candidate Name" },
                  { icon: "📧", label: "Contact Details" },
                  { icon: "📍", label: "Location" },
                  { icon: "🔗", label: "LinkedIn" },
                  { icon: "📝", label: "Professional Summary" },
                  { icon: "⚡", label: "Technical Skills" },
                  { icon: "💼", label: "Work Experience" },
                  { icon: "🚀", label: "Project Summary" },
                  { icon: "🎓", label: "Education Details" },
                  { icon: "🏆", label: "Certifications" },
                  { icon: "📌", label: "Version Label" },
                  { icon: "✅", label: "HR Reviewed" },
                ].map((s, i) => (
                  <div key={i} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 8, padding: "10px 14px", display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 16 }}>{s.icon}</span>
                    <span style={{ fontSize: 11, color: "#fff" }}>{s.label}</span>
                  </div>
                ))}
              </div>

          </>
        )}

        {!candidate && candidates.length === 0 && (
          <div style={{ textAlign: "center", padding: 60, color: C.muted }}>
            No candidates yet. <span style={{ color: C.accent, cursor: "pointer" }} onClick={() => setPage("upload")}>Upload a resume</span> to get started!

      </div>
    </div>
  );
}

function PageSettings({ setPage, onSave }) {
  const [cfg, setCfg] = useState(null);
  const [provider, setProvider] = useState("ollama");
  const [ollamaUrl, setOllamaUrl] = useState("http://localhost:11434");
  const [ollamaModel, setOllamaModel] = useState("qwen2.5:0.5b");
  const [geminiKey, setGeminiKey] = useState("");
  const [geminiModel, setGeminiModel] = useState("gemini-1.5-flash");
  const [azureEndpoint, setAzureEndpoint] = useState("");
  const [azureKey, setAzureKey] = useState("");
  const [azureDeployment, setAzureDeployment] = useState("gpt-4o");
  const [azureApiVersion, setAzureApiVersion] = useState("2024-08-01-preview");
  const [saving, setSaving] = useState(false);
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);
  const [showGeminiKey, setShowGeminiKey] = useState(false);
  const [showAzureKey, setShowAzureKey] = useState(false);

  const loadSettings = () => api.getSettings().then(res => {
    if (res.success && res.data) {
      const d = res.data;
      setProvider(d.provider || "ollama");
      setOllamaUrl(d.ollama_url || "http://localhost:11434");
      setOllamaModel(d.ollama_model || "qwen2.5:0.5b");
      setGeminiModel(d.gemini_model || "gemini-1.5-flash");
      setAzureEndpoint(d.azure_endpoint || "");
      setAzureDeployment(d.azure_deployment || "gpt-4o");
      setAzureApiVersion(d.azure_api_version || "2024-08-01-preview");
      setCfg(d);
    }
  });

  useEffect(() => { loadSettings(); }, []);

  // Auto-save provider selection immediately when card is clicked
  const switchProvider = async (id) => {
    setProvider(id);
    setTestResult(null);
    await api.saveSettings({ provider: id });
    if (onSave) onSave();
  };

  const handleSave = async () => {
    setSaving(true); setTestResult(null);
    const payload = {
      provider,
      ollama_url: ollamaUrl, ollama_model: ollamaModel,
      gemini_model: geminiModel,
      azure_endpoint: azureEndpoint, azure_deployment: azureDeployment, azure_api_version: azureApiVersion,
    };
    if (geminiKey.trim()) payload.gemini_api_key = geminiKey.trim();
    if (azureKey.trim())  payload.azure_api_key  = azureKey.trim();
    const res = await api.saveSettings(payload);
    setSaving(false);
    if (res.success) {
      setGeminiKey(""); setAzureKey("");
      await loadSettings();
      if (onSave) onSave();
    } else alert("Failed to save: " + (res.error || "Error"));
  };

  const handleTest = async () => {
    setTesting(true); setTestResult(null);
    const res = await api.testConnection();
    setTesting(false);
    setTestResult(res);
  };

  const inp = (val, set, ph, type="text") => (
    <input type={type} value={val} onChange={e => set(e.target.value)} placeholder={ph}
      style={{ display: "block", width: "100%", marginTop: 4, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.mono, background: C.bg }} />
  );

  const KeyField = ({ value, onChange, masked, show, setShow, placeholder }) => (
    <div>
      {masked && !value && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, fontSize: 12, color: C.teal }}>
          <span style={{ background: C.tealSoft, border: `1px solid ${C.teal}`, borderRadius: 20, padding: "2px 10px", fontWeight: 600 }}>🔑 Key saved: {masked}</span>
          <span style={{ color: C.muted }}>— leave blank to keep, or enter new key below</span>
        </div>
      )}
      <div style={{ display: "flex", gap: 8 }}>
        <input type={show ? "text" : "password"} value={value} onChange={e => onChange(e.target.value)}
          placeholder={masked ? "Enter new key to replace..." : (placeholder || "Paste key here...")}
          style={{ flex: 1, padding: "9px 12px", border: `1px solid ${value ? C.teal : C.border}`, borderRadius: 6, fontSize: 13, fontFamily: font.mono, background: C.bg }} />
        <button onClick={() => setShow(!show)} style={{ padding: "9px 14px", border: `1px solid ${C.border}`, borderRadius: 6, cursor: "pointer", background: C.bg, fontSize: 12 }}>{show ? "🙈" : "👁"}</button>
      </div>
    </div>
  );

  const ProviderCard = ({ id, icon, title, sub, active }) => (
    <div onClick={() => switchProvider(id)} style={{ flex: 1, border: `2px solid ${active ? C.teal : C.border}`, borderRadius: 10, padding: "16px 20px", cursor: "pointer", background: active ? C.tealSoft : C.card, transition: "all 0.2s" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
        <span style={{ fontSize: 24 }}>{icon}</span>
        <div>
          <div style={{ fontSize: 14, fontWeight: 700, color: active ? C.teal : C.text }}>{title}</div>
          <div style={{ fontSize: 11, color: C.muted }}>{sub}</div>
        </div>
        {active && <span style={{ marginLeft: "auto", fontSize: 18, color: C.teal }}>✓</span>}
      </div>
    </div>
  );

  return (
    <div>
      <Topbar title="Settings" sub="Configure AI provider, models, and preferences" setPage={setPage} />
      <div style={{ padding: 28, maxWidth: 820 }}>

        {/* Provider selection */}
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 20, overflow: "hidden" }}>
          <div style={{ padding: "14px 20px", borderBottom: `1px solid ${C.border}`, fontSize: 14, fontFamily: font.head, fontWeight: 700 }}>
            🤖 AI Provider
            <span style={{ fontSize: 11, color: C.muted, fontWeight: 400, marginLeft: 10 }}>Click a card to switch — saves instantly</span>
          </div>
          <div style={{ padding: 20 }}>
            <div style={{ display: "flex", gap: 14, marginBottom: 20 }}>
              <ProviderCard id="ollama" icon="🦙" title="Ollama (Local)" sub="Free · Private · Runs on your machine" active={provider === "ollama"} />
              <ProviderCard id="gemini" icon="✦" title="Google Gemini" sub="Cloud API · High quality · Free tier" active={provider === "gemini"} />
              <ProviderCard id="azure" icon="☁" title="Azure OpenAI" sub="GPT-4o · Enterprise · M365 Copilot engine" active={provider === "azure"} />
            </div>

            {provider === "ollama" && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <div>
                  <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Ollama URL</label>
                  {inp(ollamaUrl, setOllamaUrl, "http://localhost:11434")}
                </div>
                <div>
                  <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Model Name</label>
                  {inp(ollamaModel, setOllamaModel, "qwen2.5:0.5b")}
                  <div style={{ fontSize: 10, color: C.muted, marginTop: 4 }}>Examples: qwen2.5:0.5b · llama3.2:3b · mistral:7b · gemma2:2b</div>
                </div>
              </div>
            )}

            {provider === "gemini" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ background: "#fffbea", border: "1px solid #f59e0b", borderRadius: 8, padding: "10px 14px", fontSize: 12, color: "#92400e" }}>
                  ⚠ Keep your API key private. Get a free key at <strong>aistudio.google.com</strong>
                </div>
                <div>
                  <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Gemini API Key</label>
                  <KeyField value={geminiKey} onChange={setGeminiKey} masked={cfg?.gemini_api_key_masked}
                    show={showGeminiKey} setShow={setShowGeminiKey} placeholder="AIza..." />
                </div>
                <div>
                  <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Gemini Model</label>
                  <select value={geminiModel} onChange={e => setGeminiModel(e.target.value)}
                    style={{ display: "block", width: "100%", marginTop: 4, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg }}>
                    <option value="gemini-2.0-flash">gemini-2.0-flash (Fastest · Recommended)</option>
                    <option value="gemini-1.5-flash">gemini-1.5-flash (Fast · Good quality)</option>
                    <option value="gemini-1.5-pro">gemini-1.5-pro (Best quality · Slower)</option>
                    <option value="gemini-2.0-flash-exp">gemini-2.0-flash-exp (Latest experimental)</option>
                  </select>
                  <div style={{ fontSize: 10, color: C.muted, marginTop: 4 }}>Flash models recommended for resume work.</div>
                </div>
              </div>
            )}

            {provider === "azure" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ background: "#eff6ff", border: "1px solid #3b82f6", borderRadius: 8, padding: "10px 14px", fontSize: 12, color: "#1e40af" }}>
                  ☁ Azure OpenAI — same GPT-4o engine as Microsoft 365 Copilot. Requires an Azure subscription with OpenAI access enabled.
                  Get endpoint &amp; key from: <strong>portal.azure.com → Azure OpenAI → Keys and Endpoint</strong>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                  <div>
                    <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Azure Endpoint</label>
                    {inp(azureEndpoint, setAzureEndpoint, "https://YOUR-RESOURCE.openai.azure.com")}
                    <div style={{ fontSize: 10, color: C.muted, marginTop: 4 }}>From Azure portal → Azure OpenAI → Keys and Endpoint</div>
                  </div>
                  <div>
                    <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Deployment Name</label>
                    {inp(azureDeployment, setAzureDeployment, "gpt-4o")}
                    <div style={{ fontSize: 10, color: C.muted, marginTop: 4 }}>The model deployment name you created (e.g. gpt-4o, gpt-4-turbo)</div>
                  </div>
                </div>
                <div>
                  <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>API Key</label>
                  <KeyField value={azureKey} onChange={setAzureKey} masked={cfg?.azure_api_key_masked}
                    show={showAzureKey} setShow={setShowAzureKey} placeholder="Paste Azure OpenAI key..." />
                </div>
                <div>
                  <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>API Version</label>
                  <select value={azureApiVersion} onChange={e => setAzureApiVersion(e.target.value)}
                    style={{ display: "block", width: "100%", marginTop: 4, padding: "9px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg }}>
                    <option value="2024-08-01-preview">2024-08-01-preview (Recommended)</option>
                    <option value="2024-05-01-preview">2024-05-01-preview</option>
                    <option value="2023-12-01-preview">2023-12-01-preview</option>
                  </select>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Save fields + Test */}
        <div style={{ display: "flex", gap: 12, marginBottom: 20 }}>
          <Btn onClick={handleSave} variant="success" disabled={saving}>{saving ? "Saving..." : "💾 Save Fields"}</Btn>
          <Btn onClick={handleTest} variant="outline" disabled={testing}>{testing ? "Testing..." : "🔌 Test Connection"}</Btn>
        </div>
        <div style={{ fontSize: 11, color: C.muted, marginTop: -12, marginBottom: 16 }}>
          Switching providers saves instantly (click card). Use "Save Fields" when you change URLs, models, or API keys.
        </div>

        {testResult && (
          <div style={{ background: testResult.success ? C.tealSoft : C.accentSoft, border: `1px solid ${testResult.success ? C.teal : C.accent}`, borderRadius: 10, padding: "12px 18px", marginBottom: 20 }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: testResult.success ? C.teal : C.accent }}>{testResult.success ? "✅" : "❌"} {testResult.provider?.toUpperCase() || "LLM"}</span>
            <span style={{ fontSize: 12, color: C.text, marginLeft: 10 }}>{testResult.message}</span>
          </div>
        )}

        {/* System Info */}
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
          <div style={{ padding: "14px 20px", borderBottom: `1px solid ${C.border}`, fontSize: 14, fontFamily: font.head, fontWeight: 700 }}>🗄 System Info</div>
          <div style={{ padding: 20, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            {[["Backend", "FastAPI · http://127.0.0.1:8000"], ["Database", "SQLite · ./database/cms.db"], ["Upload Folder", "./uploads"], ["Word Generator", "python-docx"]].map(([k, v]) => (
              <div key={k}>
                <div style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>{k}</div>
                <div style={{ fontSize: 13, color: C.text, marginTop: 3, fontFamily: font.mono }}>{v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function PageJDManager({ setPage }) {
  const [jds, setJds] = useState([]);
  const [clientName, setClientName] = useState("");
  const [jobTitle, setJobTitle] = useState("");
  const [jdText, setJdText] = useState("");
  const [saving, setSaving] = useState(false);

  const load = () => api.getJDs().then(setJds);
  useEffect(() => { load(); }, []);

  const handleCreate = async () => {
    if (!clientName.trim() || !jobTitle.trim() || !jdText.trim()) {
      alert("Please fill in all fields.");
      return;
    }
    setSaving(true);
    const res = await api.createJD({ client_name: clientName, job_title: jobTitle, jd_text: jdText });
    setSaving(false);
    if (res.id) {
      setClientName(""); setJobTitle(""); setJdText("");
      load();
    } else {
      alert("Failed to create JD: " + (res.detail || res.error || "Unknown error"));
    }
  };

  const handleDelete = async (id, name) => {
    if (!confirm(`Deactivate JD: "${name}"?`)) return;
    await api.deleteJD(id);
    load();
  };

  return (
    <div>
      <Topbar title="JD Manager" sub="Create and manage Job Descriptions" setPage={setPage} />
      <div style={{ padding: 28, maxWidth: 900 }}>

        {/* Create new JD */}
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 24, marginBottom: 24 }}>
          <div style={{ fontSize: 14, fontFamily: font.head, fontWeight: 700, marginBottom: 16 }}>➕ Create New Job Description</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>
            <div>
              <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Company / Client Name</label>
              <input value={clientName} onChange={e => setClientName(e.target.value)} placeholder="e.g. Infosys, TCS" style={{ display: "block", width: "100%", marginTop: 4, padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg }} />
            </div>
            <div>
              <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Job Title / Role</label>
              <input value={jobTitle} onChange={e => setJobTitle(e.target.value)} placeholder="e.g. AI Prompt Engineer" style={{ display: "block", width: "100%", marginTop: 4, padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg }} />
            </div>
          </div>
          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Job Description / Requirements</label>
            <textarea value={jdText} onChange={e => setJdText(e.target.value)} placeholder="Paste the full job description or key requirements here..." rows={6} style={{ display: "block", width: "100%", marginTop: 4, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 12, background: C.bg, resize: "vertical", fontFamily: font.mono }} />
          </div>
          <Btn onClick={handleCreate} disabled={saving}>{saving ? "Saving..." : "💾 Save JD"}</Btn>
        </div>

        {/* Existing JDs */}
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
          <div style={{ padding: "14px 20px", borderBottom: `1px solid ${C.border}`, fontSize: 14, fontFamily: font.head, fontWeight: 700 }}>
            Saved Job Descriptions ({jds.length})
          </div>
          {jds.length === 0 && (
            <div style={{ padding: 32, textAlign: "center", color: C.muted, fontSize: 13 }}>No JDs yet. Create one above to get started.</div>
          )}
          {jds.map((jd, i) => (
            <div key={jd.id} style={{ padding: "14px 20px", borderBottom: i < jds.length - 1 ? `1px solid ${C.border}` : "none", display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16 }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{jd.client_name}</span>
                  <Badge label={jd.job_title} color={C.teal} bg={C.tealSoft} />
                  <span style={{ fontSize: 11, color: C.muted }}>ID: {jd.id}</span>
                </div>
                <div style={{ fontSize: 11, color: C.muted, fontFamily: font.mono, whiteSpace: "pre-wrap", maxHeight: 60, overflowY: "auto" }}>
                  {jd.jd_text.slice(0, 200)}{jd.jd_text.length > 200 ? "..." : ""}
                </div>
              </div>
              <Btn onClick={() => handleDelete(jd.id, jd.client_name)} variant="ghost" small>🗑 Remove</Btn>
            </div>
          ))}
        </div>

        <div style={{ marginTop: 16 }}>
          <Btn onClick={() => setPage("upload")} variant="outline">→ Go to Upload Resume</Btn>
        </div>
      </div>
    </div>
  );
}

function PageJDAlignedList({ setPage, setSelectedId }) {
  const [candidates, setCandidates] = useState([]);
  const [filter, setFilter] = useState("All");
  const [expanded, setExpanded] = useState(null);
  const [approving, setApproving] = useState(null);

  const load = () => api.getJDAligned().then(setCandidates);
  useEffect(() => { load(); }, []);

  const filtered = filter === "All" ? candidates
    : filter === "Approved" ? candidates.filter(c => c.status === "Approved")
    : candidates.filter(c => c.status !== "Approved");

  const handleApprove = async (id) => {
    setApproving(id);
    const res = await api.approve(id);
    setApproving(null);
    if (res.success) { load(); alert("✅ Candidate approved!"); }
    else alert("Failed: " + (res.error || "Error"));
  };

  const versionColor = (v) => v === "AI_SIMULATED" ? C.teal : v === "JD_ALIGNED" ? "#7c6af7" : C.gold;
  const versionBg = (v) => v === "AI_SIMULATED" ? C.tealSoft : v === "JD_ALIGNED" ? "#eeecff" : C.goldSoft;
  const versionLabel = (v) => v === "AI_SIMULATED" ? "User Edited" : v === "JD_ALIGNED" ? "AI Draft" : v || "Original";

  return (
    <div>
      <Topbar title="JD-Aligned Resumes" sub="Candidates with JD-aligned resume drafts" setPage={setPage} />
      <div style={{ padding: 28 }}>

        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 20 }}>
          <StatCard label="Total Aligned" value={candidates.length} color={C.teal} />
          <StatCard label="Approved" value={candidates.filter(c => c.status === "Approved").length} color="#4ade80" />
          <StatCard label="Pending Approval" value={candidates.filter(c => c.status !== "Approved").length} color={C.gold} />
          <StatCard label="User Edited" value={candidates.filter(c => c.resume_version_type === "AI_SIMULATED").length} color={C.accent} />
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          {["All", "Approved", "Pending"].map(s => (
            <button key={s} onClick={() => setFilter(s)} style={{ padding: "6px 18px", borderRadius: 20, cursor: "pointer", border: filter === s ? `1px solid ${C.teal}` : `1px solid ${C.border}`, background: filter === s ? C.tealSoft : "transparent", color: filter === s ? C.teal : C.muted, fontSize: 12, fontWeight: 600 }}>{s}</button>
          ))}
        </div>

        {filtered.length === 0 && (
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 48, textAlign: "center", color: C.muted }}>
            <div style={{ fontSize: 32, marginBottom: 12 }}>📊</div>
            <div style={{ fontSize: 14, marginBottom: 6 }}>No JD-aligned resumes yet</div>
            <div style={{ fontSize: 12 }}>Go to <span style={{ color: C.accent, cursor: "pointer", fontWeight: 700 }} onClick={() => setPage("jdalign")}>JD Alignment</span> to generate aligned drafts.</div>
          </div>
        )}

        {filtered.map((c) => (
          <div key={c.id} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 14, overflow: "hidden" }}>
            {/* Summary row */}
            <div style={{ display: "flex", alignItems: "center", gap: 16, padding: "14px 20px", cursor: "pointer" }} onClick={() => setExpanded(expanded === c.id ? null : c.id)}>
              <Avatar initials={(c.name || "??").slice(0, 2).toUpperCase()} size={40} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{c.name || "Unknown"}</span>
                  <Badge label={versionLabel(c.resume_version_type)} color={versionColor(c.resume_version_type)} bg={versionBg(c.resume_version_type)} />
                  <Badge label={c.status} color={c.status === "Approved" ? "#4ade80" : C.gold} bg={c.status === "Approved" ? "#f0fff4" : C.goldSoft} />
                  {c.score > 0 && <Badge label={`${c.score}% match`} color={c.score >= 75 ? C.teal : C.accent} bg={c.score >= 75 ? C.tealSoft : C.accentSoft} />}
                </div>
                <div style={{ fontSize: 11, color: C.muted, marginTop: 3 }}>
                  {c.email && <span>✉ {c.email}  </span>}
                  {c.mobile && <span>✆ {c.mobile}  </span>}
                  {c.location && <span>📍 {c.location}  </span>}
                </div>
                <div style={{ fontSize: 11, color: C.muted }}>
                  {c.client_requirement ? `${c.client_requirement.client_name} — ${c.client_requirement.job_title}` : c.company_name || ""}
                  {c.created_at && <span>  ·  {c.created_at.slice(0, 10)}</span>}
                </div>
              </div>
              <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                {c.status !== "Approved" && (
                  <Btn onClick={(e) => { e.stopPropagation(); handleApprove(c.id); }} variant="success" small disabled={approving === c.id}>{approving === c.id ? "..." : "✓ Approve"}</Btn>
                )}
                <Btn onClick={(e) => { e.stopPropagation(); api.downloadResume(c.id); }} variant="outline" small>⬇ .docx</Btn>
                <Btn onClick={(e) => { e.stopPropagation(); setSelectedId(c.id); setPage("jdalign"); }} variant="ghost" small>✏ Edit</Btn>
                <span style={{ fontSize: 18, color: C.muted, paddingLeft: 4 }}>{expanded === c.id ? "▲" : "▼"}</span>
              </div>
            </div>

            {/* Expanded detail */}
            {expanded === c.id && (
              <div style={{ borderTop: `1px solid ${C.border}`, padding: "16px 20px", background: C.bg }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 14 }}>
                  {c.strengths?.length > 0 && (
                    <div style={{ background: C.tealSoft, border: `1px solid ${C.teal}44`, borderRadius: 8, padding: 14 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.teal, marginBottom: 8 }}>✅ Strengths</div>
                      {c.strengths.map((s, i) => <div key={i} style={{ fontSize: 11, color: C.text, marginBottom: 3 }}>• {s}</div>)}
                    </div>
                  )}
                  {c.gaps?.length > 0 && (
                    <div style={{ background: C.accentSoft, border: `1px solid ${C.accent}44`, borderRadius: 8, padding: 14 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 8 }}>⚠ Gaps vs JD</div>
                      {c.gaps.map((g, i) => <div key={i} style={{ fontSize: 11, color: C.text, marginBottom: 3 }}>• {g}</div>)}
                    </div>
                  )}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                  <div>
                    <div style={{ fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.08em", marginBottom: 6 }}>ALIGNED RESUME (Saved Draft)</div>
                    <textarea readOnly value={c.manual_resume_text || c.improved_resume_text || "No draft saved yet"} style={{ width: "100%", height: 320, padding: "10px 12px", border: `1px solid ${C.teal}44`, borderRadius: 8, fontSize: 10, fontFamily: font.mono, background: "#f0fffe", resize: "vertical", lineHeight: 1.6 }} />
                  </div>
                  {c.client_requirement?.jd_text && (
                    <div>
                      <div style={{ fontSize: 10, color: C.muted, fontWeight: 700, letterSpacing: "0.08em", marginBottom: 6 }}>JD — {c.client_requirement.client_name} · {c.client_requirement.job_title}</div>
                      <textarea readOnly value={c.client_requirement.jd_text} style={{ width: "100%", height: 320, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 10, fontFamily: font.mono, background: C.bg, resize: "vertical", lineHeight: 1.6 }} />
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [ollamaOnline, setOllamaOnline] = useState(false);
  const [ollamaProvider, setOllamaProvider] = useState("ollama");

  const refreshStatus = () => api.ollamaStatus().then(s => {
    setOllamaOnline(s.online);
    setOllamaProvider(s.provider || "ollama");
  });

  useEffect(() => {
    refreshStatus();
    const interval = setInterval(refreshStatus, 30000);
    return () => clearInterval(interval);
  }, []);

  const pages = {
    dashboard: <PageDashboard setPage={setPage} />,
    jdmanager: <PageJDManager setPage={setPage} />,
    upload: <PageUpload setPage={setPage} setSelectedId={setSelectedId} />,
    listing: <PageListing setPage={setPage} setSelectedId={setSelectedId} />,
    review: <PageReview setPage={setPage} selectedId={selectedId} />,
    jdalign: <PageJDAlign setPage={setPage} selectedId={selectedId} />,
    jdalignlist: <PageJDAlignedList setPage={setPage} setSelectedId={setSelectedId} />,
    pipeline: <PagePipeline setPage={setPage} ollamaOnline={ollamaOnline} />,
    settings: <PageSettings setPage={setPage} onSave={refreshStatus} />,
  };

  return (
    <div style={{ display: "flex", background: C.bg, minHeight: "100vh" }}>
      <Sidebar active={page} setPage={setPage} ollamaOnline={ollamaOnline} ollamaProvider={ollamaProvider} />
      <div style={{ marginLeft: 220, flex: 1, minHeight: "100vh", overflow: "auto" }}>
        {pages[page]}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
